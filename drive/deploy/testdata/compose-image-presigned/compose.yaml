# Generated by `drive init --target compose --delivery presigned --image ghcr.io/shibukawa/streamuploader-drive:v0.1.0 --name mydrive --port 18080`.
# Every value comes from the .env file next to this one: edit .env to change
# ports, the bucket or the credentials. Re-running `drive init --force`
# regenerates both files from the flags, not from your edits.

services:
  rustfs:
    image: ${RUSTFS_IMAGE}
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${SU_S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${SU_S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  drive:
    image: ${DRIVE_IMAGE}
    depends_on:
      - rustfs
    restart: on-failure
    env_file:
      - .env
    ports:
      - "${DRIVE_PORT}:8080"
    volumes:
      - ./security.yaml:/etc/drive/security.yaml:ro
      # The search index is a cache rebuilt from the bucket. It lives under
      # /tmp because that is the directory the image's nonroot user can write.
      - drive-index:/tmp

volumes:
  rustfs-data:
  drive-index:
