id: system:openai-compatible-api-processor
type: system
title: OpenAI Compatible API Processor
summary: OpenAI compatible API processor calls configurable OpenAI-compatible HTTP
  APIs for OCR, image analysis, summaries, labels, and custom enrichment.
facts:
  legacy_body: "OpenAI compatible API processor calls configurable OpenAI-compatible\
    \ HTTP APIs for OCR, image analysis, summaries, labels, and custom enrichment.\n\
    \n```yaml\ncapabilities:\n  - OCR or visual text extraction from images or rendered\
    \ pages\n  - image analysis and labeling\n  - extracted text summarization\n \
    \ - document classification\n  - metadata enrichment\n  - custom JSON extraction\
    \ from text or file-derived inputs\nconfiguration:\n  - data:openai-compatible-processor-config\n\
    input_materials:\n  original_file:\n    allowed_when: explicit policy allows sending\
    \ file bytes to provider\n    strategies:\n      - inline base64 for small supported\
    \ media\n      - temporary scoped URL when provider can fetch and policy allows\n\
    \      - rejected when privacy classification forbids external file bytes\n  previous_results:\n\
    \    examples:\n      - data:extracted-content extracted_text\n      - data:extracted-content\
    \ ocr_text\n      - data:processor-result metadata or labels\n      - derived\
    \ document preview page image\n      - image thumbnail\nprompt_binding:\n  - render\
    \ prompt templates with safe variables only\n  - allow file facts, metadata fields,\
    \ extracted text, OCR text, processor results, and bounded snippets\n  - require\
    \ size and token limits before request construction\n  - keep raw secrets out\
    \ of prompt variables\nresponse_handling:\n  - prefer OpenAI-compatible response_format\
    \ json_schema when provider supports it\n  - validate parsed JSON against configured\
    \ JSON schema\n  - reject or mark failed when schema validation fails\n  - normalize\
    \ output into data:processor-result\nsecurity:\n  - endpoint allowlist or explicit\
    \ configured URL required\n  - no arbitrary user-supplied URLs\n  - headers may\
    \ interpolate only allowlisted environment variables\n  - redact headers and prompt\
    \ secrets from logs\n  - audit provider base URL, model, request id, token usage,\
    \ and output schema version when available\nreferences:\n  - data:openai-compatible-processor-config\n\
    \  - data:processor-result\n  - data:extracted-content\n  - policy:processor-execution-policy\n\
    \  - policy:external-delegation-policy\n  - policy:search-extraction-policy\n\
    ```"
  capabilities:
  - OCR or visual text extraction from images or rendered pages
  - image analysis and labeling
  - extracted text summarization
  - document classification
  - metadata enrichment
  - custom JSON extraction from text or file-derived inputs
  configuration:
  - data:openai-compatible-processor-config
  input_materials:
    original_file:
      allowed_when: explicit policy allows sending file bytes to provider
      strategies:
      - inline base64 for small supported media
      - temporary scoped URL when provider can fetch and policy allows
      - rejected when privacy classification forbids external file bytes
    previous_results:
      examples:
      - data:extracted-content extracted_text
      - data:extracted-content ocr_text
      - data:processor-result metadata or labels
      - derived document preview page image
      - image thumbnail
  prompt_binding:
  - render prompt templates with safe variables only
  - allow file facts, metadata fields, extracted text, OCR text, processor results,
    and bounded snippets
  - require size and token limits before request construction
  - keep raw secrets out of prompt variables
  response_handling:
  - prefer OpenAI-compatible response_format json_schema when provider supports it
  - validate parsed JSON against configured JSON schema
  - reject or mark failed when schema validation fails
  - normalize output into data:processor-result
  security:
  - endpoint allowlist or explicit configured URL required
  - no arbitrary user-supplied URLs
  - headers may interpolate only allowlisted environment variables
  - redact headers and prompt secrets from logs
  - audit provider base URL, model, request id, token usage, and output schema version
    when available
  references:
  - data:openai-compatible-processor-config
  - data:processor-result
  - data:extracted-content
  - policy:processor-execution-policy
  - policy:external-delegation-policy
  - policy:search-extraction-policy
relations:
- relation: mentions
  to: data:extracted-content
  resolution: resolved
- relation: mentions
  to: data:openai-compatible-processor-config
  resolution: resolved
