id: system:thumbnail-converter
type: system
title: Thumbnail Converter
summary: Thumbnail converter creates static image thumbnails locally or through an
  explicitly configured external one-shot converter.
facts:
  legacy_body: "Thumbnail converter creates static image thumbnails locally or through\
    \ an explicitly configured external one-shot converter.\n\n```yaml\nroles:\n \
    \ in_process_go:\n    use_when:\n      - source is decodable by Go image stack\
    \ or registered codec\n      - selected output backend is linked into current\
    \ build\n    pipeline:\n      - tee upload stream to original object writer and\
    \ thumbnail decoder when safe limits allow\n      - resize in memory with pixel\
    \ and byte limits\n      - encode selected format\n      - write data:derived-asset\
    \ object to system:s3-storage\n  local_tool:\n    use_when:\n      - Go cannot\
    \ decode source\n      - requested codec is unavailable in current build\n   \
    \   - deployment prefers native tool performance\n    candidates:\n      - sips\
    \ on macOS only when startup probe detects the binary and requested output format\
    \ support\n      - vips for fast resize and AVIF/WebP output\n      - ffmpeg for\
    \ broad decode fallback only with encoders detected by startup probe\n      -\
    \ exiftool or equivalent metadata extractor for embedded image thumbnails when\
    \ available\n      - image/jpeg final fallback when modern output is unavailable\n\
    \  external_webhook:\n    use_when:\n      - data:thumbnail-generation-config\
    \ external_processing enabled\n      - SU_THUMBNAIL_WEBHOOK_URL is configured\n\
    \    behavior:\n      - POST streamed source bytes to configured webhook URL\n\
    \      - include desired size, fit, output policy, source object key, and lossless\
    \ policy in request headers\n      - accept 2xx response body as generated thumbnail\
    \ bytes\n      - read Content-Type plus optional X-Thumbnail-Width, X-Thumbnail-Height,\
    \ and X-Thumbnail-Backend response headers\n  tool_subcommand:\n    name: thumbnail-convert\n\
    \    image: system:linux-tool-worker-image or tools image\n    purpose:\n    \
    \  - run one-shot conversion in Lambda, Cloud Run, worker container, or local\
    \ command\n      - keep front streamuploader image distroless while tools image\
    \ carries codecs\n    io_contract:\n      input: source image bytes on stdin plus\
    \ flags for width, height, fit, format, and lossless policy\n      output: thumbnail\
    \ bytes on stdout plus JSON conversion metadata on stderr\nbackend_selection:\n\
    \  startup_plan:\n    - build one thumbnail execution plan at process startup\
    \ or thumbnail-convert startup\n    - include CGO availability, Go encoder candidates,\
    \ external webhook mode, sips formats, and ffmpeg encoders\n    - runtime conversion\
    \ follows the precomputed plan and does not perform encoder discovery\n  go_decodable:\n\
    \    cgo_enabled:\n      - prefer vegidio/avif-go for image/avif encode when selected\n\
    \      - prefer chai2010/webp for image/webp encode when selected\n    cgo_disabled:\n\
    \      - use external tools for AVIF/WebP when configured\n      - use eringen/gowebper\
    \ for pure-Go lossless/simple WebP fallback\n      - use image/jpeg final static\
    \ fallback\n  go_not_decodable:\n    - skip Go decode path\n    - try configured\
    \ external webhook first when enabled\n    - try embedded thumbnail extraction\
    \ before full-source rasterization when source type supports it\n    - try sips\
    \ candidates from startup plan on macOS when applicable\n    - try ffmpeg candidates\
    \ from startup plan, preferring AVIF or WebP encoders before JPEG\n    - use sips,\
    \ vips, or ffmpeg for TIFF, HEIF/HEIC, JPEG 2000, JPEG XL, BMP, PSD, and TGA when\
    \ startup probe confirms decode support\n    - fallback to image/jpeg only after\
    \ successful decode and resize\nformat_support:\n  current_server_thumbnail_eligible:\n\
    \    - image/jpeg\n    - image/pjpeg\n    - image/png\n    - image/gif\n    -\
    \ image/webp\n    - image/avif\n  target_decode_or_extract:\n    - image/tiff\n\
    \    - image/bmp\n    - image/heif\n    - image/heic\n    - image/jp2\n    - image/jpx\n\
    \    - image/jxl\n    - image/vnd.adobe.photoshop\n    - image/x-photoshop\n \
    \   - image/x-tga\n    - image/tga\n  macos_sips_probe_targets:\n    - image/tiff\n\
    \    - image/bmp\n    - image/heif\n    - image/heic\n    - image/jp2\n    - image/jpx\n\
    \    - image/jxl\n    - image/vnd.adobe.photoshop\n    - image/x-tga\n    - application/pdf\
    \ fallback only\nperformance:\n  - use io.MultiWriter or equivalent tee so original\
    \ upload storage and thumbnail decode can begin from one stream\n  - isolate thumbnail\
    \ errors from original upload unless execution mode requires generated asset readiness\n\
    \  - sequential mode waits for converter completion before wait endpoint reports\
    \ ready\n  - async mode records pending data:derived-asset and lets converter\
    \ finish independently\noperations:\n  - probe available libraries and tools at\
    \ startup\n  - log selected thumbnail backend and output format at info level\n\
    \  - include backend version and fallback reason in audit/status when available\n\
    references:\n  - data:thumbnail-generation-config\n  - data:derived-asset\n  -\
    \ data:processor-result\n  - system:s3-storage\n  - system:linux-tool-worker-image\n\
    \  - system:external-tool-registry\n  - policy:tool-backend-selection-policy\n\
    \  - policy:external-delegation-policy\n  - requirement:expanded-thumbnail-source-support\n\
    ```"
  roles:
    in_process_go:
      use_when:
      - source is decodable by Go image stack or registered codec
      - selected output backend is linked into current build
      pipeline:
      - tee upload stream to original object writer and thumbnail decoder when safe
        limits allow
      - resize in memory with pixel and byte limits
      - encode selected format
      - write data:derived-asset object to system:s3-storage
    local_tool:
      use_when:
      - Go cannot decode source
      - requested codec is unavailable in current build
      - deployment prefers native tool performance
      candidates:
      - sips on macOS only when startup probe detects the binary and requested output
        format support
      - vips for fast resize and AVIF/WebP output
      - ffmpeg for broad decode fallback only with encoders detected by startup probe
      - exiftool or equivalent metadata extractor for embedded image thumbnails when
        available
      - image/jpeg final fallback when modern output is unavailable
    external_webhook:
      use_when:
      - data:thumbnail-generation-config external_processing enabled
      - SU_THUMBNAIL_WEBHOOK_URL is configured
      behavior:
      - POST streamed source bytes to configured webhook URL
      - include desired size, fit, output policy, source object key, and lossless
        policy in request headers
      - accept 2xx response body as generated thumbnail bytes
      - read Content-Type plus optional X-Thumbnail-Width, X-Thumbnail-Height, and
        X-Thumbnail-Backend response headers
    tool_subcommand:
      name: thumbnail-convert
      image: system:linux-tool-worker-image or tools image
      purpose:
      - run one-shot conversion in Lambda, Cloud Run, worker container, or local command
      - keep front streamuploader image distroless while tools image carries codecs
      io_contract:
        input: source image bytes on stdin plus flags for width, height, fit, format,
          and lossless policy
        output: thumbnail bytes on stdout plus JSON conversion metadata on stderr
  backend_selection:
    startup_plan:
    - build one thumbnail execution plan at process startup or thumbnail-convert startup
    - include CGO availability, Go encoder candidates, external webhook mode, sips
      formats, and ffmpeg encoders
    - runtime conversion follows the precomputed plan and does not perform encoder
      discovery
    go_decodable:
      cgo_enabled:
      - prefer vegidio/avif-go for image/avif encode when selected
      - prefer chai2010/webp for image/webp encode when selected
      cgo_disabled:
      - use external tools for AVIF/WebP when configured
      - use eringen/gowebper for pure-Go lossless/simple WebP fallback
      - use image/jpeg final static fallback
    go_not_decodable:
    - skip Go decode path
    - try configured external webhook first when enabled
    - try embedded thumbnail extraction before full-source rasterization when source
      type supports it
    - try sips candidates from startup plan on macOS when applicable
    - try ffmpeg candidates from startup plan, preferring AVIF or WebP encoders before
      JPEG
    - use sips, vips, or ffmpeg for TIFF, HEIF/HEIC, JPEG 2000, JPEG XL, BMP, PSD,
      and TGA when startup probe confirms decode support
    - fallback to image/jpeg only after successful decode and resize
  format_support:
    current_server_thumbnail_eligible:
    - image/jpeg
    - image/pjpeg
    - image/png
    - image/gif
    - image/webp
    - image/avif
    target_decode_or_extract:
    - image/tiff
    - image/bmp
    - image/heif
    - image/heic
    - image/jp2
    - image/jpx
    - image/jxl
    - image/vnd.adobe.photoshop
    - image/x-photoshop
    - image/x-tga
    - image/tga
    macos_sips_probe_targets:
    - image/tiff
    - image/bmp
    - image/heif
    - image/heic
    - image/jp2
    - image/jpx
    - image/jxl
    - image/vnd.adobe.photoshop
    - image/x-tga
    - application/pdf fallback only
  performance:
  - use io.MultiWriter or equivalent tee so original upload storage and thumbnail
    decode can begin from one stream
  - isolate thumbnail errors from original upload unless execution mode requires generated
    asset readiness
  - sequential mode waits for converter completion before wait endpoint reports ready
  - async mode records pending data:derived-asset and lets converter finish independently
  operations:
  - probe available libraries and tools at startup
  - log selected thumbnail backend and output format at info level
  - include backend version and fallback reason in audit/status when available
  references:
  - data:thumbnail-generation-config
  - data:derived-asset
  - data:processor-result
  - system:s3-storage
  - system:linux-tool-worker-image
  - system:external-tool-registry
  - policy:tool-backend-selection-policy
  - policy:external-delegation-policy
  - requirement:expanded-thumbnail-source-support
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:processor-result
  resolution: resolved
- relation: mentions
  to: data:thumbnail-generation-config
  resolution: resolved
- relation: mentions
  to: policy:external-delegation-policy
  resolution: resolved
- relation: mentions
  to: policy:tool-backend-selection-policy
  resolution: resolved
