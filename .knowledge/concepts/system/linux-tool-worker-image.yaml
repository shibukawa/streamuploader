id: system:linux-tool-worker-image
type: system
title: Linux Tool Worker Image
summary: Linux tool worker image provides a deterministic external-tool runtime for
  preview, thumbnail, document, OCR, metadata, and variant jobs.
facts:
  legacy_body: "Linux tool worker image provides a deterministic external-tool runtime\
    \ for preview, thumbnail, document, OCR, metadata, and variant jobs.\n\n```yaml\n\
    purpose:\n  - ship common Linux binaries required by worker features\n  - reduce\
    \ host dependency drift\n  - make startup capability probes reproducible\n  -\
    \ provide fallback tools for text and metadata cases not covered by Go libraries\n\
    \  - provide preferred fast native tools for image and video transforms\nimage_roles:\n\
    \  combined_service:\n    description: Go service and worker run in same image\
    \ for small deployments\n  worker_only:\n    description: API service stays slim;\
    \ background worker uses tool image\n  tools_nooffice:\n    description: tool\
    \ worker image excluding LibreOffice for faster pull/start when Office conversion\
    \ is not required\npackages:\n  required_base:\n    - ca-certificates\n    - file\n\
    \    - tini\n    - fonts for expected document languages\n  media:\n    - ffmpeg\n\
    \  office_preview:\n    - libreoffice\n    - poppler-utils when MuPDF package\
    \ is unavailable in base distro\n  pdf_preview:\n    - MuPDF when package exists\
    \ in base distro\n    - poppler-utils acceptable in tool Docker when MuPDF package\
    \ is unavailable\n  text_extraction:\n    - mutool for PDF text or metadata fallback\
    \ when supported\n    - poppler-utils for pdftotext when tool Docker uses Poppler\
    \ fallback\n    - libimage-exiftool-perl\n    - Apache Tika optional\n    - pandoc\
    \ optional\n    - catdoc or antiword optional for legacy .doc\n  svg_preview:\n\
    \    - librsvg2-bin for rsvg-convert\n    - inkscape optional high fidelity fallback\n\
    \  ocr:\n    - tesseract-ocr\n    - language packs selected by deployment\n  \
    \  - OCRmyPDF optional for searchable PDF generation\n  sidecars:\n    - Apache\
    \ Tika Server optional\n    - Gotenberg optional\n    - Unstructured optional\n\
    \  download_variant:\n    - zstd\n  metadata_strip:\n    - libimage-exiftool-perl\
    \ optional\nvariants:\n  default:\n    includes:\n      - LibreOffice\n      -\
    \ Poppler when MuPDF package is unavailable\n    excludes:\n      - MuPDF package\
    \ when unavailable in selected base distro\n  nooffice:\n    includes:\n     \
    \ - Poppler when MuPDF package is unavailable\n      - media, SVG, OCR, metadata,\
    \ and download variant tools\n    excludes:\n      - LibreOffice\n      - soffice\
    \ and libreoffice symlinks\n      - MuPDF package when unavailable in selected\
    \ base distro\npdf_tool_install_order:\n  - remove lower-priority PDF renderer\
    \ packages before installing MuPDF when the base distro provides a MuPDF package\n\
    \  - keep Poppler in tool Docker when MuPDF package is unavailable\n  - probe\
    \ mutool before any fallback renderer at startup\nclamav:\n  - do not install\
    \ ClamAV in this tool worker image\n  - run ClamAV as a separate clamd container\
    \ or managed scanner endpoint\n  - connect from API service through system:clamav\
    \ when enabled\noperations:\n  - run non-root\n  - pin distro and package versions\
    \ where reproducibility matters\n  - publish detected versions in health/status\n\
    \  - keep macOS-only backends outside Linux image\nreferences:\n  - system:external-tool-registry\n\
    \  - system:text-extractor\n  - system:ocr-engine\n  - policy:tool-backend-selection-policy\n\
    ```"
  purpose:
  - ship common Linux binaries required by worker features
  - reduce host dependency drift
  - make startup capability probes reproducible
  - provide fallback tools for text and metadata cases not covered by Go libraries
  - provide preferred fast native tools for image and video transforms
  image_roles:
    combined_service:
      description: Go service and worker run in same image for small deployments
    worker_only:
      description: API service stays slim; background worker uses tool image
    tools_nooffice:
      description: tool worker image excluding LibreOffice for faster pull/start when
        Office conversion is not required
  packages:
    required_base:
    - ca-certificates
    - file
    - tini
    - fonts for expected document languages
    media:
    - ffmpeg
    office_preview:
    - libreoffice
    - poppler-utils when MuPDF package is unavailable in base distro
    pdf_preview:
    - MuPDF when package exists in base distro
    - poppler-utils acceptable in tool Docker when MuPDF package is unavailable
    text_extraction:
    - mutool for PDF text or metadata fallback when supported
    - poppler-utils for pdftotext when tool Docker uses Poppler fallback
    - libimage-exiftool-perl
    - Apache Tika optional
    - pandoc optional
    - catdoc or antiword optional for legacy .doc
    svg_preview:
    - librsvg2-bin for rsvg-convert
    - inkscape optional high fidelity fallback
    ocr:
    - tesseract-ocr
    - language packs selected by deployment
    - OCRmyPDF optional for searchable PDF generation
    sidecars:
    - Apache Tika Server optional
    - Gotenberg optional
    - Unstructured optional
    download_variant:
    - zstd
    metadata_strip:
    - libimage-exiftool-perl optional
  variants:
    default:
      includes:
      - LibreOffice
      - Poppler when MuPDF package is unavailable
      excludes:
      - MuPDF package when unavailable in selected base distro
    nooffice:
      includes:
      - Poppler when MuPDF package is unavailable
      - media, SVG, OCR, metadata, and download variant tools
      excludes:
      - LibreOffice
      - soffice and libreoffice symlinks
      - MuPDF package when unavailable in selected base distro
  pdf_tool_install_order:
  - remove lower-priority PDF renderer packages before installing MuPDF when the base
    distro provides a MuPDF package
  - keep Poppler in tool Docker when MuPDF package is unavailable
  - probe mutool before any fallback renderer at startup
  clamav:
  - do not install ClamAV in this tool worker image
  - run ClamAV as a separate clamd container or managed scanner endpoint
  - connect from API service through system:clamav when enabled
  operations:
  - run non-root
  - pin distro and package versions where reproducibility matters
  - publish detected versions in health/status
  - keep macOS-only backends outside Linux image
  references:
  - system:external-tool-registry
  - system:text-extractor
  - system:ocr-engine
  - policy:tool-backend-selection-policy
relations:
- relation: mentions
  to: policy:tool-backend-selection-policy
  resolution: resolved
- relation: mentions
  to: system:clamav
  resolution: resolved
- relation: mentions
  to: system:external-tool-registry
  resolution: resolved
- relation: mentions
  to: system:ocr-engine
  resolution: resolved
- relation: mentions
  to: system:text-extractor
  resolution: resolved
history:
  bdf-migration-2026-10-07:
    summary: PDF and OOXML thumbnails, search text and previews moved in-process to bdf (requirement:bdf-document-processing). LibreOffice, mutool, pdftotext and the embedded OOXML thumbnail path were removed; statements below about them are historical.
    supersedes: [requirement:bdf-document-processing]
