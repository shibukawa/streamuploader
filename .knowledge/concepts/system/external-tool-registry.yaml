id: system:external-tool-registry
type: system
title: External Tool Registry
summary: External tool registry probes installed binaries at startup and selects backends
  for non-Go media, document, and scan features.
facts:
  legacy_body: "External tool registry probes installed binaries at startup and selects\
    \ backends for non-Go media, document, and scan features.\n\n```yaml\nstartup_probe:\n\
    \  behavior:\n    - check configured absolute paths first\n    - search PATH when\
    \ allowed by deployment policy\n    - run version command\n    - run optional\
    \ smoke test per backend\n    - publish capability matrix in health/status\n \
    \ tools:\n    ffmpeg:\n      commands:\n        - ffmpeg -version\n        - ffprobe\
    \ -version\n      capabilities:\n        - video_preview\n        - hls_generation\n\
    \        - media_metadata_strip\n    avconvert:\n      platform: macOS\n     \
    \ command: avconvert -h\n      capabilities:\n        - video_preview fallback\n\
    \        - simple transcoding fallback\n    sips:\n      platform: macOS\n   \
    \   command: sips --help\n      capabilities:\n        - image_thumbnail fallback\n\
    \        - image_metadata_strip fallback\n    qlmanage:\n      platform: macOS\n\
    \      command: qlmanage -h\n      capabilities:\n        - generic_thumbnail\
    \ fallback\n      note: Quick Look output depends on host plugins and OS version\n\
    \    libreoffice:\n      command: soffice --headless --version\n      capabilities:\n\
    \        - office_to_pdf\n        - office_text_export fallback\n    pdf_renderer:\n\
    \      preferred: mutool\n      candidates:\n        - mutool\n        - pdftoppm\
    \ explicit fallback\n      capabilities:\n        - pdf_page_render\n    mutool:\n\
    \      command: mutool -v\n      capabilities:\n        - pdf_page_render\n  \
    \      - pdf_metadata_inspection fallback\n    pdftotext:\n      command: pdftotext\
    \ -v\n      capabilities:\n        - pdf_text_extraction\n    exiftool:\n    \
    \  command: exiftool -ver\n      capabilities:\n        - metadata_extraction\n\
    \    tika:\n      optional: true\n      command: tika --version\n      capabilities:\n\
    \        - broad_text_extraction\n        - broad_metadata_extraction\n    tesseract:\n\
    \      command: tesseract --version\n      capabilities:\n        - ocr_text_extraction\n\
    \    rsvg_convert:\n      command: rsvg-convert --version\n      capabilities:\n\
    \        - svg_rasterize\n    inkscape:\n      command: inkscape --version\n \
    \     capabilities:\n        - svg_rasterize high_fidelity_fallback\n    clamav:\n\
    \      candidates:\n        - clamdscan\n        - clamscan\n      capabilities:\n\
    \        - virus_scan\n    zstd:\n      command: zstd --version\n      capabilities:\n\
    \        - download_variant_compression\nselection:\n  - choose highest priority\
    \ available backend per capability\n  - disable feature when required backend\
    \ is missing and policy marks it optional\n  - fail startup only for backends\
    \ marked required by deployment configuration\nsecurity:\n  - prefer absolute\
    \ configured paths in production\n  - isolate worker processes\n  - pass arguments\
    \ as argv, not shell strings\n  - enforce timeout, memory, CPU, input, and output\
    \ limits\nreferences:\n  - policy:tool-backend-selection-policy\n  - system:linux-tool-worker-image\n\
    \  - system:text-extractor\n  - system:ocr-engine\n```"
  startup_probe:
    behavior:
    - check configured absolute paths first
    - search PATH when allowed by deployment policy
    - run version command
    - run optional smoke test per backend
    - publish capability matrix in health/status
    tools:
      ffmpeg:
        commands:
        - ffmpeg -version
        - ffprobe -version
        capabilities:
        - video_preview
        - hls_generation
        - media_metadata_strip
      avconvert:
        platform: macOS
        command: avconvert -h
        capabilities:
        - video_preview fallback
        - simple transcoding fallback
      sips:
        platform: macOS
        command: sips --help
        capabilities:
        - image_thumbnail fallback
        - image_metadata_strip fallback
      qlmanage:
        platform: macOS
        command: qlmanage -h
        capabilities:
        - generic_thumbnail fallback
        note: Quick Look output depends on host plugins and OS version
      libreoffice:
        command: soffice --headless --version
        capabilities:
        - office_to_pdf
        - office_text_export fallback
      pdf_renderer:
        preferred: mutool
        candidates:
        - mutool
        - pdftoppm explicit fallback
        capabilities:
        - pdf_page_render
      mutool:
        command: mutool -v
        capabilities:
        - pdf_page_render
        - pdf_metadata_inspection fallback
      pdftotext:
        command: pdftotext -v
        capabilities:
        - pdf_text_extraction
      exiftool:
        command: exiftool -ver
        capabilities:
        - metadata_extraction
      tika:
        optional: true
        command: tika --version
        capabilities:
        - broad_text_extraction
        - broad_metadata_extraction
      tesseract:
        command: tesseract --version
        capabilities:
        - ocr_text_extraction
      rsvg_convert:
        command: rsvg-convert --version
        capabilities:
        - svg_rasterize
      inkscape:
        command: inkscape --version
        capabilities:
        - svg_rasterize high_fidelity_fallback
      clamav:
        candidates:
        - clamdscan
        - clamscan
        capabilities:
        - virus_scan
      zstd:
        command: zstd --version
        capabilities:
        - download_variant_compression
  selection:
  - choose highest priority available backend per capability
  - disable feature when required backend is missing and policy marks it optional
  - fail startup only for backends marked required by deployment configuration
  security:
  - prefer absolute configured paths in production
  - isolate worker processes
  - pass arguments as argv, not shell strings
  - enforce timeout, memory, CPU, input, and output limits
  references:
  - policy:tool-backend-selection-policy
  - system:linux-tool-worker-image
  - system:text-extractor
  - system:ocr-engine
relations:
- relation: mentions
  to: policy:tool-backend-selection-policy
  resolution: resolved
- relation: mentions
  to: system:linux-tool-worker-image
  resolution: resolved
- relation: mentions
  to: system:ocr-engine
  resolution: resolved
- relation: mentions
  to: system:text-extractor
  resolution: resolved
history:
  bdf-migration-2026-10-07:
    summary: PDF and OOXML thumbnails, search text and previews moved in-process to bdf (requirement:bdf-document-processing). LibreOffice, mutool, pdftotext and the embedded OOXML thumbnail path were removed; statements below about them are historical.
    supersedes: [requirement:bdf-document-processing]
