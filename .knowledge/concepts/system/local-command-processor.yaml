id: system:local-command-processor
type: system
title: Local Command Processor
summary: Local command processor runs configured executables with stable JSON stdin
  and expects normalized JSON stdout.
facts:
  legacy_body: "Local command processor runs configured executables with stable JSON\
    \ stdin and expects normalized JSON stdout.\n\n```yaml\npurpose:\n  - provide\
    \ extension point for APIs and tools streamuploader does not natively model\n\
    \  - let operators use aws cli, gcloud, curl, python, node, or internal CLIs\n\
    \  - keep API-specific auth, request shape, retry, and response normalization\
    \ outside streamuploader core\ninvocation:\n  mode: local_command\n  command:\n\
    \    argv: list of strings, shell string forbidden\n    cwd: per-job temporary\
    \ directory\n    env: allowlisted variables and secrets only\n  stdin_json:\n\
    \    processor: processor name\n    timing: policy:processor-execution-policy\
    \ timing\n    upload_key: data:file-item upload_key\n    file:\n      original_name:\
    \ string\n      content_type: string\n      size_bytes: integer\n      checksum_sha256:\
    \ string optional\n    storage:\n      bucket: string\n      object_key: string\n\
    \      endpoint: configured internal endpoint optional\n    local_file:\n    \
    \  path: optional temp path when input materialization is enabled\n    metadata:\n\
    \      existing_extracted: object optional\n  stdout_json: data:processor-result\n\
    security:\n  - absolute command path recommended in production\n  - no shell interpolation\n\
    \  - timeout required\n  - stdout and stderr byte limits required\n  - temporary\
    \ directory removed after job unless debug retention enabled\n  - network access\
    \ is deployment responsibility, not streamuploader guarantee\n  - command exit\
    \ code nonzero maps to warning or failure according to processor config\nreferences:\n\
    \  - policy:processor-execution-policy\n  - data:processor-result\n  - system:external-tool-registry\n\
    \  - policy:external-delegation-policy\n```"
  purpose:
  - provide extension point for APIs and tools streamuploader does not natively model
  - let operators use aws cli, gcloud, curl, python, node, or internal CLIs
  - keep API-specific auth, request shape, retry, and response normalization outside
    streamuploader core
  invocation:
    mode: local_command
    command:
      argv: list of strings, shell string forbidden
      cwd: per-job temporary directory
      env: allowlisted variables and secrets only
    stdin_json:
      processor: processor name
      timing: policy:processor-execution-policy timing
      upload_key: data:file-item upload_key
      file:
        original_name: string
        content_type: string
        size_bytes: integer
        checksum_sha256: string optional
      storage:
        bucket: string
        object_key: string
        endpoint: configured internal endpoint optional
      local_file:
        path: optional temp path when input materialization is enabled
      metadata:
        existing_extracted: object optional
    stdout_json: data:processor-result
  security:
  - absolute command path recommended in production
  - no shell interpolation
  - timeout required
  - stdout and stderr byte limits required
  - temporary directory removed after job unless debug retention enabled
  - network access is deployment responsibility, not streamuploader guarantee
  - command exit code nonzero maps to warning or failure according to processor config
  references:
  - policy:processor-execution-policy
  - data:processor-result
  - system:external-tool-registry
  - policy:external-delegation-policy
relations:
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: data:processor-result
  resolution: resolved
- relation: mentions
  to: policy:external-delegation-policy
  resolution: resolved
- relation: mentions
  to: policy:processor-execution-policy
  resolution: resolved
- relation: mentions
  to: system:external-tool-registry
  resolution: resolved
