id: system:drive-server
type: system
title: Drive server binary
summary: One Go binary that embeds streamuploader through its custom main, serves the Drive API and web UI, talks to the search sidecar, and runs as server, indexer or all-in-one.
lifecycle: active
facts:
  composition:
    - streamuploader handlers mounted in-process (auth hook from api:auth-middleware-extension-api), so upload and Drive share one origin
    - Drive API handlers (api:drive-api)
    - journal writer: one PUT per metadata change
    - overlay reader: lists recent journal keys and patches results
    - index reader: keeps a local cache of the tenant index and restarts or reloads the sidecar when the S3 meta.json ETag changes
    - web UI static assets embedded in the binary
  modes:
    server: public listener plus optional backend listener; no indexing
    indexer: runs system:drive-indexer once or in a loop and exits
    all-in-one: server plus indexer goroutine; SQLite is not used in any mode
  configuration:
    - S3 endpoint, bucket, credentials, prefix (policy:drive-s3-layout)
    - index cache directory and refresh interval
    - sidecar binary path and tokenizer options
    - mode, worm settings, API tokens
  repository_placement:
    proposal: this repository, as cmd/drive plus drive/ packages and a search/ Rust crate, because the binary imports streamuploader as a library
    alternative: a separate repository that imports the streamuploader module
  implemented_2026_10_08:
    entry: cmd/drive/main.go with subcommands serve, reindex, index-once
    packages: drive/server (routes, overlay, files, search, delivery), drive/indexer, drive/journal, drive/meta, drive/sidecar, drive/memstore (in-memory storage.Store for tests and DRIVE_STORAGE=memory), drive/objerr
    streamuploader_embedding: internal/server.New(cfg, store).Handler() mounted under /api/upload/, /api/file/, /api/files/ and /healthz; ApplicationServerURL forced empty so no reverse proxy exists
    delivery_default: proxy (bytes through the server with Range passthrough) so the bdf viewer works without bucket CORS; presigned is a switch (DRIVE_DELIVERY)
    state_file: drive-state.json inside the index directory (last folded journal key, pending text keys); deleting the directory forces a rebuild
    env: DRIVE_TENANT, DRIVE_PREFIX, DRIVE_INDEX_DIR, DRIVE_SEARCH_BIN, DRIVE_SEARCH_TOKENIZER, DRIVE_INDEX_INTERVAL, DRIVE_DELIVERY, DRIVE_STORAGE
    not_yet: streamuploader cleanup loop is not started by the Drive
  implemented_2026_10_09:
    server_mode: drive server starts the sidecar with --read-only and a snapshot follower (drive/snapshot/follower.go) that stands in for the indexer behind the server's IndexerControl interface - LastJournalKey comes from the pointer, Poke is a no-op, the reindex endpoint answers 503 because the follower is not a Rebuilder
    follower_refresh: HEAD the pointer every DRIVE_SNAPSHOT_REFRESH; on change download missing files, write meta.json, sidecar reload, update the meta cache from the pointer's history (only the changed file ids, or a full reload), prune local files
    before_first_publish: a server started before any indexer ran serves an empty index plus the journal overlay and picks the snapshot up on its next refresh
    indexer_mode: drive indexer runs the fold-and-publish loop without an HTTP listener
    memory_storage: server and indexer modes refuse DRIVE_STORAGE=memory because the bucket must be shared
    env: DRIVE_INDEX_SNAPSHOT, DRIVE_SNAPSHOT_REFRESH, DRIVE_SNAPSHOT_GC_GRACE
    scripts: scripts/run-drive-native.sh passes its arguments to the binary and uses .cache/drive/index-<mode> so indexer and server can share one RustFS container on the host
open_questions:
  repository:
    text: Does the Drive live in this repository (cmd/drive) or in its own repository importing streamuploader?
    state: answered
    resolution: Implemented in this repository on 2026-10-08 (cmd/drive, drive/, search/) because the binary imports internal packages of streamuploader; the user did not object when told this was the provisional default.
relations:
  - relation: implements
    to: requirement:local-drive-portable-deployment
  - relation: implements
    to: requirement:local-drive-api-and-web-ui
  - relation: embeds
    to: vision:stream-upload-wrapper
  - relation: depends_on
    to: system:search-sidecar
  - relation: depends_on
    to: system:drive-indexer
  - relation: depends_on
    to: system:object-storage-providers
  - relation: uses
    to: api:auth-middleware-extension-api
