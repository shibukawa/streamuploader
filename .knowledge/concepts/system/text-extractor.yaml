id: system:text-extractor
type: system
title: Text Extractor
summary: Text extractor is an isolated worker that extracts searchable text and metadata
  from accepted files.
facts:
  legacy_body: "Text extractor is an isolated worker that extracts searchable text\
    \ and metadata from accepted files.\n\n```yaml\nselection:\n  - prefer Go libraries\
    \ for EXIF, OOXML, simple PDF text, and text-like formats\n  - use external CLI\
    \ or sidecar only when Go parser coverage or quality is insufficient\n  - probe\
    \ external extraction tools at startup and cache resolved executable paths in\
    \ the extraction plan\n  - never perform tool availability lookup inside per-file\
    \ extraction execution\n  - keep image and video transform heavy paths in external\
    \ tools first because SIMD/native codecs are usually faster\nbackends:\n  direct_text:\n\
    \    capabilities:\n      - text/plain normalization\n      - csv/json/xml/html\
    \ text extraction\n  docx_parser:\n    preferred: true\n    capabilities:\n  \
    \    - OOXML document text extraction\n      - core properties extraction\n  go_exif_parser:\n\
    \    preferred: true\n    capabilities:\n      - allowlisted EXIF extraction\n\
    \      - common image metadata extraction\n  go_office_metadata_parser:\n    preferred:\
    \ true\n    capabilities:\n      - OOXML core properties\n      - document metadata\
    \ allowlist\n  go_pdf_text_parser:\n    preferred: conditional\n    capabilities:\n\
    \      - simple PDF embedded text extraction\n    notes:\n      - fallback to\
    \ pdftotext or Tika when layout or encoding quality is insufficient\n  pandoc:\n\
    \    optional: true\n    capabilities:\n      - document conversion to plain text\
    \ or markdown\n  antiword_or_catdoc:\n    optional: true\n    capabilities:\n\
    \      - legacy .doc text extraction\n  pdftotext:\n    preferred_for_pdf_when_available:\
    \ true\n    startup_probe: pdftotext in PATH\n    execution: pdftotext - -\n \
    \   capabilities:\n      - pdf text extraction\n    fallback: pdf_literal_parser\
    \ when missing, failing, or empty\n  tika:\n    optional: true\n    capabilities:\n\
    \      - broad document text extraction\n      - metadata extraction\n      -\
    \ Office and PDF fallback\n  tika_server:\n    optional: true\n    capabilities:\n\
    \      - sidecar broad text extraction\n      - sidecar metadata extraction\n\
    \  cloud_document_ai:\n    optional: true\n    capabilities:\n      - delegated\
    \ document text extraction\n      - delegated structured extraction\n  libreoffice:\n\
    \    capabilities:\n      - office text export fallback\n      - office to PDF\
    \ for OCR path\n  exiftool:\n    fallback: true\n    command: exiftool -ver\n\
    \    capabilities:\n      - EXIF and file metadata extraction\nconstraints:\n\
    \  - run outside request path\n  - isolate process and temporary files\n  - disable\
    \ external network access\n  - enforce timeout, CPU, memory, input size, page\
    \ count, and output size\n  - normalize output to UTF-8\n  - treat extraction\
    \ failure as derived content failure\nstartup_logging:\n  - emit text_extraction_config\
    \ with enabled, execution mode, object suffix, limits, metadata flag, plain text\
    \ flag, OCR flag, and summary\n  - emit text_extraction_tool for pdftotext, external\
    \ text command, and OCR command with availability and resolved path\n  - emit\
    \ per file-type policy rows with selected text_extraction backend such as direct,\
    \ ooxml, pdftotext, pdf_literal, metadata, metadata+ocr, or external\nreferences:\n\
    \  - flow:text-extraction-generation\n  - data:extracted-content\n  - system:external-tool-registry\n\
    \  - system:external-processing-delegates\n  - policy:external-delegation-policy\n\
    \  - policy:tool-backend-selection-policy\n```"
  selection:
  - prefer Go libraries for EXIF, OOXML, simple PDF text, and text-like formats
  - use external CLI or sidecar only when Go parser coverage or quality is insufficient
  - probe external extraction tools at startup and cache resolved executable paths
    in the extraction plan
  - never perform tool availability lookup inside per-file extraction execution
  - keep image and video transform heavy paths in external tools first because SIMD/native
    codecs are usually faster
  backends:
    direct_text:
      capabilities:
      - text/plain normalization
      - csv/json/xml/html text extraction
    docx_parser:
      preferred: true
      capabilities:
      - OOXML document text extraction
      - core properties extraction
    go_exif_parser:
      preferred: true
      capabilities:
      - allowlisted EXIF extraction
      - common image metadata extraction
    go_office_metadata_parser:
      preferred: true
      capabilities:
      - OOXML core properties
      - document metadata allowlist
    go_pdf_text_parser:
      preferred: conditional
      capabilities:
      - simple PDF embedded text extraction
      notes:
      - fallback to pdftotext or Tika when layout or encoding quality is insufficient
    pandoc:
      optional: true
      capabilities:
      - document conversion to plain text or markdown
    antiword_or_catdoc:
      optional: true
      capabilities:
      - legacy .doc text extraction
    pdftotext:
      preferred_for_pdf_when_available: true
      startup_probe: pdftotext in PATH
      execution: pdftotext - -
      capabilities:
      - pdf text extraction
      fallback: pdf_literal_parser when missing, failing, or empty
    tika:
      optional: true
      capabilities:
      - broad document text extraction
      - metadata extraction
      - Office and PDF fallback
    tika_server:
      optional: true
      capabilities:
      - sidecar broad text extraction
      - sidecar metadata extraction
    cloud_document_ai:
      optional: true
      capabilities:
      - delegated document text extraction
      - delegated structured extraction
    libreoffice:
      capabilities:
      - office text export fallback
      - office to PDF for OCR path
    exiftool:
      fallback: true
      command: exiftool -ver
      capabilities:
      - EXIF and file metadata extraction
  constraints:
  - run outside request path
  - isolate process and temporary files
  - disable external network access
  - enforce timeout, CPU, memory, input size, page count, and output size
  - normalize output to UTF-8
  - treat extraction failure as derived content failure
  startup_logging:
  - emit text_extraction_config with enabled, execution mode, object suffix, limits,
    metadata flag, plain text flag, OCR flag, and summary
  - emit text_extraction_tool for pdftotext, external text command, and OCR command
    with availability and resolved path
  - emit per file-type policy rows with selected text_extraction backend such as direct,
    ooxml, pdftotext, pdf_literal, metadata, metadata+ocr, or external
  references:
  - flow:text-extraction-generation
  - data:extracted-content
  - system:external-tool-registry
  - system:external-processing-delegates
  - policy:external-delegation-policy
  - policy:tool-backend-selection-policy
relations:
- relation: mentions
  to: data:extracted-content
  resolution: resolved
- relation: mentions
  to: flow:text-extraction-generation
  resolution: resolved
- relation: mentions
  to: policy:external-delegation-policy
  resolution: resolved
- relation: mentions
  to: policy:tool-backend-selection-policy
  resolution: resolved
- relation: mentions
  to: system:external-processing-delegates
  resolution: resolved
- relation: mentions
  to: system:external-tool-registry
  resolution: resolved
