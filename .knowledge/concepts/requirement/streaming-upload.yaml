id: requirement:streaming-upload
type: requirement
title: Streaming Upload
summary: The service must process uploaded files as streams and avoid holding whole
  objects in memory or local disk.
facts:
  legacy_body: "The service must process uploaded files as streams and avoid holding\
    \ whole objects in memory or local disk.\n\n```yaml\nrequirements:\n  runtime:\
    \ Go\n  input:\n    - upload session key\n    - metadata JSON request\n    - one\
    \ or more file content streams\n  storage:\n    target: system:s3-storage\n  \
    \  strategy:\n      - multipart upload from service to S3\n      - when post-stream\
    \ security is enabled, write to sibling .tmp key before final publish\n  security_streaming:\n\
    \    - malware scan uses system:clamav TCP INSTREAM without full file buffering\n\
    \    - scanner stream and S3 upload stream run from same request reader through\
    \ io.MultiWriter\n    - archive guard keeps policy:archive-bomb-protection as\
    \ separate zip bomb control\n    - final object key is published only after all\
    \ enabled security gates pass\n  constraints:\n    - bounded memory\n    - client\
    \ must not bypass service file checks\n    - cancel upstream work when client\
    \ disconnects\n    - propagate request context to S3 and upstream HTTP calls\n\
    \    - delete .tmp object after reject, publish, or copy failure\n  references:\n\
    \    - flow:session-assembly\n    - flow:security-gated-upload-acceptance\n  \
    \  - data:upload-record\n    - decision:upload-transport-boundary\n```"
  requirements:
    runtime: Go
    input:
    - upload session key
    - metadata JSON request
    - one or more file content streams
    storage:
      target: system:s3-storage
      strategy:
      - multipart upload from service to S3
      - when post-stream security is enabled, write to sibling .tmp key before final
        publish
    security_streaming:
    - malware scan uses system:clamav TCP INSTREAM without full file buffering
    - scanner stream and S3 upload stream run from same request reader through io.MultiWriter
    - archive guard keeps policy:archive-bomb-protection as separate zip bomb control
    - final object key is published only after all enabled security gates pass
    constraints:
    - bounded memory
    - client must not bypass service file checks
    - cancel upstream work when client disconnects
    - propagate request context to S3 and upstream HTTP calls
    - delete .tmp object after reject, publish, or copy failure
    references:
    - flow:session-assembly
    - flow:security-gated-upload-acceptance
    - data:upload-record
    - decision:upload-transport-boundary
