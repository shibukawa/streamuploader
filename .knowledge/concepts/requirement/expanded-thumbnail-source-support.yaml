id: requirement:expanded-thumbnail-source-support
type: requirement
title: Expanded Thumbnail Source Support
summary: Thumbnail support should cover common modern image formats and extract existing
  representative images before expensive rendering.
facts:
  legacy_body: "Thumbnail support should cover common modern image formats and extract\
    \ existing representative images before expensive rendering.\n\n```yaml\nrequirement:\n\
    \  scope:\n    - static image thumbnails from more source formats\n    - embedded\
    \ thumbnail extraction from images, videos, and Office documents\n    - generated\
    \ fallback when extraction is absent, invalid, or unsafe\n    - video still thumbnail\
    \ with play overlay\n    - configurable number of video keyframes scored for still\
    \ thumbnail selection\n  current_observed_gap:\n    implementation:\n      allowed_image_category:\n\
    \        - image/png\n        - image/jpeg\n        - image/gif\n        - image/webp\n\
    \        - image/avif\n        - image/tiff\n        - image/bmp\n        - image/svg+xml\n\
    \      thumbnail_eligible_server_types:\n        - image/jpeg\n        - image/pjpeg\n\
    \        - image/png\n        - image/gif\n        - image/webp\n        - image/avif\n\
    \      not_currently_listed:\n        - image/heif\n        - image/heic\n   \
    \     - image/jxl\n        - image/jp2\n        - image/jpx\n    knowledge:\n\
    \      - data:thumbnail-generation-config did not define embedded thumbnail extraction\n\
    \      - flow:video-preview-generation described animated preview, not still thumbnail\
    \ selection\n  target_source_priority:\n    image:\n      - validate and use embedded\
    \ thumbnail when present and good enough\n      - generate thumbnail from decoded\
    \ full image when no usable embedded thumbnail exists\n    video:\n      - use\
    \ attached picture or cover art when present and safe\n      - otherwise select\
    \ representative keyframe from early candidates\n      - overlay play indicator\
    \ on stored still thumbnail\n    office_document:\n      - use OOXML package thumbnail\
    \ from formats such as .xlsx before LibreOffice conversion when present and safe\n\
    \      - use legacy Office summary thumbnail before LibreOffice conversion when\
    \ extractor supports it\n      - re-encode accepted embedded Office thumbnail\
    \ to AVIF or WebP per policy:preview-format-policy\n      - otherwise convert\
    \ through system:document-converter\n  image_format_priority:\n    add_first:\n\
    \      - TIFF because accepted today but not thumbnail eligible\n      - BMP because\
    \ accepted today but not thumbnail eligible\n      - HEIF/HEIC because common\
    \ from Apple devices\n      - JPEG 2000 because used by archival and professional\
    \ systems\n      - JPEG XL because emerging modern still format\n      - PSD when\
    \ platform or isolated tool can flatten safely\n      - TGA when platform or ffmpeg\
    \ can decode safely\n    consider_later:\n      - camera RAW only behind explicit\
    \ opt-in due to decode cost and metadata risk\n      - AI only through isolated\
    \ external tools due to complexity\n  backend_preferences:\n    macos_sips:\n\
    \      - use when startup probe confirms source decode and requested output conversion\n\
    \      - good candidates include SVG fallback, JPEG XL, JPEG 2000, HEIC, HEIF,\
    \ TIFF, PDF first-page fallback, PSD, and TGA\n      - do not assume every macOS\
    \ version supports every format\n      - keep enabled as a low-friction local\
    \ development fallback after required sanitization or validation\n    ffmpeg:\n\
    \      - use for image or video formats not handled by Go or sips when decode\
    \ and encoder support are probed\n      - useful for TGA, some TIFF variants,\
    \ video still extraction, and broad fallback decoding\n    svg:\n      - use flow:svg-preview-generation\
    \ with system:svg-renderer, preferably resvg or rsvg-convert\n      - allow sips\
    \ fallback only after sanitize_svg rejects active content and external references\n\
    \      - never rasterize unsanitized SVG through generic image fallback\n    pdf:\n\
    \      - use flow:document-preview-generation with system:document-converter\n\
    \      - validate PDF safety first\n      - render first configured page through\
    \ MuPDF as first external-tool choice\n      - use Poppler only as explicit fallback\
    \ when installed\n      - use sips or Quick Look as optional macOS fallback for\
    \ simple thumbnails after validation\n  acceptance:\n    - unsupported decode\
    \ never rejects otherwise accepted original upload unless policy marks thumbnail\
    \ required\n    - generated data:derived-asset records source method: embedded,\
    \ generated_full_decode, generated_video_keyframe, or generated_document_render\n\
    \    - data:thumbnail-generation-config controls video keyframe candidate count\n\
    \    - extractor output is re-encoded to approved preview format, not served directly\n\
    \    - dangerous metadata and active content are stripped\n    - sips fallback\
    \ never bypasses SVG sanitization or PDF validation\nrelations:\n  - data:thumbnail-generation-config\n\
    \  - flow:image-thumbnail-generation\n  - flow:video-preview-generation\n  - flow:document-preview-generation\n\
    \  - policy:preview-generation-policy\n  - policy:preview-format-policy\n  - system:thumbnail-converter\n\
    \  - system:media-converter\n  - system:document-converter\n```"
  requirement:
    scope:
    - static image thumbnails from more source formats
    - embedded thumbnail extraction from images, videos, and Office documents
    - generated fallback when extraction is absent, invalid, or unsafe
    - video still thumbnail with play overlay
    - configurable number of video keyframes scored for still thumbnail selection
    current_observed_gap:
      implementation:
        allowed_image_category:
        - image/png
        - image/jpeg
        - image/gif
        - image/webp
        - image/avif
        - image/tiff
        - image/bmp
        - image/svg+xml
        thumbnail_eligible_server_types:
        - image/jpeg
        - image/pjpeg
        - image/png
        - image/gif
        - image/webp
        - image/avif
        not_currently_listed:
        - image/heif
        - image/heic
        - image/jxl
        - image/jp2
        - image/jpx
      knowledge:
      - data:thumbnail-generation-config did not define embedded thumbnail extraction
      - flow:video-preview-generation described animated preview, not still thumbnail
        selection
    target_source_priority:
      image:
      - validate and use embedded thumbnail when present and good enough
      - generate thumbnail from decoded full image when no usable embedded thumbnail
        exists
      video:
      - use attached picture or cover art when present and safe
      - otherwise select representative keyframe from early candidates
      - overlay play indicator on stored still thumbnail
      office_document:
      - use OOXML package thumbnail from formats such as .xlsx before LibreOffice
        conversion when present and safe
      - use legacy Office summary thumbnail before LibreOffice conversion when extractor
        supports it
      - re-encode accepted embedded Office thumbnail to AVIF or WebP per policy:preview-format-policy
      - otherwise convert through system:document-converter
    image_format_priority:
      add_first:
      - TIFF because accepted today but not thumbnail eligible
      - BMP because accepted today but not thumbnail eligible
      - HEIF/HEIC because common from Apple devices
      - JPEG 2000 because used by archival and professional systems
      - JPEG XL because emerging modern still format
      - PSD when platform or isolated tool can flatten safely
      - TGA when platform or ffmpeg can decode safely
      consider_later:
      - camera RAW only behind explicit opt-in due to decode cost and metadata risk
      - AI only through isolated external tools due to complexity
    backend_preferences:
      macos_sips:
      - use when startup probe confirms source decode and requested output conversion
      - good candidates include SVG fallback, JPEG XL, JPEG 2000, HEIC, HEIF, TIFF,
        PDF first-page fallback, PSD, and TGA
      - do not assume every macOS version supports every format
      - keep enabled as a low-friction local development fallback after required sanitization
        or validation
      ffmpeg:
      - use for image or video formats not handled by Go or sips when decode and encoder
        support are probed
      - useful for TGA, some TIFF variants, video still extraction, and broad fallback
        decoding
      svg:
      - use flow:svg-preview-generation with system:svg-renderer, preferably resvg
        or rsvg-convert
      - allow sips fallback only after sanitize_svg rejects active content and external
        references
      - never rasterize unsanitized SVG through generic image fallback
      pdf:
      - use flow:document-preview-generation with system:document-converter
      - validate PDF safety first
      - render first configured page through MuPDF as first external-tool choice
      - use Poppler only as explicit fallback when installed
      - use sips or Quick Look as optional macOS fallback for simple thumbnails after
        validation
    acceptance:
    - unsupported decode never rejects otherwise accepted original upload unless policy
      marks thumbnail required
    - generated data:derived-asset records source method: embedded, generated_full_decode,
        generated_video_keyframe, or generated_document_render
    - data:thumbnail-generation-config controls video keyframe candidate count
    - extractor output is re-encoded to approved preview format, not served directly
    - dangerous metadata and active content are stripped
    - sips fallback never bypasses SVG sanitization or PDF validation
  relations:
  - data:thumbnail-generation-config
  - flow:image-thumbnail-generation
  - flow:video-preview-generation
  - flow:document-preview-generation
  - policy:preview-generation-policy
  - policy:preview-format-policy
  - system:thumbnail-converter
  - system:media-converter
  - system:document-converter
