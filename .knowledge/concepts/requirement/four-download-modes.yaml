id: requirement:four-download-modes
type: requirement
title: Four Download Modes
summary: Streamuploader must provide sample-ready support for four object download
  modes.
facts:
  legacy_body: "Streamuploader must provide sample-ready support for four object download\
    \ modes.\n\n```yaml\nrequired_modes:\n  direct_public_bucket:\n    summary: public\
    \ bucket URL download for demo\n    implementation_owner: demo app\n    streamuploader_role:\
    \ none for URL creation and byte serving\n  s3_presigned_download:\n    summary:\
    \ backend asks S3 for presigned URL and returns it\n    implementation_owner:\
    \ streamuploader backend API or demo app using S3 client\n  api_proxy_download:\n\
    \    summary: frontend API streams S3 object and hides bucket\n    implementation_owner:\
    \ streamuploader\n  shared_key_proxy_download:\n    summary: backend API creates\
    \ shared key, frontend API resolves it and streams object\n    implementation_owner:\
    \ streamuploader\nstreamuploader_options:\n  enable_shared_key:\n    required:\
    \ true\n    default: false\n  shared_key_bits:\n    required: true\n    default:\
    \ 128\n    minimum: 96\n  allow_frontend_file_access:\n    required: true\n  \
    \  default: false\n  max_archive_files:\n    required: false\n    default: 100\n\
    \  max_archive_bytes:\n    required: false\n    default: 1073741824\ndemo_requirements:\n\
    \  - expose all four modes in UI\n  - show current mode and resulting URL class\n\
    \  - support direct mode with public local bucket policy\n  - support presigned\
    \ mode without public bucket\n  - support proxy mode with hidden bucket endpoint\n\
    \  - support shared key mode with backend-created key\n  - optionally support\
    \ multi-file zip download through /api/files/{key},{key}\nacceptance:\n  - same\
    \ uploaded file can be downloaded through each mode\n  - direct URL is built by\
    \ demo app and contains S3 or CDN endpoint\n  - direct access does not call streamuploader\
    \ file API\n  - presigned URL contains S3 signature parameters\n  - proxy URL\
    \ uses /api/file/{key}/content and contains object key\n  - shared-key URL uses\
    \ /api/file/shared/{shared_key}/content and contains shared_key only\n  - zip\
    \ URL uses /api/files/{key},{key} and returns application/zip\n  - upload API\
    \ remains under /api/upload and does not serve file bytes\n  - future thumbnails\
    \ and variants can extend /api/file without changing upload routes\nreferences:\n\
    \  - flow:demo-download-modes\n  - api:download-api\n  - api:shared-key-api\n\
    \  - policy:object-access-policy\n  - policy:shared-key-policy\n```"
  required_modes:
    direct_public_bucket:
      summary: public bucket URL download for demo
      implementation_owner: demo app
      streamuploader_role: none for URL creation and byte serving
    s3_presigned_download:
      summary: backend asks S3 for presigned URL and returns it
      implementation_owner: streamuploader backend API or demo app using S3 client
    api_proxy_download:
      summary: frontend API streams S3 object and hides bucket
      implementation_owner: streamuploader
    shared_key_proxy_download:
      summary: backend API creates shared key, frontend API resolves it and streams
        object
      implementation_owner: streamuploader
  streamuploader_options:
    enable_shared_key:
      required: true
      default: false
    shared_key_bits:
      required: true
      default: 128
      minimum: 96
    allow_frontend_file_access:
      required: true
      default: false
    max_archive_files:
      required: false
      default: 100
    max_archive_bytes:
      required: false
      default: 1073741824
  demo_requirements:
  - expose all four modes in UI
  - show current mode and resulting URL class
  - support direct mode with public local bucket policy
  - support presigned mode without public bucket
  - support proxy mode with hidden bucket endpoint
  - support shared key mode with backend-created key
  - optionally support multi-file zip download through /api/files/{key},{key}
  acceptance:
  - same uploaded file can be downloaded through each mode
  - direct URL is built by demo app and contains S3 or CDN endpoint
  - direct access does not call streamuploader file API
  - presigned URL contains S3 signature parameters
  - proxy URL uses /api/file/{key}/content and contains object key
  - shared-key URL uses /api/file/shared/{shared_key}/content and contains shared_key
    only
  - zip URL uses /api/files/{key},{key} and returns application/zip
  - upload API remains under /api/upload and does not serve file bytes
  - future thumbnails and variants can extend /api/file without changing upload routes
  references:
  - flow:demo-download-modes
  - api:download-api
  - api:shared-key-api
  - policy:object-access-policy
  - policy:shared-key-policy
