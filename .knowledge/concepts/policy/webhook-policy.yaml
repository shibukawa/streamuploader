id: policy:webhook-policy
type: policy
title: Webhook Policy
summary: Webhook policy notifies external systems about upload, processing, failure,
  and cleanup events.
facts:
  legacy_body: "Webhook policy notifies external systems about upload, processing,\
    \ failure, and cleanup events.\n\n```yaml\nevents:\n  - upload_completed\n  -\
    \ upload_wait_completed\n  - preview_completed\n  - scan_failed\n  - derived_asset_failed\n\
    \  - cleanup_completed\n  - share_revoked\ndelivery:\n  - signed payload\n  -\
    \ idempotency key\n  - retry with backoff\n  - dead letter queue after terminal\
    \ failure\npayload:\n  - event_id\n  - event_type\n  - batch_key optional\n  -\
    \ upload_key optional\n  - object_key or display_key optional\n  - status\nreferences:\n\
    \  - policy:worker-queue-policy\n  - policy:audit-log-policy\n```"
  events:
  - upload_completed
  - upload_wait_completed
  - preview_completed
  - scan_failed
  - derived_asset_failed
  - cleanup_completed
  - share_revoked
  delivery:
  - signed payload
  - idempotency key
  - retry with backoff
  - dead letter queue after terminal failure
  payload:
  - event_id
  - event_type
  - batch_key optional
  - upload_key optional
  - object_key or display_key optional
  - status
  references:
  - policy:worker-queue-policy
  - policy:audit-log-policy
relations:
- relation: mentions
  to: policy:audit-log-policy
  resolution: resolved
- relation: mentions
  to: policy:worker-queue-policy
  resolution: resolved
