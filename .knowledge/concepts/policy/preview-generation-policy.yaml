  resolution: resolved
- relation: mentions
  to: flow:video-preview-generation
  resolution: resolved
- relation: mentions
  to: policy:preview-format-policy
  resolution: resolved
- relation: mentions
  to: policy:search-extraction-policy
  resolution: resolved
- relation: mentions
  to: requirement:expanded-thumbnail-source-support
  resolution: resolved
history:
  bdf-migration-2026-10-07:
    summary: PDF and OOXML thumbnails, search text and previews moved in-process to bdf (requirement:bdf-document-processing). LibreOffice, mutool, pdftotext and the embedded OOXML thumbnail path were removed; statements below about them are historical.
    supersedes: [requirement:bdf-document-processing]
