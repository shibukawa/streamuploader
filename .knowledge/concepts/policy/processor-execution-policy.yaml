id: policy:processor-execution-policy
type: policy
title: Processor Execution Policy
summary: Processor execution policy configures native and local command processors
  for upload-time and post-upload enrichment.
facts:
  legacy_body: "Processor execution policy configures native and local command processors\
    \ for upload-time and post-upload enrichment.\n\n```yaml\nprocessor:\n  fields:\n\
    \    name: stable id\n    mode:\n      enum:\n        - native\n        - local_command\n\
    \        - openai_compatible_api\n    timing:\n      enum:\n        - pre_accept\n\
    \        - post_accept\n        - on_demand\n    required: boolean\n    match:\n\
    \      content_types: list optional\n      roles: list optional\n      max_size_bytes:\
    \ integer optional\n      extensions: list optional\n    output:\n      merge_path:\
    \ JSON pointer optional\n      artifact_kind: extracted_content or derived_asset\
    \ optional\n      max_stdout_bytes: integer\n    failure:\n      behavior:\n \
    \       enum:\n          - reject_upload\n          - warn\n          - mark_failed\n\
    \          - skip\n      retry: optional policy\n    limits:\n      timeout: duration\n\
    \      concurrency_key: tenant, processor, global optional\n      max_input_bytes:\
    \ integer optional\ntiming_semantics:\n  pre_accept:\n    - runs before upload\
    \ key reaches uploaded or clean state\n    - required processor failure can reject\
    \ upload\n    - use only for fast checks or product-required facts before metadata\
    \ submit\n  post_accept:\n    - runs after original object is durable\n    - may\
    \ run in worker queue beside preview, OCR, HLS, and extraction jobs\n    - failure\
    \ should usually warn or mark processor result failed\n  on_demand:\n    - runs\
    \ when requested by UI/API and cached result is missing or stale\nnative_initial_scope:\n\
    \  - Office metadata parsing\n  - EXIF parsing with allowlisted fields\n  - OCR\
    \ when configured backend exists\n  - image thumbnails\n  - video thumbnails or\
    \ animated previews\n  - HLS generation\n  - PDF or Office preview when converter\
    \ exists\nexternal_api_strategy:\n  - OpenAI-compatible APIs may use system:openai-compatible-api-processor\
    \ with configured prompt, endpoint, headers, and response JSON schema\n  - non\
    \ OpenAI-compatible provider APIs use system:local-command-processor for Google\
    \ Vision, translation, AWS, GCP, and internal APIs\n  - local command owns provider-specific\
    \ auth, request shape, retry, and response normalization\nopenai_compatible_api:\n\
    \  - endpoint URL and model are configured per processor\n  - headers may include\
    \ static values or environment-variable interpolation from allowlisted env vars\n\
    \  - prompt can reference original file when explicitly allowed, data:extracted-content,\
    \ data:processor-result, metadata fields, and derived preview images\n  - response\
    \ JSON must validate against configured schema before merge\n  - suitable for\
    \ OCR, image analysis, summary, classification, and custom JSON extraction\nreferences:\n\
    \  - system:local-command-processor\n  - system:openai-compatible-api-processor\n\
    \  - data:processor-result\n  - data:openai-compatible-processor-config\n  - policy:worker-queue-policy\n\
    \  - policy:tool-backend-selection-policy\n  - policy:search-extraction-policy\n\
    ```"
  processor:
    fields:
      name: stable id
      mode:
        enum:
        - native
        - local_command
        - openai_compatible_api
      timing:
        enum:
        - pre_accept
        - post_accept
        - on_demand
      required: boolean
      match:
        content_types: list optional
        roles: list optional
        max_size_bytes: integer optional
        extensions: list optional
      output:
        merge_path: JSON pointer optional
        artifact_kind: extracted_content or derived_asset optional
        max_stdout_bytes: integer
      failure:
        behavior:
          enum:
          - reject_upload
          - warn
          - mark_failed
          - skip
        retry: optional policy
      limits:
        timeout: duration
        concurrency_key: tenant, processor, global optional
        max_input_bytes: integer optional
  timing_semantics:
    pre_accept:
    - runs before upload key reaches uploaded or clean state
    - required processor failure can reject upload
    - use only for fast checks or product-required facts before metadata submit
    post_accept:
    - runs after original object is durable
    - may run in worker queue beside preview, OCR, HLS, and extraction jobs
    - failure should usually warn or mark processor result failed
    on_demand:
    - runs when requested by UI/API and cached result is missing or stale
  native_initial_scope:
  - Office metadata parsing
  - EXIF parsing with allowlisted fields
  - OCR when configured backend exists
  - image thumbnails
  - video thumbnails or animated previews
  - HLS generation
  - PDF or Office preview when converter exists
  external_api_strategy:
  - OpenAI-compatible APIs may use system:openai-compatible-api-processor with configured
    prompt, endpoint, headers, and response JSON schema
  - non OpenAI-compatible provider APIs use system:local-command-processor for Google
    Vision, translation, AWS, GCP, and internal APIs
  - local command owns provider-specific auth, request shape, retry, and response
    normalization
  openai_compatible_api:
  - endpoint URL and model are configured per processor
  - headers may include static values or environment-variable interpolation from allowlisted
    env vars
  - prompt can reference original file when explicitly allowed, data:extracted-content,
    data:processor-result, metadata fields, and derived preview images
  - response JSON must validate against configured schema before merge
  - suitable for OCR, image analysis, summary, classification, and custom JSON extraction
  references:
  - system:local-command-processor
  - system:openai-compatible-api-processor
  - data:processor-result
  - data:openai-compatible-processor-config
  - policy:worker-queue-policy
  - policy:tool-backend-selection-policy
  - policy:search-extraction-policy
relations:
- relation: mentions
  to: data:extracted-content
  resolution: resolved
- relation: mentions
  to: data:openai-compatible-processor-config
  resolution: resolved
- relation: mentions
