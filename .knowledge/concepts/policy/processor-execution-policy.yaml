  resolution: resolved
- relation: mentions
  to: policy:tool-backend-selection-policy
  resolution: resolved
- relation: mentions
  to: policy:worker-queue-policy
  resolution: resolved
- relation: mentions
  to: system:local-command-processor
  resolution: resolved
- relation: mentions
  to: system:openai-compatible-api-processor
  resolution: resolved
