id: policy:tool-backend-selection-policy
type: policy
title: Tool Backend Selection Policy
summary: Tool backend selection policy maps features to available external tools with
  fallback and degradation rules.
facts:
  legacy_body: "Tool backend selection policy maps features to available external\
    \ tools with fallback and degradation rules.\n\n```yaml\nfeatures:\n  video_preview:\n\
    \    preferred: ffmpeg\n    fallback:\n      - avconvert on macOS for simple preview\
    \ when ffmpeg is unavailable\n    missing_behavior: skip preview or mark failed\
    \ depending on feature requirement\n  hls_generation:\n    preferred: ffmpeg\n\
    \    fallback: none\n    missing_behavior: disable HLS\n  office_preview:\n  \
    \  preferred: embedded Office thumbnail, else libreoffice plus MuPDF pdf_renderer\n\
    \    fallback:\n      - Poppler only when explicitly installed\n      - qlmanage\
    \ on macOS for simple thumbnail fallback after validation when configured\n  \
    \    - sips on macOS for first-page PDF thumbnail fallback after validation when\
    \ configured and probed\n    missing_behavior: skip document preview\n  pdf_preview:\n\
    \    preferred: MuPDF mutool after PDF validation\n    fallback:\n      - Poppler\
    \ only when explicitly installed\n      - qlmanage on macOS for simple thumbnail\
    \ fallback after validation when configured\n      - sips on macOS for first-page\
    \ PDF thumbnail fallback after validation when configured and probed\n    missing_behavior:\
    \ skip PDF preview\n  svg_preview:\n    preferred: resvg\n    fallback:\n    \
    \  - rsvg-convert\n      - resvg\n      - inkscape for high fidelity\n      -\
    \ sips on macOS for simple fallback after sanitization when configured and probed\n\
    \      - qlmanage on macOS for environment-dependent fallback\n    missing_behavior:\
    \ skip SVG preview\n  image_thumbnail:\n    preferred:\n      - system:thumbnail-converter\
    \ in-process Go backend when source is Go-decodable and codec is linked\n    \
    \  - vegidio/avif-go for AVIF when CGO is enabled and selected\n      - chai2010/webp\
    \ for WebP when CGO is enabled and selected\n    fallback:\n      - sips on macOS\
    \ for AVIF-capable simple transforms\n      - sips on macOS for probed SVG, JPEG\
    \ XL, JPEG 2000, HEIC, HEIF, TIFF, PDF thumbnail fallback, PSD, and TGA support\n\
    \      - vips for fast resize and AVIF/WebP output\n      - ffmpeg for broad decode\
    \ fallback\n      - eringen/gowebper for pure-Go lossless/simple WebP when CGO\
    \ is disabled\n      - image/jpeg final static fallback\n    missing_behavior:\
    \ skip image preview or use original only when policy allows\n  virus_scan:\n\
    \    preferred: clamdscan\n    fallback:\n      - clamscan\n    missing_behavior:\
    \ disable when optional, fail commit when policy requires scan\n  download_variant:\n\
    \    preferred:\n      - Go zstd library\n      - zstd CLI\n    missing_behavior:\
    \ skip compressed variant\n  text_extraction:\n    preferred:\n      - direct\
    \ parser for text-like files\n      - docx parser for OOXML\n      - pdftotext\
    \ for PDF embedded text when startup probe finds it\n      - Go PDF literal parser\
    \ when pdftotext is missing, failing, or empty\n      - Go metadata or EXIF parser\
    \ for allowlisted fields\n    fallback:\n      - Apache Tika when enabled\n  \
    \    - LibreOffice text export fallback\n      - local command processor for document\
    \ AI when policy explicitly delegates\n    missing_behavior: skip extracted_text\
    \ or mark failed depending on requirement\n  metadata_extraction:\n    preferred:\n\
    \      - native Go parser when available\n      - Go EXIF parser for image metadata\n\
    \      - OOXML core properties parser for Office metadata\n    fallback:\n   \
    \   - exiftool for broad or difficult metadata formats\n      - Apache Tika when\
    \ enabled\n    missing_behavior: skip extracted_metadata\n  ocr_extraction:\n\
    \    preferred: tesseract\n    fallback:\n      - local command processor that\
    \ calls cloud OCR when explicitly configured\n      - local command processor\
    \ that calls document AI when policy explicitly delegates\n    missing_behavior:\
    \ skip OCR or mark failed depending on requirement\nreporting:\n  - tool availability\
    \ is probed at startup and reused during execution\n  - do not run PATH lookup\
    \ in per-file execution paths\n  - emit startup logs for extraction tools, including\
    \ pdftotext, external command, and OCR command availability\n  - expose selected\
    \ backend in health API\n  - include backend name and version in worker audit\
    \ event\n  - include missing backend reason in status when feature is skipped\n\
    references:\n  - system:external-tool-registry\n  - system:thumbnail-converter\n\
    \  - system:linux-tool-worker-image\n  - system:text-extractor\n  - system:ocr-engine\n\
    \  - system:external-processing-delegates\n  - system:local-command-processor\n\
    \  - policy:external-delegation-policy\n  - policy:processor-execution-policy\n\
    \  - policy:worker-queue-policy\n```"
  features:
    video_preview:
      preferred: ffmpeg
      fallback:
      - avconvert on macOS for simple preview when ffmpeg is unavailable
      missing_behavior: skip preview or mark failed depending on feature requirement
    hls_generation:
      preferred: ffmpeg
      fallback: none
      missing_behavior: disable HLS
    office_preview:
      preferred: embedded Office thumbnail, else libreoffice plus MuPDF pdf_renderer
      fallback:
      - Poppler only when explicitly installed
      - qlmanage on macOS for simple thumbnail fallback after validation when configured
      - sips on macOS for first-page PDF thumbnail fallback after validation when
        configured and probed
      missing_behavior: skip document preview
    pdf_preview:
      preferred: MuPDF mutool after PDF validation
      fallback:
      - Poppler only when explicitly installed
      - qlmanage on macOS for simple thumbnail fallback after validation when configured
      - sips on macOS for first-page PDF thumbnail fallback after validation when
        configured and probed
      missing_behavior: skip PDF preview
    svg_preview:
      preferred: resvg
      fallback:
      - rsvg-convert
      - resvg
      - inkscape for high fidelity
      - sips on macOS for simple fallback after sanitization when configured and probed
      - qlmanage on macOS for environment-dependent fallback
      missing_behavior: skip SVG preview
    image_thumbnail:
      preferred:
      - system:thumbnail-converter in-process Go backend when source is Go-decodable
        and codec is linked
      - vegidio/avif-go for AVIF when CGO is enabled and selected
      - chai2010/webp for WebP when CGO is enabled and selected
      fallback:
      - sips on macOS for AVIF-capable simple transforms
      - sips on macOS for probed SVG, JPEG XL, JPEG 2000, HEIC, HEIF, TIFF, PDF thumbnail
        fallback, PSD, and TGA support
      - vips for fast resize and AVIF/WebP output
      - ffmpeg for broad decode fallback
      - eringen/gowebper for pure-Go lossless/simple WebP when CGO is disabled
      - image/jpeg final static fallback
      missing_behavior: skip image preview or use original only when policy allows
    virus_scan:
      preferred: clamdscan
      fallback:
      - clamscan
      missing_behavior: disable when optional, fail commit when policy requires scan
    download_variant:
      preferred:
      - Go zstd library
      - zstd CLI
      missing_behavior: skip compressed variant
    text_extraction:
      preferred:
      - direct parser for text-like files
      - docx parser for OOXML
      - pdftotext for PDF embedded text when startup probe finds it
      - Go PDF literal parser when pdftotext is missing, failing, or empty
      - Go metadata or EXIF parser for allowlisted fields
      fallback:
      - Apache Tika when enabled
      - LibreOffice text export fallback
      - local command processor for document AI when policy explicitly delegates
      missing_behavior: skip extracted_text or mark failed depending on requirement
    metadata_extraction:
      preferred:
      - native Go parser when available
      - Go EXIF parser for image metadata
      - OOXML core properties parser for Office metadata
      fallback:
      - exiftool for broad or difficult metadata formats
      - Apache Tika when enabled
      missing_behavior: skip extracted_metadata
    ocr_extraction:
      preferred: tesseract
      fallback:
      - local command processor that calls cloud OCR when explicitly configured
      - local command processor that calls document AI when policy explicitly delegates
      missing_behavior: skip OCR or mark failed depending on requirement
  reporting:
  - tool availability is probed at startup and reused during execution
  - do not run PATH lookup in per-file execution paths
  - emit startup logs for extraction tools, including pdftotext, external command,
    and OCR command availability
  - expose selected backend in health API
  - include backend name and version in worker audit event
  - include missing backend reason in status when feature is skipped
  references:
  - system:external-tool-registry
  - system:thumbnail-converter
  - system:linux-tool-worker-image
  - system:text-extractor
  - system:ocr-engine
  - system:external-processing-delegates
  - system:local-command-processor
  - policy:external-delegation-policy
  - policy:processor-execution-policy
  - policy:worker-queue-policy
