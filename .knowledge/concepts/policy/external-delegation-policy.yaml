id: policy:external-delegation-policy
type: policy
title: External Delegation Policy
summary: External delegation policy controls when local command processors may call
  external providers or move file content outside the deployment boundary.
facts:
  legacy_body: "External delegation policy controls when local command processors\
    \ may call external providers or move file content outside the deployment boundary.\n\
    \n```yaml\ndefault:\n  - streamuploader core does not implement generic provider\
    \ webhooks\n  - OpenAI-compatible APIs may be called by system:openai-compatible-api-processor\
    \ when explicitly configured\n  - external APIs are reached through system:local-command-processor\n\
    \  - command owns provider-specific auth, request payload, retry, and response\
    \ normalization\n  - do not delegate private file bytes to external SaaS providers\
    \ unless explicitly allowed\n  - local native and local command processors are\
    \ preferred before remote providers for private content\n  - cloud provider use\
    \ requires explicit opt-in per tenant, file role, and capability\nselection_inputs:\n\
    \  - tenant policy\n  - file privacy classification\n  - content type\n  - requested\
    \ capability\n  - provider region\n  - provider cost class\n  - provider data\
    \ retention terms\n  - provider accuracy requirement\nhandoff_modes:\n  local_cli:\n\
    \    description: worker invokes configured argv and receives data:processor-result\
    \ JSON\n    data_boundary: same host or container\n  local_cli_calls_provider:\n\
    \    description: command may call aws, gcloud, curl, or custom clients\n    data_boundary:\
    \ command-defined external boundary\n    constraints:\n      - command must normalize\
    \ provider output before stdout\n      - streamuploader does not parse provider-specific\
    \ response shapes\n      - secrets are passed by allowlisted env or mounted files\n\
    \  self_hosted_sidecar_via_command:\n    description: command calls a private\
    \ sidecar or internal service\n    data_boundary: deployment private network\n\
    \  upload_bytes:\n    description: command downloads from S3 and sends bytes to\
    \ provider API\n    data_boundary: external provider\n  provider_object_reference:\n\
    \    description: provider reads object using short-lived scoped URL or cloud\
    \ integration\n    constraints:\n      - prefer dedicated temporary object or\
    \ restricted access path\n      - avoid exposing canonical capability key\n  \
    \    - set short expiration and audit use\n  openai_compatible_api:\n    description:\
    \ worker calls configured OpenAI-compatible endpoint with prompt and JSON schema\n\
    \    data_boundary: configured provider boundary\n    constraints:\n      - endpoint\
    \ must be configured and allowlisted\n      - headers may interpolate only allowlisted\
    \ environment variables\n      - response JSON schema validation required before\
    \ merge\n      - original file bytes require explicit privacy opt-in\nprivacy_controls:\n\
    \  - field allowlist and denylist for extracted metadata\n  - redact or skip documents\
    \ marked do_not_index\n  - disallow delegation for regulated or confidential classifications\
    \ unless explicitly permitted\n  - store provider response only after normalization\
    \ and retention filtering\noperations:\n  - record provider name, version, region,\
    \ request id, job id, and cost estimate\n  - use idempotency key per processor\
    \ job when command supports it\n  - enforce timeout, stdout limit, retry budget,\
    \ quota, and circuit breaker\n  - support fallback to local backend or skip when\
    \ provider fails\nreferences:\n  - system:external-processing-delegates\n  - system:openai-compatible-api-processor\n\
    \  - system:local-command-processor\n  - policy:processor-execution-policy\n \
    \ - policy:search-extraction-policy\n  - policy:audit-log-policy\n  - policy:worker-queue-policy\n\
    ```"
  default:
  - streamuploader core does not implement generic provider webhooks
  - OpenAI-compatible APIs may be called by system:openai-compatible-api-processor
    when explicitly configured
  - external APIs are reached through system:local-command-processor
  - command owns provider-specific auth, request payload, retry, and response normalization
  - do not delegate private file bytes to external SaaS providers unless explicitly
    allowed
  - local native and local command processors are preferred before remote providers
    for private content
  - cloud provider use requires explicit opt-in per tenant, file role, and capability
  selection_inputs:
  - tenant policy
  - file privacy classification
  - content type
  - requested capability
  - provider region
  - provider cost class
  - provider data retention terms
  - provider accuracy requirement
  handoff_modes:
    local_cli:
      description: worker invokes configured argv and receives data:processor-result
        JSON
      data_boundary: same host or container
    local_cli_calls_provider:
      description: command may call aws, gcloud, curl, or custom clients
      data_boundary: command-defined external boundary
      constraints:
      - command must normalize provider output before stdout
      - streamuploader does not parse provider-specific response shapes
      - secrets are passed by allowlisted env or mounted files
    self_hosted_sidecar_via_command:
      description: command calls a private sidecar or internal service
      data_boundary: deployment private network
    upload_bytes:
      description: command downloads from S3 and sends bytes to provider API
      data_boundary: external provider
    provider_object_reference:
      description: provider reads object using short-lived scoped URL or cloud integration
      constraints:
      - prefer dedicated temporary object or restricted access path
      - avoid exposing canonical capability key
      - set short expiration and audit use
    openai_compatible_api:
      description: worker calls configured OpenAI-compatible endpoint with prompt
        and JSON schema
      data_boundary: configured provider boundary
      constraints:
      - endpoint must be configured and allowlisted
      - headers may interpolate only allowlisted environment variables
      - response JSON schema validation required before merge
      - original file bytes require explicit privacy opt-in
  privacy_controls:
  - field allowlist and denylist for extracted metadata
  - redact or skip documents marked do_not_index
  - disallow delegation for regulated or confidential classifications unless explicitly
    permitted
  - store provider response only after normalization and retention filtering
  operations:
  - record provider name, version, region, request id, job id, and cost estimate
  - use idempotency key per processor job when command supports it
  - enforce timeout, stdout limit, retry budget, quota, and circuit breaker
  - support fallback to local backend or skip when provider fails
  references:
  - system:external-processing-delegates
  - system:openai-compatible-api-processor
  - system:local-command-processor
  - policy:processor-execution-policy
  - policy:search-extraction-policy
  - policy:audit-log-policy
  - policy:worker-queue-policy
