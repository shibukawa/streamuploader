id: policy:structural-validation-policy
type: policy
title: Structural Validation Policy
summary: Structural validation policy rejects malformed or inconsistent files before
  sanitization or active-content inspection.
facts:
  legacy_body: "Structural validation policy rejects malformed or inconsistent files\
    \ before sanitization or active-content inspection.\n\n```yaml\nrules:\n  default:\
    \ validate_when_supported\n  config_source: data:security-policy-config structural_validation\n\
    \  validators:\n    png:\n      - chunk order\n      - chunk length bounds\n \
    \     - CRC validation\n      - critical chunk presence\n    jpeg:\n      - marker\
    \ sequence\n      - segment length bounds\n      - single coherent image stream\n\
    \    zip:\n      - central directory consistency\n      - local header consistency\n\
    \      - ZIP64 consistency\n      - path safety\n    office_open_xml:\n      -\
    \ valid ZIP package\n      - required [Content_Types].xml part\n      - declared\
    \ document family matches an Override main part content type\n      - Override\
    \ main PartName exists as an actual package part\n      - relationship target\
    \ consistency\n      - no ambiguous duplicate package parts\n    open_document:\n\
    \      - valid ZIP package\n      - required mimetype part matches declared odt,\
    \ ods, or odp family\n      - required META-INF/manifest.xml root file-entry media\
    \ type matches declared family\n      - required content.xml part exists\n   \
    \   - XML parts are parser-readable under configured decompressed size limits\n\
    \    pdf:\n      - cross-reference consistency\n      - object stream consistency\n\
    \      - trailer and catalog consistency\n      - stream length consistency within\
    \ parser limits\n    svg:\n      - well-formed XML\n      - parser limit compliance\n\
    \    html:\n      - parser tree construction completes within limits\n      -\
    \ encoding declaration is coherent\n    xml:\n      - well-formed XML\n      -\
    \ parser limit compliance\n      - no malformed entity declarations\n  reject:\n\
    \    - malformed structure\n    - inconsistent directory or object metadata\n\
    \    - truncated required data\n    - duplicate or ambiguous records that affect\
    \ interpretation\n    - parser reaches configured resource limit before validation\
    \ completes\n  behavior:\n    - fail closed in strict mode\n    - use bounded\
    \ parse and resource counters from policy:resource-limit-policy\n    - validation\
    \ must run before sanitize writers rewrite bytes\n    - chunk-only validation\
    \ may run before storage upload when bounded reads prove result\n    - full-file\
    \ validation runs before final commit for formats needing random access or complete\
    \ graph checks\n  result:\n    reject_http_status: 415\n    reject_error_code:\
    \ structural_validation_failed\nreferences:\n  - data:security-policy-config\n\
    \  - policy:resource-limit-policy\n  - policy:file-type-sanitization-policy\n\
    \  - data:security-check-result\n```"
  rules:
    default: validate_when_supported
    config_source: data:security-policy-config structural_validation
    validators:
      png:
      - chunk order
      - chunk length bounds
      - CRC validation
      - critical chunk presence
      jpeg:
      - marker sequence
      - segment length bounds
      - single coherent image stream
      zip:
      - central directory consistency
      - local header consistency
      - ZIP64 consistency
      - path safety
      office_open_xml:
      - valid ZIP package
      - required [Content_Types].xml part
      - declared document family matches an Override main part content type
      - Override main PartName exists as an actual package part
      - relationship target consistency
      - no ambiguous duplicate package parts
      open_document:
      - valid ZIP package
      - required mimetype part matches declared odt, ods, or odp family
      - required META-INF/manifest.xml root file-entry media type matches declared
        family
      - required content.xml part exists
      - XML parts are parser-readable under configured decompressed size limits
      pdf:
      - cross-reference consistency
      - object stream consistency
      - trailer and catalog consistency
      - stream length consistency within parser limits
      svg:
      - well-formed XML
      - parser limit compliance
      html:
      - parser tree construction completes within limits
      - encoding declaration is coherent
      xml:
      - well-formed XML
      - parser limit compliance
      - no malformed entity declarations
    reject:
    - malformed structure
    - inconsistent directory or object metadata
    - truncated required data
    - duplicate or ambiguous records that affect interpretation
    - parser reaches configured resource limit before validation completes
    behavior:
    - fail closed in strict mode
    - use bounded parse and resource counters from policy:resource-limit-policy
    - validation must run before sanitize writers rewrite bytes
    - chunk-only validation may run before storage upload when bounded reads prove
      result
    - full-file validation runs before final commit for formats needing random access
      or complete graph checks
    result:
      reject_http_status: 415
      reject_error_code: structural_validation_failed
  references:
  - data:security-policy-config
  - policy:resource-limit-policy
  - policy:file-type-sanitization-policy
  - data:security-check-result
relations:
- relation: mentions
  to: data:security-check-result
  resolution: resolved
- relation: mentions
  to: data:security-policy-config
  resolution: resolved
- relation: mentions
  to: policy:file-type-sanitization-policy
  resolution: resolved
- relation: mentions
  to: policy:resource-limit-policy
  resolution: resolved
