id: policy:search-extraction-policy
type: policy
title: Search Extraction Policy
summary: Search extraction policy controls text, metadata, and OCR extraction for
  search engine ingestion.
facts:
  legacy_body: "Search extraction policy controls text, metadata, and OCR extraction\
    \ for search engine ingestion.\n\n```yaml\nselector:\n  - detected content type\n\
    \  - file role\n  - tenant policy\n  - upload policy\n  - application metadata\
    \ requirements\noutputs:\n  extracted_text:\n    mode: optional\n    flow: flow:text-extraction-generation\n\
    \    artifact_key: texts.extracted or texts.text in data:extracted-content\n \
    \ extracted_metadata:\n    mode: optional\n    flow: flow:text-extraction-generation\n\
    \    artifact_key: texts.title, texts.description, or metadata in data:extracted-content\n\
    \  ocr_text:\n    mode: opt_in\n    flow: flow:ocr-extraction-generation\n   \
    \ artifact_key: texts.ocr in data:extracted-content\ndata_type_rules:\n  text_like:\n\
    \    extract_text: true\n    ocr: false\n    output_text_key: text\n  pdf:\n \
    \   extract_text: true\n    ocr: when no embedded text or policy requests\n  \
    \  output_text_key: extracted\n  office_document:\n    extract_text: true\n  \
    \  ocr: false unless rendered pages need OCR\n    output_text_key: extracted\n\
    \  image:\n    extract_metadata: true\n    ocr: opt_in\n    output_text_keys:\n\
    \      - title\n      - description\n      - ocr\n  video_audio:\n    extract_metadata:\
    \ true\n    ocr: false\nprivacy:\n  - EXIF/GPS/author/revision/comment metadata\
    \ may be sensitive\n  - separate metadata stripping for derived assets from metadata\
    \ extraction for search\n  - allow fields denylist and allowlist before index\
    \ handoff\n  - support do_not_index classification\nindex_handoff:\n  - store\
    \ extracted artifact in S3 first\n  - use source object key plus .text.json by\
    \ default\n  - send object key, checksum, language, and chunk descriptors to search\
    \ pipeline when configured\n  - do not block upload acceptance unless product\
    \ policy requires indexing before metadata submit\nexternal_delegation:\n  - allowed\
    \ only through policy:external-delegation-policy\n  - external APIs are invoked\
    \ through system:local-command-processor, not generic webhooks\n  - OpenAI-compatible\
    \ APIs may use system:openai-compatible-api-processor when prompt, headers, and\
    \ response schema are configured\n  - local and native extractors are preferred\
    \ for private content\n  - cloud document AI, vision, and translation commands\
    \ are opt-in per tenant and file role\nprocessors:\n  - selected processors follow\
    \ policy:processor-execution-policy\n  - required pre_accept extraction can block\
    \ upload acceptance only when product policy needs facts before metadata submit\n\
    \  - OpenAI-compatible processor output may summarize, classify, analyze images,\
    \ or produce OCR-like JSON when configured\n  - post_accept extraction should\
    \ write data:extracted-content or data:processor-result artifacts asynchronously\n\
    limits:\n  - maximum extracted bytes\n  - maximum characters\n  - maximum pages\n\
    \  - maximum OCR pages\n  - maximum metadata fields\nreferences:\n  - data:extracted-content\n\
    \  - flow:text-extraction-generation\n  - flow:ocr-extraction-generation\n  -\
    \ system:text-extractor\n  - system:ocr-engine\n  - system:external-processing-delegates\n\
    \  - system:local-command-processor\n  - system:openai-compatible-api-processor\n\
    \  - policy:external-delegation-policy\n  - policy:processor-execution-policy\n\
    \  - policy:metadata-stripping-policy\n```"
  selector:
  - detected content type
  - file role
  - tenant policy
  - upload policy
  - application metadata requirements
  outputs:
    extracted_text:
      mode: optional
      flow: flow:text-extraction-generation
      artifact_key: texts.extracted or texts.text in data:extracted-content
    extracted_metadata:
      mode: optional
      flow: flow:text-extraction-generation
      artifact_key: texts.title, texts.description, or metadata in data:extracted-content
    ocr_text:
      mode: opt_in
      flow: flow:ocr-extraction-generation
      artifact_key: texts.ocr in data:extracted-content
  data_type_rules:
    text_like:
      extract_text: true
      ocr: false
      output_text_key: text
    pdf:
      extract_text: true
      ocr: when no embedded text or policy requests
      output_text_key: extracted
    office_document:
      extract_text: true
      ocr: false unless rendered pages need OCR
      output_text_key: extracted
    image:
      extract_metadata: true
      ocr: opt_in
      output_text_keys:
      - title
      - description
      - ocr
    video_audio:
      extract_metadata: true
      ocr: false
  privacy:
  - EXIF/GPS/author/revision/comment metadata may be sensitive
  - separate metadata stripping for derived assets from metadata extraction for search
  - allow fields denylist and allowlist before index handoff
  - support do_not_index classification
  index_handoff:
  - store extracted artifact in S3 first
  - use source object key plus .text.json by default
  - send object key, checksum, language, and chunk descriptors to search pipeline
    when configured
  - do not block upload acceptance unless product policy requires indexing before
    metadata submit
  external_delegation:
  - allowed only through policy:external-delegation-policy
  - external APIs are invoked through system:local-command-processor, not generic
    webhooks
  - OpenAI-compatible APIs may use system:openai-compatible-api-processor when prompt,
    headers, and response schema are configured
  - local and native extractors are preferred for private content
  - cloud document AI, vision, and translation commands are opt-in per tenant and
    file role
  processors:
  - selected processors follow policy:processor-execution-policy
  - required pre_accept extraction can block upload acceptance only when product policy
    needs facts before metadata submit
  - OpenAI-compatible processor output may summarize, classify, analyze images, or
    produce OCR-like JSON when configured
  - post_accept extraction should write data:extracted-content or data:processor-result
    artifacts asynchronously
  limits:
  - maximum extracted bytes
  - maximum characters
  - maximum pages
  - maximum OCR pages
  - maximum metadata fields
  references:
  - data:extracted-content
  - flow:text-extraction-generation
  - flow:ocr-extraction-generation
  - system:text-extractor
  - system:ocr-engine
  - system:external-processing-delegates
  - system:local-command-processor
  - system:openai-compatible-api-processor
  - policy:external-delegation-policy
  - policy:processor-execution-policy
  - policy:metadata-stripping-policy
