id: policy:shared-key-policy
type: policy
title: Shared Key Policy
summary: Shared key policy defines capability-token creation, storage, and resolution
  for proxy downloads.
facts:
  legacy_body: "Shared key policy defines capability-token creation, storage, and\
    \ resolution for proxy downloads.\n\n```yaml\nconfiguration:\n  enable_shared_key:\n\
    \    type: bool\n    default: false\n    meaning: backend API can create and resolve\
    \ data:shared-key-record\n  shared_key_bits:\n    type: int\n    default: 128\n\
    \    minimum: 96\n    meaning: random entropy before URL-safe encoding\n  shared_key_prefix:\n\
    \    type: string\n    default: .streamuploader/shared/\n    meaning: S3 control\
    \ prefix for data:shared-key-record\n  default_ttl:\n    type: duration or empty\n\
    \    default: empty\n    meaning: default shared key expiration when create request\
    \ omits expires_at and ttl_seconds\n    empty_behavior: no automatic expiration\n\
    \    env_overrides:\n      - SHARED_KEY_TTL\n      - SHARED_KEY_TTL_SECONDS\n\
    \    startup_warning:\n      - log warning when enable_shared_key is true and\
    \ default_ttl is empty\n      - warning explains shared keys are bearer credentials\
    \ and may live forever unless caller supplies expires_at or ttl_seconds\n  max_ttl:\n\
    \    type: duration or empty\n    default: empty\n    meaning: optional upper\
    \ bound for caller-supplied ttl_seconds or expires_at\n    env_overrides:\n  \
    \    - SHARED_KEY_MAX_TTL\n      - SHARED_KEY_MAX_TTL_SECONDS\n  allow_frontend_file_access:\n\
    \    type: bool\n    default: false\n    meaning: frontend API may stream object\
    \ bytes\nsecurity:\n  - shared_key is bearer credential\n  - generate with cryptographic\
    \ randomness\n  - reject creation when enable_shared_key is false\n  - reject\
    \ download when allow_frontend_file_access is false\n  - reject expired or revoked\
    \ records\n  - apply configured default_ttl when backend request omits explicit\
    \ expiry\n  - reject or clamp caller TTL according to max_ttl deployment policy\n\
    \  - do not include target_object_key in shared URL path\n  - avoid logging full\
    \ shared_key in application logs\nrevocation:\n  preferred: delete global data:shared-key-record\
    \ and per-object marker\n  object_delete: delete all matching per-object markers\
    \ and their global records\n  note: one target object may have multiple shared\
    \ keys\naudit_events:\n  - shared_key_create\n  - shared_key_resolve\n  - shared_key_deny\n\
    \  - shared_key_revoke\nreferences:\n  - data:shared-key-record\n  - api:shared-key-api\n\
    \  - api:download-api\n  - policy:object-access-policy\n  - policy:audit-log-policy\n\
    ```"
  configuration:
    enable_shared_key:
      type: bool
      default: false
      meaning: backend API can create and resolve data:shared-key-record
    shared_key_bits:
      type: int
      default: 128
      minimum: 96
      meaning: random entropy before URL-safe encoding
    shared_key_prefix:
      type: string
      default: .streamuploader/shared/
      meaning: S3 control prefix for data:shared-key-record
    default_ttl:
      type: duration or empty
      default: empty
      meaning: default shared key expiration when create request omits expires_at
        and ttl_seconds
      empty_behavior: no automatic expiration
      env_overrides:
      - SHARED_KEY_TTL
      - SHARED_KEY_TTL_SECONDS
      startup_warning:
      - log warning when enable_shared_key is true and default_ttl is empty
      - warning explains shared keys are bearer credentials and may live forever unless
        caller supplies expires_at or ttl_seconds
    max_ttl:
      type: duration or empty
      default: empty
      meaning: optional upper bound for caller-supplied ttl_seconds or expires_at
      env_overrides:
      - SHARED_KEY_MAX_TTL
      - SHARED_KEY_MAX_TTL_SECONDS
    allow_frontend_file_access:
      type: bool
      default: false
      meaning: frontend API may stream object bytes
  security:
  - shared_key is bearer credential
  - generate with cryptographic randomness
  - reject creation when enable_shared_key is false
  - reject download when allow_frontend_file_access is false
  - reject expired or revoked records
  - apply configured default_ttl when backend request omits explicit expiry
  - reject or clamp caller TTL according to max_ttl deployment policy
  - do not include target_object_key in shared URL path
  - avoid logging full shared_key in application logs
  revocation:
    preferred: delete global data:shared-key-record and per-object marker
    object_delete: delete all matching per-object markers and their global records
    note: one target object may have multiple shared keys
  audit_events:
  - shared_key_create
  - shared_key_resolve
  - shared_key_deny
  - shared_key_revoke
  references:
  - data:shared-key-record
  - api:shared-key-api
  - api:download-api
  - policy:object-access-policy
  - policy:audit-log-policy
relations:
- relation: mentions
  to: api:download-api
  resolution: resolved
- relation: mentions
  to: api:shared-key-api
  resolution: resolved
- relation: mentions
  to: data:shared-key-record
  resolution: resolved
- relation: mentions
  to: policy:audit-log-policy
  resolution: resolved
- relation: mentions
  to: policy:object-access-policy
  resolution: resolved
