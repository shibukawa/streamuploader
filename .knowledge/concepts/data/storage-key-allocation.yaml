id: data:storage-key-allocation
type: data
title: Storage Key Allocation
summary: Storage key allocation defines unguessable S3 prefixes and object keys returned
  to clients for capability-style use.
facts:
  legacy_body: "Storage key allocation defines unguessable S3 prefixes and object\
    \ keys returned to clients for capability-style use.\n\n```yaml\nfields:\n  allocation_key:\
    \ opaque id\n  namespace:\n    enum:\n      - global\n      - user_prefixed\n\
    \      - custom_prefixed\n  requested_prefix: client supplied prefix optional\n\
    \  normalized_prefix: sanitized prefix optional\n  random_token:\n    alphabet:\
    \ base62 alphanumeric only\n    entropy_bits: configurable\n    length_chars:\
    \ derived from entropy_bits and alphabet\n  storage_prefix: generated S3 prefix\n\
    \  object_key: generated S3 object key\n  display_key: folder plus file name returned\
    \ to client\n  original_name: client supplied file name optional\n  safe_name:\
    \ sanitized file name\nexamples:\n  google_photos_like:\n    namespace: global\n\
    \    entropy_bits: 238\n    token_length_base62: 40\n  gist_like:\n    namespace:\
    \ user_prefixed\n    entropy_bits: 190\n    token_length_base62: 32\nreferences:\n\
    \  - policy:storage-key-allocation-policy\n  - data:file-item\n```"
  fields:
    allocation_key: opaque id
    namespace:
      enum:
      - global
      - user_prefixed
      - custom_prefixed
    requested_prefix: client supplied prefix optional
    normalized_prefix: sanitized prefix optional
    random_token:
      alphabet: base62 alphanumeric only
      entropy_bits: configurable
      length_chars: derived from entropy_bits and alphabet
    storage_prefix: generated S3 prefix
    object_key: generated S3 object key
    display_key: folder plus file name returned to client
    original_name: client supplied file name optional
    safe_name: sanitized file name
  examples:
    google_photos_like:
      namespace: global
      entropy_bits: 238
      token_length_base62: 40
    gist_like:
      namespace: user_prefixed
      entropy_bits: 190
      token_length_base62: 32
  references:
  - policy:storage-key-allocation-policy
  - data:file-item
relations:
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:storage-key-allocation-policy
  resolution: resolved
