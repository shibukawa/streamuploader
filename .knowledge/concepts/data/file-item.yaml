id: data:file-item
type: data
title: File Item
summary: File item represents one upload key and its eventual S3 object.
facts:
  legacy_body: "File item represents one upload key and its eventual S3 object.\n\n\
    ```yaml\nfields:\n  upload_key: opaque unique key\n  batch_key: optional data:upload-batch\
    \ wait batch key\n  role: optional semantic role\n  original_name: optional client\
    \ file name\n  object_key: S3 object key after storage commit\n  storage_allocation:\
    \ data:storage-key-allocation\n  display_key: folder plus file name returned to\
    \ client\n  content_type: detected or trusted media type\n  declared_content_type:\
    \ client supplied media type optional\n  size_bytes: counted or declared size\n\
    \  uploaded_bytes: counted during stream\n  checksum: optional digest\n  derived_assets:\n\
    \    type: list of data:derived-asset\n  status:\n    enum:\n      - key_created\n\
    \      - uploading\n      - uploaded\n      - rejected\n      - scan_pending\n\
    \      - clean\n      - failed\n      - expired\n      - canceled\n  security_decision:\
    \ allow or reject\n  security_check: data:security-check-result\n  client_temp_id:\
    \ optional UI correlation id\nreferences:\n  - data:upload-batch\n  - api:session-progress-api\n\
    \  - data:storage-key-allocation\n  - policy:file-intake-security\n  - data:derived-asset\n\
    \  - data:security-check-result\n```"
  fields:
    upload_key: opaque unique key
    batch_key: optional data:upload-batch wait batch key
    role: optional semantic role
    original_name: optional client file name
    object_key: S3 object key after storage commit
    storage_allocation: data:storage-key-allocation
    display_key: folder plus file name returned to client
    content_type: detected or trusted media type
    declared_content_type: client supplied media type optional
    size_bytes: counted or declared size
    uploaded_bytes: counted during stream
    checksum: optional digest
    derived_assets:
      type: list of data:derived-asset
    status:
      enum:
      - key_created
      - uploading
      - uploaded
      - rejected
      - scan_pending
      - clean
      - failed
      - expired
      - canceled
    security_decision: allow or reject
    security_check: data:security-check-result
    client_temp_id: optional UI correlation id
  references:
  - data:upload-batch
  - api:session-progress-api
  - data:storage-key-allocation
  - policy:file-intake-security
  - data:derived-asset
  - data:security-check-result
relations:
- relation: mentions
  to: api:session-progress-api
  resolution: resolved
- relation: mentions
  to: data:derived-asset
  resolution: resolved
