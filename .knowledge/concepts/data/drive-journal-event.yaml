id: data:drive-journal-event
type: data
title: Drive journal event
summary: One immutable JSON object per metadata change at journal/{tenant}/{yyyy}/{mm}/{ulid}.json; carries the actor, the event type and the file's full state after the change.
lifecycle: active
facts:
  key: "journal/{tenant}/{yyyy}/{mm}/{ulid}.json - ULID gives time order and uniqueness; the month folder bounds listings"
  fields:
    event_id: the ULID
    tenant_id: string
    type: one of file.created, file.updated, file.versioned, file.deleted, file.restored, file.accessed, view.saved, view.deleted
    actor: API token id or user id; "system" for indexer-generated events
    at: RFC 3339 time from the writer's clock
    file_id: present for file.* events
    state: full data:drive-file-meta after the change (absent for file.accessed)
    access: for file.accessed - object key, kind (download, inline, preview, thumbnail), client address hash
    expected_revision: optional; lets a future conflict check reject stale edits
    upload_facts: for file.created - the streamuploader file fact used at registration
  writers: any server instance; one PUT, no read-before-write
  readers: the indexer (fold) and servers (overlay by StartAfter)
  retention:
    normal: deletable after folding plus grace
    worm: retained under the storage lock forever; the checkpoint chain covers every key
  size: a few KB; full state keeps the overlay simple
  implemented_2026_10_09:
    file_accessed: written by drive/server/access.go in WORM mode with file_id, access {object_key, kind (download, inline, preview, thumbnail), client_hash (first 8 bytes of sha256 of the client IP, hex)}; not a file state, so the indexer and overlay skip it, but it advances the folded cursor and is covered by the checkpoint chain
    file_versioned: written by POST /api/drive/files/{id}/versions; state.versions gains the retired object with event_id = this event
    file_restored: written by POST /api/drive/files/{id}/restore in normal mode
    lock: journal.Store.Lock attaches the object lock to every event in WORM mode
relations:
  - relation: realizes
    to: decision:journal-based-metadata
  - relation: embeds
    to: data:drive-file-meta
  - relation: covered_by
    to: data:audit-checkpoint
  - relation: builds_on
    to: data:metadata-payload
