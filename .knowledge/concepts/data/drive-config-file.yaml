id: data:drive-config-file
type: data
title: Drive configuration file (drive.yaml)
summary: One YAML file per deployment that names the mode, storage, delivery, index and processing settings of a Drive; written by `drive init`, read by `drive serve --config`, validated by a JSON Schema, and overridable key by key through environment variables so that secrets never live in it.
lifecycle: proposed
facts:
  status: deferred by the user on 2026-10-09 ("設定は一旦、.envで"); the .env file generated by init is the configuration surface until the revisit trigger in requirement:drive-init-subcommand facts.delivery.decisions.config-file fires; this design is kept so the file can be introduced without changing the kits' variable names
  precedence: environment variable (SU_* or DRIVE_*) over drive.yaml over built-in default - the same layering internal/config/config.go applies to security.yaml today
  location: --config PATH or DRIVE_CONFIG; when neither is set the binary stays env-only, so existing deployments keep working unchanged
  schema: "drive.schema.json beside the file, generated from the same Go struct; a `# yaml-language-server: $schema=./drive.schema.json` header gives editor completion, as config/security.yaml does; validation uses the santhosh-tekuri/jsonschema dependency already in go.mod"
  sketch:
    version: 1
    name: my-drive
    mode: all-in-one
    listen: ":8080"
    public_base_url: https://drive.example.com
    tenant: default
    prefix: drive/
    storage:
      provider: r2
      bucket: drive
      endpoint: https://<account>.r2.cloudflarestorage.com
      public_endpoint: ""
      region: auto
      force_path_style: false
      credentials: env
    delivery: proxy
    index:
      dir: /tmp/drive-index
      interval: 30s
      tokenizer: lindera
    processing:
      execution_mode: sequential
    security_policy: ./security.yaml
  key_mapping: every key maps to exactly one existing variable - mode has no variable yet and is validated against the implemented set; storage.* to SU_S3_*; delivery, tenant, prefix, index.* to DRIVE_*; processing.execution_mode to the three SU_*_EXECUTION_MODE variables; security_policy to SU_SECURITY_CONFIG; listen to SU_ADDR; public_base_url to SU_PUBLIC_BASE_URL
  mode_values: all-in-one today; server and indexer once system:drive-server implements them; a worm block (variant strict or append_only) once requirement:local-drive-worm-audit-mode lands - unknown values are rejected at load with the knowledge id of the missing capability
  excluded_content: "access keys, API tokens, anything secret; `credentials: env` is the only accepted value in the first slice"
  loader_placement: cmd/drive (provisional) - read, validate, translate to env names, then config.Load; moving the loader into internal/config is possible later without changing the file
relations:
  - relation: produced_by
    to: requirement:drive-init-subcommand
  - relation: read_by
    to: system:drive-server
  - relation: follows_pattern_of
    to: data:security-policy-config
  - relation: constrained_by
    to: requirement:local-drive-portable-deployment
  - relation: mentions
    to: requirement:local-drive-worm-audit-mode
