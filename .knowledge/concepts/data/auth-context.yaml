id: data:auth-context
type: data
title: Auth Context
summary: Auth context carries caller identity and authorization facts produced by
  customizable auth middleware.
facts:
  legacy_body: "Auth context carries caller identity and authorization facts produced\
    \ by customizable auth middleware.\n\n```yaml\npurpose:\n  - give downstream handlers\
    \ stable request-scoped auth facts\n  - avoid coupling core upload logic to one\
    \ identity provider\n  - allow frontend and backend auth implementations to differ\n\
    fields:\n  subject:\n    type: string\n    meaning: user id, service account id,\
    \ or anonymous capability holder\n  tenant_id:\n    type: string optional\n  roles:\n\
    \    type: list string optional\n  scopes:\n    type: list string optional\n \
    \ permissions:\n    type: list string optional\n  object_prefixes:\n    type:\
    \ list string optional\n    meaning: storage key prefixes caller may access\n\
    \  upload_owner:\n    type: string optional\n    meaning: owner token or owner\
    \ id for upload key ownership checks\n  backend_actor:\n    type: string optional\n\
    \    meaning: service account or operator identity for backend audit\n  raw_claims:\n\
    \    type: map optional\n    constraint: do not log secrets or full bearer tokens\n\
    request_binding:\n  - middleware stores data:auth-context in request context\n\
    \  - handlers read typed helper, not provider-specific headers\n  - absent context\
    \ means anonymous unless route policy requires auth\nreferences:\n  - policy:frontend-auth-extension-policy\n\
    \  - policy:backend-auth-extension-policy\n  - policy:jwt-claim-authorization\n\
    \  - policy:audit-log-policy\n```"
  purpose:
  - give downstream handlers stable request-scoped auth facts
  - avoid coupling core upload logic to one identity provider
  - allow frontend and backend auth implementations to differ
  fields:
    subject:
      type: string
      meaning: user id, service account id, or anonymous capability holder
    tenant_id:
      type: string optional
    roles:
      type: list string optional
    scopes:
      type: list string optional
    permissions:
      type: list string optional
    object_prefixes:
      type: list string optional
      meaning: storage key prefixes caller may access
    upload_owner:
      type: string optional
      meaning: owner token or owner id for upload key ownership checks
    backend_actor:
      type: string optional
      meaning: service account or operator identity for backend audit
    raw_claims:
      type: map optional
      constraint: do not log secrets or full bearer tokens
  request_binding:
  - middleware stores data:auth-context in request context
  - handlers read typed helper, not provider-specific headers
  - absent context means anonymous unless route policy requires auth
  references:
  - policy:frontend-auth-extension-policy
  - policy:backend-auth-extension-policy
  - policy:jwt-claim-authorization
  - policy:audit-log-policy
relations:
- relation: mentions
  to: policy:audit-log-policy
  resolution: resolved
- relation: mentions
  to: policy:backend-auth-extension-policy
  resolution: resolved
- relation: mentions
  to: policy:frontend-auth-extension-policy
  resolution: resolved
- relation: mentions
  to: policy:jwt-claim-authorization
  resolution: resolved
