id: data:http-cache-config
type: data
title: HTTP Cache Config
summary: HTTP cache config controls file access cache headers and startup visibility.
facts:
  legacy_body: "HTTP cache config controls file access cache headers and startup visibility.\n\
    \n```yaml\nsource:\n  config:\n    section: http_cache\n  env_overrides:\n   \
    \ mode:\n      - HTTP_CACHE_MODE\n    max_age:\n      - HTTP_CACHE_MAX_AGE\n \
    \     - HTTP_CACHE_MAX_AGE_SECONDS\nschema:\n  http_cache:\n    mode:\n      type:\
    \ string\n      default: private\n      values:\n        - private\n        -\
    \ public\n        - no-store\n      behavior:\n        private: Cache-Control\
    \ private with max-age when configured\n        public: Cache-Control public with\
    \ max-age and s-maxage\n        no-store: Cache-Control no-store\n    max_age:\n\
    \      type: duration\n      default: 24h\n      meaning: used for private and\
    \ public cache modes unless endpoint overrides it\n    s_max_age:\n      type:\
    \ duration or empty\n      default: empty\n      meaning: shared cache max age\
    \ for public mode; empty means same as max_age\n    validators:\n      etag:\n\
    \        default: true\n        meaning: forward storage ETag when available\n\
    \      last_modified:\n        default: true\n        meaning: forward storage\
    \ Last-Modified when available\nstartup_info:\n  - log configured cache mode at\
    \ info level\n  - log max_age and effective s_maxage at info level\n  - log whether\
    \ ETag and Last-Modified forwarding are enabled\nrules:\n  - X-Content-Type-Options:\
    \ nosniff is always emitted on file access responses\n  - placeholder and pending\
    \ derived responses may override to no-store through policy:placeholder-serving-policy\n\
    \  - no-store mode emits no positive max-age\n  - public mode emits s-maxage equal\
    \ to max-age by default\nreferences:\n  - api:download-api\n  - policy:http-cors-header-policy\n\
    \  - policy:placeholder-serving-policy\n```"
  source:
    config:
      section: http_cache
    env_overrides:
      mode:
      - HTTP_CACHE_MODE
      max_age:
      - HTTP_CACHE_MAX_AGE
      - HTTP_CACHE_MAX_AGE_SECONDS
  schema:
    http_cache:
      mode:
        type: string
        default: private
        values:
        - private
        - public
        - no-store
        behavior:
          private: Cache-Control private with max-age when configured
          public: Cache-Control public with max-age and s-maxage
          no-store: Cache-Control no-store
      max_age:
        type: duration
        default: 24h
        meaning: used for private and public cache modes unless endpoint overrides
          it
      s_max_age:
        type: duration or empty
        default: empty
        meaning: shared cache max age for public mode; empty means same as max_age
      validators:
        etag:
          default: true
          meaning: forward storage ETag when available
        last_modified:
          default: true
          meaning: forward storage Last-Modified when available
  startup_info:
  - log configured cache mode at info level
  - log max_age and effective s_maxage at info level
  - log whether ETag and Last-Modified forwarding are enabled
  rules:
  - X-Content-Type-Options: nosniff is always emitted on file access responses
  - placeholder and pending derived responses may override to no-store through policy:placeholder-serving-policy
  - no-store mode emits no positive max-age
  - public mode emits s-maxage equal to max-age by default
  references:
  - api:download-api
  - policy:http-cors-header-policy
  - policy:placeholder-serving-policy
relations:
- relation: mentions
  to: api:download-api
  resolution: resolved
- relation: mentions
  to: policy:http-cors-header-policy
  resolution: resolved
- relation: mentions
  to: policy:placeholder-serving-policy
  resolution: resolved
