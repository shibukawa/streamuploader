id: data:extracted-content
type: data
title: Extracted Content
summary: Extracted content stores search-oriented text, metadata, and OCR output derived
  from an uploaded file.
facts:
  legacy_body: "Extracted content stores search-oriented text, metadata, and OCR output\
    \ derived from an uploaded file.\n\n```yaml\nartifact:\n  default_object_key:\
    \ source object key plus .text.json\n  content_type: application/json; charset=utf-8\n\
    \  shape:\n    texts:\n      type: object\n      meaning: source-keyed text map\
    \ like {\"extracted\":\"...\", \"ocr\":\"...\"}\n      keys:\n        text: direct\
    \ body for plain text-like files when no richer source key is needed\n       \
    \ extracted: full extracted body for Office, PDF, HTML, JSON, CSV, XML, and other\
    \ parser-backed text\n        title: image or document title metadata when present\
    \ and policy allows indexing it\n        description: image or document description\
    \ metadata when present and policy allows indexing it\n        ocr: OCR text from\
    \ image files, image-only PDFs, or rendered document pages\n    sources:\n   \
    \   optional: per-key provenance, backend, page range, offsets, confidence, and\
    \ warnings\n    metadata:\n      optional: allowlisted metadata values that are\
    \ not represented as searchable text\n  examples:\n    plain_text:\n      texts:\n\
    \        text: original normalized UTF-8 text\n    office_or_pdf:\n      texts:\n\
    \        extracted: full normalized extracted text\n    image_with_metadata_and_ocr:\n\
    \      texts:\n        title: optional image title\n        description: optional\
    \ image description\n        ocr: recognized text\nfields:\n  asset_key: derived\
    \ asset key\n  source_file_key: data:file-item key\n  extraction_kind:\n    enum:\n\
    \      - extracted_text\n      - extracted_metadata\n      - ocr_text\n  object_key:\
    \ S3 object key for normalized JSON or text artifact\n  content_type:\n    examples:\n\
    \      - application/json\n      - application/json; charset=utf-8\n      - text/plain;\
    \ charset=utf-8 legacy or backend-local intermediate only\n  language: optional\
    \ BCP47 language tag\n  page_count: optional integer\n  character_count: optional\
    \ integer\n  word_count: optional integer\n  chunks:\n    optional: search index\
    \ chunk descriptors\n  status:\n    enum:\n      - pending\n      - generated\n\
    \      - skipped\n      - failed\n  privacy_classification:\n    enum:\n     \
    \ - public_indexable\n      - private_indexable\n      - internal_only\n     \
    \ - do_not_index\n  error_code: optional\nreferences:\n  - data:file-item\n  -\
    \ data:derived-asset\n  - api:extracted-content-api\n  - flow:text-extraction-generation\n\
    \  - flow:ocr-extraction-generation\n  - policy:search-extraction-policy\n```"
  artifact:
    default_object_key: source object key plus .text.json
    content_type: application/json; charset=utf-8
    shape:
      texts:
        type: object
        meaning: source-keyed text map like {"extracted":"...", "ocr":"..."}
        keys:
          text: direct body for plain text-like files when no richer source key is
            needed
          extracted: full extracted body for Office, PDF, HTML, JSON, CSV, XML, and
            other parser-backed text
          title: image or document title metadata when present and policy allows indexing
            it
          description: image or document description metadata when present and policy
            allows indexing it
          ocr: OCR text from image files, image-only PDFs, or rendered document pages
      sources:
        optional: per-key provenance, backend, page range, offsets, confidence, and
          warnings
      metadata:
        optional: allowlisted metadata values that are not represented as searchable
          text
    examples:
      plain_text:
        texts:
          text: original normalized UTF-8 text
      office_or_pdf:
        texts:
          extracted: full normalized extracted text
      image_with_metadata_and_ocr:
        texts:
          title: optional image title
          description: optional image description
          ocr: recognized text
  fields:
    asset_key: derived asset key
    source_file_key: data:file-item key
    extraction_kind:
      enum:
      - extracted_text
      - extracted_metadata
      - ocr_text
    object_key: S3 object key for normalized JSON or text artifact
    content_type:
      examples:
      - application/json
      - application/json; charset=utf-8
      - text/plain; charset=utf-8 legacy or backend-local intermediate only
    language: optional BCP47 language tag
    page_count: optional integer
    character_count: optional integer
    word_count: optional integer
    chunks:
      optional: search index chunk descriptors
    status:
      enum:
      - pending
      - generated
      - skipped
      - failed
    privacy_classification:
      enum:
      - public_indexable
      - private_indexable
      - internal_only
      - do_not_index
    error_code: optional
  references:
  - data:file-item
  - data:derived-asset
  - api:extracted-content-api
  - flow:text-extraction-generation
  - flow:ocr-extraction-generation
  - policy:search-extraction-policy
relations:
- relation: mentions
  to: api:extracted-content-api
  resolution: resolved
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: flow:ocr-extraction-generation
  resolution: resolved
- relation: mentions
  to: flow:text-extraction-generation
  resolution: resolved
- relation: mentions
  to: policy:search-extraction-policy
  resolution: resolved
