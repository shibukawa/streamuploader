id: concept:upload-experience-improvements
type: concept
title: Upload Experience Improvements
summary: Upload experience improves when the API exposes resumability, progress, service-mediated
  efficient transfer, and clear readiness state.
facts:
  legacy_body: "Upload experience improves when the API exposes resumability, progress,\
    \ service-mediated efficient transfer, and clear readiness state.\n\n```yaml\n\
    improvements:\n  resumable_upload:\n    value: resume large files after network\
    \ failure\n    options:\n      - tus-like protocol\n      - multipart part retry\n\
    \      - client-side chunk manifest\n  immediate_upload:\n    value: reduce final\
    \ submit wait by starting transfer on drag and drop or file selection\n    options:\n\
    \      - create upload keys lazily on first file selection\n      - allocate capability-style\
    \ folder and object key immediately\n      - upload files while user edits metadata\n\
    \      - correlate upload_key with client temporary id\n  progress_visibility:\n\
    \    value: show per-file upload progress, background work, and upload batch readiness\n\
    \    options:\n      - status endpoint\n      - websocket watch channel for dynamic\
    \ upload_key sets\n      - blocking wait endpoint for simple submit flows\n  service_mediated_s3_transfer:\n\
    \    value: keep file checks while using efficient S3 transfer internally\n  \
    \  options:\n      - AWS SDK service-side multipart upload\n      - bounded memory\
    \ streaming from request body to S3 parts\n      - serverless nodes recover state\
    \ from S3 .work sentinel\n  upload_policy_display:\n    value: inform client UI\
    \ without blocking immediate transfer goal\n    options:\n      - session policy\
    \ response\n      - allowed media types\n      - max file count and size\n  background_processing:\n\
    \    value: avoid long request waits\n    options:\n      - async virus scan\n\
    \      - image thumbnail, SVG raster preview, document preview, and video animated\
    \ preview generation\n      - text, metadata, and OCR extraction for search\n\
    \      - configurable pre_accept, post_accept, and on_demand processors\n    \
    \  - local command processors for APIs such as Vision, translation, AWS, GCP,\
    \ or internal services\n      - post-acceptance worker\n      - no-cache placeholder\
    \ for pending derived assets\n      - S3-stored or API-generated placeholder\n\
    \  image_preview:\n    value: let clients show uploaded images before or after\
    \ metadata submit\n    options:\n      - generated thumbnails\n      - AVIF for\
    \ lossy photo-like previews\n      - WebP for lossless graphic previews\n    \
    \  - per-file derived asset status\n      - configurable required or optional\
    \ thumbnail policy\n  svg_preview:\n    value: let clients preview SVG safely\
    \ without rendering untrusted source directly\n    options:\n      - sandboxed\
    \ Inkscape rasterization\n      - active content rejection\n      - lossless WebP\
    \ output\n  document_preview:\n    value: let clients preview PDFs and Office\
    \ files without downloading originals\n    options:\n      - PDF page thumbnails\n\
    \      - Office to PDF conversion\n      - first page rendered preview\n  search_extraction:\n\
    \    value: prepare uploaded files for search engines or application metadata\
    \ without hardcoding every provider\n    options:\n      - extracted text from\
    \ Word, PDF, HTML, text, JSON, and CSV\n      - EXIF and document metadata extraction\
    \ with allowlist or denylist\n      - opt-in OCR for images and image-only PDFs\n\
    \      - normalized UTF-8 text and chunk descriptors\n      - data:processor-result\
    \ JSON merged into configured metadata paths\n  video_preview:\n    value: let\
    \ clients inspect videos without downloading originals\n    options:\n      -\
    \ ffmpeg animated preview\n      - short muted clip\n      - animated WebP, GIF,\
    \ or APNG output\n  cleanup:\n    value: control abandoned sessions without separate\
    \ durable storage\n    options:\n      - S3 .work sentinel object\n      - session\
    \ prefix sweeper\n      - expiry grace period\n  customizable_keys:\n    value:\
    \ support capability-style sharing and sender controlled grouping\n    options:\n\
    \      - cryptographic random base62 folder token\n      - global namespace with\
    \ high entropy token\n      - user or sender prefix plus random token\n      -\
    \ folder plus file name returned to metadata form\n  download_variants:\n    value:\
    \ reduce repeated download bandwidth with background generated variants\n    options:\n\
    \      - zstd precompressed variant object\n      - Content-Encoding on variant\
    \ only\n      - optional original replacement mode for storage savings\n     \
    \ - serve by Accept-Encoding\n      - skip already compressed media\n  share_and_audit:\n\
    \    value: support revocable share URLs and access traceability\n    options:\n\
    \      - API-level short URL alias\n      - key rotation and revocation\n    \
    \  - audit log for access and deny events\n  processing_reliability:\n    value:\
    \ make expensive workers observable and retryable\n    options:\n      - queue\
    \ with retry and dead letter\n      - webhook failure hooks\n      - status surface\
    \ for failed terminal jobs\n  dedupe_and_privacy:\n    value: reduce storage and\
    \ privacy leaks\n    options:\n      - checksum dedupe with ref counts\n     \
    \ - EXIF and metadata stripping\n      - cautious delete after ref count reaches\
    \ zero\n  advanced_delivery:\n    value: improve large media downloads and playback\n\
    \    options:\n      - API proxy byte range\n      - HLS generation for video\n\
    references:\n  - api:upload-api\n  - api:session-progress-api\n  - flow:session-assembly\n\
    \  - policy:processor-execution-policy\n  - system:local-command-processor\n \
    \ - flow:drag-drop-immediate-upload\n  - decision:upload-transport-boundary\n\
    \  - decision:serverless-upload-state\n  - flow:image-thumbnail-generation\n \
    \ - flow:svg-preview-generation\n  - flow:document-preview-generation\n  - flow:video-preview-generation\n\
    \  - policy:preview-generation-policy\n  - policy:preview-format-policy\n  - policy:search-extraction-policy\n\
    \  - flow:text-extraction-generation\n  - flow:ocr-extraction-generation\n  -\
    \ policy:work-sentinel-cleanup\n  - policy:storage-key-allocation-policy\n  -\
    \ policy:download-variant-policy\n  - flow:download-variant-generation\n  - flow:security-gated-upload-acceptance\n\
    \  - api:derived-asset-serving-api\n  - policy:placeholder-serving-policy\n  -\
    \ policy:object-access-policy\n  - policy:jwt-claim-authorization\n  - api:share-url-api\n\
    \  - api:download-api\n  - policy:share-url-policy\n  - policy:audit-log-policy\n\
    \  - policy:worker-queue-policy\n  - policy:checksum-dedupe-policy\n  - policy:metadata-stripping-policy\n\
    \  - policy:webhook-policy\n  - flow:hls-generation\n```"
  improvements:
    resumable_upload:
      value: resume large files after network failure
      options:
      - tus-like protocol
      - multipart part retry
      - client-side chunk manifest
    immediate_upload:
      value: reduce final submit wait by starting transfer on drag and drop or file
        selection
      options:
      - create upload keys lazily on first file selection
      - allocate capability-style folder and object key immediately
      - upload files while user edits metadata
      - correlate upload_key with client temporary id
    progress_visibility:
      value: show per-file upload progress, background work, and upload batch readiness
      options:
      - status endpoint
      - websocket watch channel for dynamic upload_key sets
      - blocking wait endpoint for simple submit flows
    service_mediated_s3_transfer:
      value: keep file checks while using efficient S3 transfer internally
      options:
      - AWS SDK service-side multipart upload
      - bounded memory streaming from request body to S3 parts
      - serverless nodes recover state from S3 .work sentinel
    upload_policy_display:
      value: inform client UI without blocking immediate transfer goal
      options:
      - session policy response
      - allowed media types
      - max file count and size
    background_processing:
      value: avoid long request waits
      options:
      - async virus scan
      - image thumbnail, SVG raster preview, document preview, and video animated
        preview generation
      - text, metadata, and OCR extraction for search
      - configurable pre_accept, post_accept, and on_demand processors
      - local command processors for APIs such as Vision, translation, AWS, GCP, or
        internal services
      - post-acceptance worker
      - no-cache placeholder for pending derived assets
      - S3-stored or API-generated placeholder
    image_preview:
      value: let clients show uploaded images before or after metadata submit
      options:
      - generated thumbnails
      - AVIF for lossy photo-like previews
      - WebP for lossless graphic previews
      - per-file derived asset status
      - configurable required or optional thumbnail policy
    svg_preview:
      value: let clients preview SVG safely without rendering untrusted source directly
      options:
      - sandboxed Inkscape rasterization
      - active content rejection
      - lossless WebP output
    document_preview:
      value: let clients preview PDFs and Office files without downloading originals
      options:
      - PDF page thumbnails
      - Office to PDF conversion
      - first page rendered preview
    search_extraction:
      value: prepare uploaded files for search engines or application metadata without
        hardcoding every provider
      options:
      - extracted text from Word, PDF, HTML, text, JSON, and CSV
      - EXIF and document metadata extraction with allowlist or denylist
      - opt-in OCR for images and image-only PDFs
      - normalized UTF-8 text and chunk descriptors
      - data:processor-result JSON merged into configured metadata paths
    video_preview:
      value: let clients inspect videos without downloading originals
      options:
      - ffmpeg animated preview
      - short muted clip
      - animated WebP, GIF, or APNG output
    cleanup:
      value: control abandoned sessions without separate durable storage
      options:
      - S3 .work sentinel object
      - session prefix sweeper
      - expiry grace period
    customizable_keys:
      value: support capability-style sharing and sender controlled grouping
      options:
      - cryptographic random base62 folder token
      - global namespace with high entropy token
      - user or sender prefix plus random token
      - folder plus file name returned to metadata form
    download_variants:
      value: reduce repeated download bandwidth with background generated variants
      options:
      - zstd precompressed variant object
      - Content-Encoding on variant only
      - optional original replacement mode for storage savings
      - serve by Accept-Encoding
      - skip already compressed media
    share_and_audit:
      value: support revocable share URLs and access traceability
      options:
      - API-level short URL alias
      - key rotation and revocation
      - audit log for access and deny events
    processing_reliability:
      value: make expensive workers observable and retryable
      options:
      - queue with retry and dead letter
      - webhook failure hooks
      - status surface for failed terminal jobs
    dedupe_and_privacy:
      value: reduce storage and privacy leaks
      options:
      - checksum dedupe with ref counts
      - EXIF and metadata stripping
      - cautious delete after ref count reaches zero
    advanced_delivery:
      value: improve large media downloads and playback
      options:
      - API proxy byte range
      - HLS generation for video
  references:
  - api:upload-api
  - api:session-progress-api
  - flow:session-assembly
  - policy:processor-execution-policy
  - system:local-command-processor
