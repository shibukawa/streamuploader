id: api:drive-api
type: api
title: Drive API
summary: Same-origin REST API under /api/drive used by the web UI, generated clients and the CLI; upload itself stays on the streamuploader endpoints.
lifecycle: active
facts:
  auth: "Authorization: Bearer <api token> or the UI session cookie; no per-user permissions yet"
  endpoints:
    register_file:
      method: POST
      path: /api/drive/files
      body: {upload: "file fact from POST /api/upload/wait", tags: [], author: "optional", location: "optional", name: "optional rename"}
      effect: file.created event; returns data:drive-file-meta
    get_file:
      method: GET
      path: "/api/drive/files/{id}"
      response: data:drive-file-meta plus presigned URLs for thumbnail, content, download, preview
    update_file:
      method: PATCH
      path: "/api/drive/files/{id}"
      body: {name, tags, author, location, expected_revision}
      effect: file.updated event; 405 in WORM strict
    delete_file:
      method: DELETE
      path: "/api/drive/files/{id}"
      effect: file.deleted tombstone; purge after grace; 405 in WORM
    restore_file:
      method: POST
      path: "/api/drive/files/{id}/restore"
    new_version:
      method: POST
      path: "/api/drive/files/{id}/versions"
      body: {upload: "file fact of the new upload"}
      effect: file.versioned event; the only edit path in WORM
    search:
      method: GET
      path: /api/drive/search
      query: {q, facet, facet_prefix, author, type, from, to, bbox, sort, cursor, limit}
      response: {hits: [{file, best_page, snippets, score}], facets: {...}, next_cursor}
    facets:
      method: GET
      path: /api/drive/facets
      query: {path, depth, q, filters}
      response: {children: [{path, count, representative}]}
    content:
      method: GET
      path: "/api/drive/files/{id}/content | /download | /preview | /thumbnail"
      behavior: 302 to a presigned URL by default; proxied bytes with a file.accessed event in WORM mode
    bulk_zip:
      method: GET
      path: "/api/drive/files/zip?ids=..."
      behavior: delegates to the streamuploader multi-file zip download
    views:
      method: GET | POST | DELETE
      path: "/api/drive/views[/{id}]"
      effect: view.saved and view.deleted events
    journal_export:
      method: GET
      path: /api/drive/journal
      query: {since, until, type}
      behavior: streams events as JSON lines; audit use
    checkpoints:
      method: GET
      path: "/api/drive/checkpoints[/{n}]"
    reindex:
      method: POST
      path: /api/drive/admin/reindex
      behavior: triggers the indexer rebuild; operator token only
  pagination: opaque cursor encoding sort key and offset
  errors: JSON {code, message}; codes include revision_conflict, worm_readonly, not_registered
  openapi: generated from the Go handlers; TypeScript client for the UI, Go client for the CLI
  implemented_2026_10_08:
    done: register_file, get_file, update_file (plus clear_location), delete_file, search (q, tag, facet, exact, sort, limit, offset), facets, content/download/preview/thumbnail (proxy or presigned), stats, admin reindex, web UI at / and /ui/
    not_yet: restore_file, new_version, bulk_zip, views, journal_export, checkpoints, OpenAPI document and generated clients, API tokens
relations:
  - relation: implements
    to: requirement:local-drive-api-and-web-ui
  - relation: builds_on
    to: api:upload-api
  - relation: builds_on
    to: api:async-task-wait-api
  - relation: builds_on
    to: api:download-api
  - relation: builds_on
    to: api:derived-asset-serving-api
  - relation: returns
    to: data:drive-file-meta
  - relation: writes
    to: data:drive-journal-event
  - relation: constrained_by
    to: policy:worm-enforcement
