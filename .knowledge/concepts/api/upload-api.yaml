id: api:upload-api
type: api
title: Upload API
summary: Upload API issues upload keys, accepts file bytes, and lets clients watch
  upload progress before submitting application metadata elsewhere.
facts:
  legacy_body: "Upload API issues upload keys, accepts file bytes, and lets clients\
    \ watch upload progress before submitting application metadata elsewhere.\n\n\
    ```yaml\nbase_path:\n  default: /api/upload\n  configurable: true\nendpoints:\n\
    \  create_upload_key:\n    method: POST\n    path: \"{base_path}/keys\"\n    body:\n\
    \      file_name: string\n      content_type: string optional\n      size_bytes:\
    \ integer optional\n      role: string optional\n      prefix: string required\
    \ only when policy:storage-key-allocation-policy requires caller prefix\n    \
    \  key_namespace: global or user_prefixed or custom_prefixed optional\n    response:\n\
    \      upload_key: opaque unique key\n      expires_at: timestamp for upload start\
    \ validity from policy:upload-key-deadline-policy\n      upload_url: service content\
    \ endpoint, not client-visible S3 URL\n      storage_prefix: generated folder\
    \ prefix\n      object_key: generated folder plus safe file name\n      display_key:\
    \ key returned for metadata payload\n      max_upload_bytes: effective maximum\
    \ upload body size after global and policy:resource-limit-policy caps\n    behavior:\n\
    \      - reject when declared size_bytes exceeds max_upload_bytes before issuing\
    \ an upload key\n      - reject when the owner already has max_upload_keys_per_owner\
    \ active key_created or uploading keys\n      - create S3-backed upload deadline\
    \ marker before response\n      - marker stores upload_start_deadline and upload_finish_deadline\n\
    \  upload_file:\n    method: PUT\n    path: \"{base_path}/keys/{upload_key}/content\"\
    \n    behavior:\n      - read upload deadline marker before accepting body\n \
    \     - reject if upload_start_deadline has passed\n      - wrap request processing\
    \ in context deadline using upload_finish_deadline\n      - receive bytes through\
    \ service boundary\n      - inspect prefix before storage commit\n      - reject\
    \ declared MIME and magic-header mismatch with JSON error\n      - run policy:file-intake-security\n\
    \      - run policy:file-type-sanitization-policy before storage upload when sanitizer\
    \ transforms bytes or chunk-only checks can decide early\n      - stream sanitized\
    \ or accepted bytes to system:s3-storage\n      - update data:file-item state\n\
    \    errors:\n      content_type_mismatch:\n        status: 415\n        body:\n\
    \          error: content_type_mismatch\n          message: declared content type\
    \ does not match detected content type\n      detected_type_unknown:\n       \
    \ status: 415\n        body:\n          error: detected_type_unknown\n       \
    \   message: uploaded content type could not be detected\n      script_upload_rejected:\n\
    \        status: 415\n        body:\n          error: script_upload_rejected\n\
    \          message: detected script family, expected script MIME, and opt-in setting\
    \ hint\n      content_type_denied:\n        status: 415\n        body:\n     \
    \     error: content_type_denied\n          message: uploaded content type is\
    \ denied\n      content_type_not_allowed:\n        status: 415\n        body:\n\
    \          error: content_type_not_allowed\n          message: uploaded content\
    \ type is not allowed\n      prefix_read_failed:\n        status: 400\n      \
    \  body:\n          error: prefix_read_failed\n          message: uploaded content\
    \ prefix could not be read\n      upload_key_expired:\n        status: 410\n \
    \       body:\n          error: upload_key_expired\n          message: upload\
    \ key start deadline has passed\n      upload_deadline_exceeded:\n        status:\
    \ 408\n        body:\n          error: upload_deadline_exceeded\n          message:\
    \ upload did not finish before deadline\n      file_sanitization_policy_violation:\n\
    \        status: 415\n        body:\n          error: file_sanitization_policy_violation\n\
    \          message: uploaded file violates configured file type sanitization policy\n\
    \      resource_limit_exceeded:\n        status: 413\n        body:\n        \
    \  error: resource_limit_exceeded\n          message: uploaded file exceeds configured\
    \ resource limits\n      structural_validation_failed:\n        status: 415\n\
    \        body:\n          error: structural_validation_failed\n          message:\
    \ uploaded file is malformed or structurally inconsistent\n  cancel_upload_key:\n\
    \    method: DELETE\n    path: \"{base_path}/keys/{upload_key}\"\n    behavior:\n\
    \      - require policy:frontend-upload-cancel-policy owner cookie match\n   \
    \   - allow only data:file-item status key_created\n      - delete upload deadline\
    \ marker when present\n      - set status to canceled\n      - reject uploading\
    \ or uploaded keys\n    errors:\n      owner_mismatch:\n        status: 403\n\
    \        body:\n          error: owner_mismatch\n          message: upload key\
    \ belongs to another client\n      upload_already_started:\n        status: 409\n\
    \        body:\n          error: upload_already_started\n          message: upload\
    \ key can be canceled only before upload starts\n  wait_uploads:\n    method:\
    \ POST\n    path: \"{base_path}/wait\"\n    body:\n      upload_keys: list of\
    \ upload_key\n      timeout_seconds: optional\n    behavior:\n      - verify requested\
    \ upload keys exist and belong to current caller context when auth is delegated\n\
    \      - block until all requested uploads reach terminal success or failure or\
    \ timeout\n      - when data:thumbnail-generation-config execution_mode is sequential,\
    \ include thumbnail terminal state in readiness\n      - when data:thumbnail-generation-config\
    \ execution_mode is async, do not wait for thumbnail completion\n      - return\
    \ durable file facts for frontend metadata submission\n  watch_uploads:\n    method:\
    \ GET\n    path: \"{base_path}/watch\"\n    protocol: websocket\n    behavior:\n\
    \      - client opens a bidirectional status channel\n      - client sends upload_key\
    \ additions at any time\n      - server returns current status immediately for\
    \ each watched key\n      - server keeps sending progress and terminal state updates\
    \ for watched keys\n      - final file facts are included when an upload key reaches\
    \ uploaded or clean state\n  status:\n    method: GET\n    path: \"{base_path}/keys/{upload_key}\"\
    \n    response: data:file-item\nremoved:\n  - streamuploader does not accept application\
    \ metadata\n  - streamuploader does not submit or forward metadata to system:application-server\n\
    \  - streamuploader does not expose client-visible S3 presigned upload URLs\n\
    \  - streamuploader public API does not expose object delete, rename, replace,\
    \ or purge operations\n  - wait endpoint does not stream progress\nreferences:\n\
    \  - data:file-item\n  - data:upload-batch\n  - data:storage-key-allocation\n\
    \  - data:thumbnail-generation-config\n  - data:security-check-result\n  - flow:session-assembly\n\
    \  - flow:security-gated-upload-acceptance\n  - api:session-progress-api\n  -\
    \ decision:upload-transport-boundary\n  - decision:mime-detector-library\n  -\
    \ policy:storage-key-allocation-policy\n  - policy:file-intake-security\n  - policy:file-type-sanitization-policy\n\
    \  - policy:resource-limit-policy\n  - policy:structural-validation-policy\n \
    \ - policy:upload-key-deadline-policy\n  - policy:frontend-upload-cancel-policy\n\
    \  - api:backend-control-api\n  - requirement:application-metadata-submit\n```"
  base_path:
    default: /api/upload
    configurable: true
  endpoints:
    create_upload_key:
      method: POST
      path: '{base_path}/keys'
      body:
        file_name: string
        content_type: string optional
        size_bytes: integer optional
        role: string optional
        prefix: string required only when policy:storage-key-allocation-policy requires
          caller prefix
        key_namespace: global or user_prefixed or custom_prefixed optional
      response:
        upload_key: opaque unique key
        expires_at: timestamp for upload start validity from policy:upload-key-deadline-policy
        upload_url: service content endpoint, not client-visible S3 URL
        storage_prefix: generated folder prefix
        object_key: generated folder plus safe file name
        display_key: key returned for metadata payload
        max_upload_bytes: effective maximum upload body size after global and policy:resource-limit-policy
          caps
      behavior:
      - reject when declared size_bytes exceeds max_upload_bytes before issuing an
        upload key
      - reject when the owner already has max_upload_keys_per_owner active key_created
        or uploading keys
      - create S3-backed upload deadline marker before response
      - marker stores upload_start_deadline and upload_finish_deadline
    upload_file:
      method: PUT
      path: '{base_path}/keys/{upload_key}/content'
      behavior:
      - read upload deadline marker before accepting body
      - reject if upload_start_deadline has passed
      - wrap request processing in context deadline using upload_finish_deadline
      - receive bytes through service boundary
      - inspect prefix before storage commit
      - reject declared MIME and magic-header mismatch with JSON error
      - run policy:file-intake-security
      - run policy:file-type-sanitization-policy before storage upload when sanitizer
        transforms bytes or chunk-only checks can decide early
      - stream sanitized or accepted bytes to system:s3-storage
      - update data:file-item state
      errors:
        content_type_mismatch:
          status: 415
          body:
            code: content_type_mismatch
            detail: declared content type does not match detected content type
        detected_type_unknown:
          status: 415
          body:
            code: detected_type_unknown
            detail: uploaded content type could not be detected
        script_upload_rejected:
          status: 415
          body:
            code: script_upload_rejected
            detail: detected script family, expected script MIME, and opt-in setting
              hint
        content_type_denied:
          status: 415
          body:
            code: content_type_denied
            detail: uploaded content type is denied
        content_type_not_allowed:
          status: 415
          body:
            code: content_type_not_allowed
            detail: uploaded content type is not allowed
        prefix_read_failed:
          status: 400
          body:
            code: prefix_read_failed
            detail: uploaded content prefix could not be read
        upload_key_expired:
          status: 410
          body:
            code: upload_key_expired
            detail: upload key start deadline has passed
        upload_deadline_exceeded:
          status: 408
          body:
            code: upload_deadline_exceeded
            detail: upload did not finish before deadline
        file_sanitization_policy_violation:
          status: 415
          body:
            code: file_sanitization_policy_violation
            detail: uploaded file violates configured file type sanitization policy
        resource_limit_exceeded:
          status: 413
          body:
            code: resource_limit_exceeded
            detail: uploaded file exceeds configured resource limits
        structural_validation_failed:
          status: 415
          body:
            code: structural_validation_failed
            detail: uploaded file is malformed or structurally inconsistent
    cancel_upload_key:
      method: DELETE
      path: '{base_path}/keys/{upload_key}'
      behavior:
      - require policy:frontend-upload-cancel-policy owner cookie match
      - allow only data:file-item status key_created
      - delete upload deadline marker when present
      - set status to canceled
      - reject uploading or uploaded keys
      errors:
        owner_mismatch:
          status: 403
          body:
            code: owner_mismatch
            detail: upload key belongs to another client
        upload_already_started:
          status: 409
          body:
            code: upload_already_started
            detail: upload key can be canceled only before upload starts
    wait_uploads:
      method: POST
      path: '{base_path}/wait'
      body:
        upload_keys: list of upload_key
        timeout_seconds: optional
      behavior:
      - verify requested upload keys exist and belong to current caller context when
        auth is delegated
      - block until all requested uploads reach terminal success or failure or timeout
      - when data:thumbnail-generation-config execution_mode is sequential, include
        thumbnail terminal state in readiness
      - when data:thumbnail-generation-config execution_mode is async, do not wait
        for thumbnail completion
      - return durable file facts for frontend metadata submission
    watch_uploads:
      method: GET
      path: '{base_path}/watch'
      protocol: websocket
      behavior:
      - client opens a bidirectional status channel
      - client sends upload_key additions at any time
      - server returns current status immediately for each watched key
      - server keeps sending progress and terminal state updates for watched keys
      - final file facts are included when an upload key reaches uploaded or clean
        state
    status:
      method: GET
      path: '{base_path}/keys/{upload_key}'
      response: data:file-item
  removed:
  - streamuploader does not accept application metadata
  - streamuploader does not submit or forward metadata to system:application-server
  - streamuploader does not expose client-visible S3 presigned upload URLs
  - streamuploader public API does not expose object delete, rename, replace, or purge
    operations
  - wait endpoint does not stream progress
  references:
  - data:file-item
  - data:upload-batch
  - data:storage-key-allocation
  - data:thumbnail-generation-config
  - data:security-check-result
  - flow:session-assembly
  - flow:security-gated-upload-acceptance
  - api:session-progress-api
  - decision:upload-transport-boundary
  - decision:mime-detector-library
  - policy:storage-key-allocation-policy
  - policy:file-intake-security
  - policy:file-type-sanitization-policy
  - policy:resource-limit-policy
  - policy:structural-validation-policy
  - policy:upload-key-deadline-policy
  - policy:frontend-upload-cancel-policy
  - api:backend-control-api
  - requirement:application-metadata-submit
  error_body: RFC 9457 problem document (application/problem+json) with type, title, status, detail and code; code carries the stable value listed under errors, detail the message (decision:web-framework)
