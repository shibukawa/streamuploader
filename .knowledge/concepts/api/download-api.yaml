id: api:download-api
type: api
title: File Access API
summary: File Access API is separate from api:upload-api and exposes file content
  plus future derived retrieval.
facts:
  legacy_body: "File Access API is separate from api:upload-api and exposes file content\
    \ plus future derived retrieval.\n\n```yaml\nbase_paths:\n  upload_api: /api/upload\n\
    \  frontend_file_api: /api/file\n  frontend_files_api: /api/files\n  backend_file_api:\
    \ /internal/file\npath_rules:\n  key: object key path encoded for URL path use\n\
    \  keys: comma-separated URL path escaped object keys for archive download\n \
    \ content_suffix: /content returns original file bytes without forced attachment\n\
    \  download_suffix: /download returns original file bytes with attachment Content-Disposition\n\
    \  comma_separator:\n    - comma separates keys only in /api/files/{keys}\n  \
    \  - literal comma inside object key must be percent-encoded\n  reserved_segments:\n\
    \    - shared\n  reason:\n    - keep upload mutation routes isolated\n    - leave\
    \ room for thumbnails, previews, variants, and metadata\nendpoints:\n  get_content_proxy:\n\
    \    method: GET\n    path: /api/file/{key}/content\n    config_gate: allow_frontend_file_access\n\
    \    delivery_mode: api_proxy_download\n    response:\n      content_disposition:\
    \ absent unless source metadata requires otherwise\n      headers:\n        -\
    \ X-Content-Type-Options: nosniff\n        - ETag when storage provides it\n \
    \       - Last-Modified when storage provides it\n        - Cache-Control from\
    \ data:http-cache-config\n    behavior:\n      - reject unless policy:object-access-policy\
    \ allows api_proxy_download\n      - stream original object bytes through streamuploader\
    \ frontend API\n      - allow browser inline rendering for images, PDF, text,\
    \ and other renderable types\n      - do not force attachment download\n     \
    \ - hide bucket endpoint and object storage credentials\n      - support Range\
    \ and If-Range when enabled\n      - emit audit event\n  get_download_proxy:\n\
    \    method: GET\n    path: /api/file/{key}/download\n    config_gate: allow_frontend_file_access\n\
    \    delivery_mode: api_proxy_download\n    response:\n      content_disposition:\
    \ attachment with file name\n      headers:\n        - X-Content-Type-Options:\
    \ nosniff\n        - ETag when storage provides it\n        - Last-Modified when\
    \ storage provides it\n        - Cache-Control from data:http-cache-config\n \
    \   behavior:\n      - same object streaming rules as get_content_proxy\n    \
    \  - force browser download when user navigates to endpoint\n  get_shared_content:\n\
    \    method: GET\n    path: /api/file/shared/{shared_key}/content\n    config_gate:\
    \ enable_shared_key and allow_frontend_file_access\n    delivery_mode: shared_key_proxy_download\n\
    \    response:\n      content_disposition: absent unless source metadata requires\
    \ otherwise\n      headers:\n        - X-Content-Type-Options: nosniff\n     \
    \   - ETag when storage provides it\n        - Last-Modified when storage provides\
    \ it\n        - Cache-Control from data:http-cache-config\n    behavior:\n   \
    \   - resolve api:shared-key-api\n      - stream target object through streamuploader\
    \ frontend API\n      - allow browser inline rendering\n      - do not force attachment\
    \ download\n      - deny expired, revoked, or malformed shared key records\n \
    \ get_shared_download:\n    method: GET\n    path: /api/file/shared/{shared_key}/download\n\
    \    config_gate: enable_shared_key and allow_frontend_file_access\n    delivery_mode:\
    \ shared_key_proxy_download\n    response:\n      content_disposition: attachment\
    \ with file name\n      headers:\n        - X-Content-Type-Options: nosniff\n\
    \        - ETag when storage provides it\n        - Last-Modified when storage\
    \ provides it\n        - Cache-Control from data:http-cache-config\n    behavior:\n\
    \      - resolve api:shared-key-api\n      - stream target object through streamuploader\
    \ frontend API\n      - force browser download when user navigates to endpoint\n\
    \      - deny expired, revoked, or malformed shared key records\n  get_zip_archive:\n\
    \    method: GET\n    path: /api/files/{keys}\n    config_gate: allow_frontend_file_access\n\
    \    delivery_mode: api_proxy_download\n    query:\n      filename: optional archive\
    \ file name, default files.zip\n    response:\n      content_type: application/zip\n\
    \      content_disposition: attachment archive name\n      headers:\n        -\
    \ X-Content-Type-Options: nosniff\n        - Cache-Control from data:http-cache-config\n\
    \    behavior:\n      - parse keys as comma-separated encoded object keys\n  \
    \    - authorize every key with same frontend file access policy\n      - stream\
    \ zip archive without staging full archive when possible\n      - preserve each\
    \ original file name when metadata is available\n      - reject request when key\
    \ count or estimated bytes exceed archive policy limits\n      - emit one archive\
    \ audit event plus per-object entries when configured\n  create_presigned_url:\n\
    \    method: POST\n    path: /internal/file/presigned-url\n    delivery_mode:\
    \ s3_presigned_download\n    body:\n      object_key: required S3 object key\n\
    \      file_name: optional download name\n      ttl_seconds: optional bounded\
    \ TTL\n    response:\n      url: S3 presigned GET URL\n      expires_at: timestamp\n\
    \    behavior:\n      - backend API asks S3 for presigned GET URL\n      - caller\
    \ returns or redirects to URL\n      - bucket can stay private\n      - api:extracted-content-api\
    \ may reuse this behavior for source object key plus .text.json\n  get_thumbnail:\n\
    \    method: GET\n    path: /api/file/{key}/thumbnail\n    alternate_path: /api/file/{key}/thumbnail/{preset}\n\
    \    config_gate: allow_frontend_file_access\n    status: future\n    behavior:\n\
    \      - resolve generated thumbnail data:derived-asset\n      - return placeholder\
    \ or generated bytes according to api:derived-asset-serving-api\n      - default\
    \ preset uses data:thumbnail-generation-config object_key_suffix\n  get_variant:\n\
    \    method: GET\n    path: /api/file/{key}/variants/{variant_key}/content\n \
    \   config_gate: allow_frontend_file_access\n    status: future\n    behavior:\n\
    \      - resolve generated or transformed data:derived-asset\n      - stream bytes\
    \ or return readiness placeholder\nrange_support:\n  - pass through byte ranges\
    \ to S3\n  - return 206 Partial Content\n  - preserve Content-Type, Content-Encoding,\
    \ ETag, Last-Modified, and Content-Range\ncache_support:\n  - default to private\
    \ cache for file access responses\n  - prefer validators ETag and Last-Modified\
    \ when storage returns them\n  - support public, private, and no-store response\
    \ modes\n  - when public mode uses max-age, set s-maxage to same value unless\
    \ explicitly configured otherwise\narchive_support:\n  - range requests do not\
    \ apply to generated zip archive\n  - archive generation should stream from S3\
    \ objects into zip writer\n  - duplicate archive entry names must be disambiguated\
    \ deterministically\ndemo_modes:\n  - direct_public_bucket bypasses streamuploader\
    \ and is implemented by demo app\n  - s3_presigned_download\n  - api_proxy_download\n\
    \  - shared_key_proxy_download\nnon_api_modes:\n  direct_public_bucket:\n    owner:\
    \ demo app\n    behavior:\n      - demo app builds public S3 or CDN URL from configured\
    \ public bucket endpoint and object_key\n      - browser accesses S3 or CDN directly\n\
    \      - streamuploader is not called for URL creation or byte serving\nreferences:\n\
    \  - policy:object-access-policy\n  - policy:shared-key-policy\n  - api:shared-key-api\n\
    \  - api:derived-asset-serving-api\n  - api:extracted-content-api\n  - data:thumbnail-generation-config\n\
    \  - policy:audit-log-policy\n  - data:http-cache-config\n```"
  base_paths:
    upload_api: /api/upload
    frontend_file_api: /api/file
    frontend_files_api: /api/files
    backend_file_api: /internal/file
  path_rules:
    key: object key path encoded for URL path use
    keys: comma-separated URL path escaped object keys for archive download
    content_suffix: /content returns original file bytes without forced attachment
    download_suffix: /download returns original file bytes with attachment Content-Disposition
    comma_separator:
    - comma separates keys only in /api/files/{keys}
    - literal comma inside object key must be percent-encoded
    reserved_segments:
    - shared
    reason:
    - keep upload mutation routes isolated
    - leave room for thumbnails, previews, variants, and metadata
  endpoints:
    get_content_proxy:
      method: GET
      path: /api/file/{key}/content
      config_gate: allow_frontend_file_access
      delivery_mode: api_proxy_download
      response:
        content_disposition: absent unless source metadata requires otherwise
        headers:
        - X-Content-Type-Options: nosniff
        - ETag when storage provides it
        - Last-Modified when storage provides it
        - Cache-Control from data:http-cache-config
      behavior:
      - reject unless policy:object-access-policy allows api_proxy_download
      - stream original object bytes through streamuploader frontend API
      - allow browser inline rendering for images, PDF, text, and other renderable
        types
      - do not force attachment download
      - hide bucket endpoint and object storage credentials
      - support Range and If-Range when enabled
      - emit audit event
    get_download_proxy:
      method: GET
      path: /api/file/{key}/download
      config_gate: allow_frontend_file_access
      delivery_mode: api_proxy_download
      response:
        content_disposition: attachment with file name
        headers:
        - X-Content-Type-Options: nosniff
        - ETag when storage provides it
        - Last-Modified when storage provides it
        - Cache-Control from data:http-cache-config
      behavior:
      - same object streaming rules as get_content_proxy
      - force browser download when user navigates to endpoint
    get_shared_content:
      method: GET
      path: /api/file/shared/{shared_key}/content
      config_gate: enable_shared_key and allow_frontend_file_access
      delivery_mode: shared_key_proxy_download
      response:
        content_disposition: absent unless source metadata requires otherwise
        headers:
        - X-Content-Type-Options: nosniff
        - ETag when storage provides it
        - Last-Modified when storage provides it
        - Cache-Control from data:http-cache-config
      behavior:
      - resolve api:shared-key-api
      - stream target object through streamuploader frontend API
      - allow browser inline rendering
      - do not force attachment download
      - deny expired, revoked, or malformed shared key records
    get_shared_download:
      method: GET
      path: /api/file/shared/{shared_key}/download
      config_gate: enable_shared_key and allow_frontend_file_access
      delivery_mode: shared_key_proxy_download
      response:
        content_disposition: attachment with file name
        headers:
        - X-Content-Type-Options: nosniff
        - ETag when storage provides it
        - Last-Modified when storage provides it
        - Cache-Control from data:http-cache-config
      behavior:
      - resolve api:shared-key-api
      - stream target object through streamuploader frontend API
      - force browser download when user navigates to endpoint
      - deny expired, revoked, or malformed shared key records
    get_zip_archive:
      method: GET
      path: /api/files/{keys}
      config_gate: allow_frontend_file_access
      delivery_mode: api_proxy_download
      query:
        filename: optional archive file name, default files.zip
      response:
        content_type: application/zip
        content_disposition: attachment archive name
        headers:
        - X-Content-Type-Options: nosniff
        - Cache-Control from data:http-cache-config
      behavior:
      - parse keys as comma-separated encoded object keys
      - authorize every key with same frontend file access policy
      - stream zip archive without staging full archive when possible
      - preserve each original file name when metadata is available
      - reject request when key count or estimated bytes exceed archive policy limits
      - emit one archive audit event plus per-object entries when configured
    create_presigned_url:
      method: POST
      path: /internal/file/presigned-url
      delivery_mode: s3_presigned_download
      body:
        object_key: required S3 object key
        file_name: optional download name
        ttl_seconds: optional bounded TTL
      response:
        url: S3 presigned GET URL
        expires_at: timestamp
      behavior:
      - backend API asks S3 for presigned GET URL
      - caller returns or redirects to URL
      - bucket can stay private
      - api:extracted-content-api may reuse this behavior for source object key plus
        .text.json
    get_thumbnail:
      method: GET
      path: /api/file/{key}/thumbnail
      alternate_path: /api/file/{key}/thumbnail/{preset}
      config_gate: allow_frontend_file_access
      status: future
      behavior:
      - resolve generated thumbnail data:derived-asset
      - return placeholder or generated bytes according to api:derived-asset-serving-api
      - default preset uses data:thumbnail-generation-config object_key_suffix
    get_variant:
      method: GET
      path: /api/file/{key}/variants/{variant_key}/content
      config_gate: allow_frontend_file_access
      status: future
      behavior:
      - resolve generated or transformed data:derived-asset
      - stream bytes or return readiness placeholder
  range_support:
  - pass through byte ranges to S3
  - return 206 Partial Content
  - preserve Content-Type, Content-Encoding, ETag, Last-Modified, and Content-Range
  cache_support:
  - default to private cache for file access responses
  - prefer validators ETag and Last-Modified when storage returns them
  - support public, private, and no-store response modes
  - when public mode uses max-age, set s-maxage to same value unless explicitly configured
    otherwise
  archive_support:
  - range requests do not apply to generated zip archive
  - archive generation should stream from S3 objects into zip writer
  - duplicate archive entry names must be disambiguated deterministically
  demo_modes:
  - direct_public_bucket bypasses streamuploader and is implemented by demo app
  - s3_presigned_download
  - api_proxy_download
  - shared_key_proxy_download
  non_api_modes:
    direct_public_bucket:
      owner: demo app
      behavior:
      - demo app builds public S3 or CDN URL from configured public bucket endpoint
        and object_key
      - browser accesses S3 or CDN directly
      - streamuploader is not called for URL creation or byte serving
  references:
  - policy:object-access-policy
  - policy:shared-key-policy
  - api:shared-key-api
  - api:derived-asset-serving-api
  - api:extracted-content-api
  - data:thumbnail-generation-config
  - policy:audit-log-policy
  - data:http-cache-config
relations:
- relation: mentions
  to: api:derived-asset-serving-api
  resolution: resolved
- relation: mentions
  to: api:extracted-content-api
  resolution: resolved
- relation: mentions
  to: api:shared-key-api
  resolution: resolved
- relation: mentions
  to: api:upload-api
  resolution: resolved
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:http-cache-config
  resolution: resolved
- relation: mentions
  to: data:thumbnail-generation-config
  resolution: resolved
- relation: mentions
  to: policy:audit-log-policy
  resolution: resolved
- relation: mentions
  to: policy:object-access-policy
  resolution: resolved
- relation: mentions
  to: policy:shared-key-policy
  resolution: resolved
