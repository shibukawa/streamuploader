id: api:health-api
type: api
title: Health API
summary: Health API exposes liveness and readiness checks on public and backend listeners.
facts:
  legacy_body: "Health API exposes liveness and readiness checks on public and backend\
    \ listeners.\n\n```yaml\nendpoints:\n  liveness:\n    method: GET\n    path: /healthz\n\
    \    response:\n      status: ok\n  readiness:\n    method: GET\n    path: /readyz\n\
    \    optional: true\n    response:\n      status: ok or degraded\nlistener_modes:\n\
    \  same_port:\n    - public upload routes, backend control routes, and health\
    \ routes share one listener\n    - /healthz is available on the shared listener\n\
    \  separate_ports:\n    - public upload listener exposes /healthz for frontend-facing\
    \ process health\n    - backend control listener exposes /healthz for backend/control-plane\
    \ health\n    - probes can target either or both listeners\nconstraints:\n  -\
    \ health responses do not expose secrets\n  - backend-only readiness detail is\
    \ returned only on backend listener when enabled\n  - health route must not require\
    \ browser CORS\nreferences:\n  - system:backend-control-listener\n  - system:server-deployment-modes\n\
    ```"
  endpoints:
    liveness:
      method: GET
      path: /healthz
      response:
        status: ok
    readiness:
      method: GET
      path: /readyz
      optional: true
      response:
        status: ok or degraded
  listener_modes:
    same_port:
    - public upload routes, backend control routes, and health routes share one listener
    - /healthz is available on the shared listener
    separate_ports:
    - public upload listener exposes /healthz for frontend-facing process health
    - backend control listener exposes /healthz for backend/control-plane health
    - probes can target either or both listeners
  framework_probes: the Popcorn Web probes (server.health, server.readiness) can be configured on other paths; /healthz stays an application route, so naming it as server.health is refused at startup (decision:web-framework)
  constraints:
  - health responses do not expose secrets
  - backend-only readiness detail is returned only on backend listener when enabled
  - health route must not require browser CORS
  references:
  - system:backend-control-listener
  - system:server-deployment-modes
relations:
- relation: mentions
  to: system:backend-control-listener
  resolution: resolved
- relation: mentions
  to: system:server-deployment-modes
  resolution: resolved
