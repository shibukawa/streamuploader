id: api:shared-key-api
type: api
title: Shared Key API
summary: Shared Key API lets a backend caller create an opaque key and lets api:download-api
  resolve it under /api/file.
facts:
  legacy_body: "Shared Key API lets a backend caller create an opaque key and lets\
    \ api:download-api resolve it under /api/file.\n\n```yaml\nendpoints:\n  create_shared_key:\n\
    \    method: POST\n    path: /internal/file/shared-keys\n    auth: backend control\
    \ authorization\n    config_gate: enable_shared_key\n    body:\n      object_key:\
    \ required S3 object key\n      file_name: optional download file name\n     \
    \ content_type: optional response content type\n      created_by: optional user\
    \ or backend actor id\n      expires_at: optional timestamp\n      ttl_seconds:\
    \ optional bounded TTL\n    response:\n      shared_key: opaque key\n      download_url:\
    \ frontend API URL /api/file/shared/{shared_key}/content\n      expires_at: optional\
    \ timestamp\n    behavior:\n      - generate shared_key with policy:shared-key-policy\
    \ entropy rules\n      - if expires_at and ttl_seconds are omitted, apply configured\
    \ shared key default TTL\n      - if configured default TTL is empty, create non-expiring\
    \ key and rely on startup warning plus backend caller policy\n      - validate\
    \ requested expiry against configured max TTL when present\n      - write global\
    \ data:shared-key-record to S3 control prefix\n      - write per-object data:shared-key-record\
    \ marker to target object directory .shared/{shared_key}\n      - return key and\
    \ URL to backend caller\n  revoke_shared_key:\n    method: DELETE\n    path: /internal/file/shared-keys/{shared_key}\n\
    \    auth: backend control authorization\n    config_gate: enable_shared_key\n\
    \    behavior:\n      - delete global data:shared-key-record\n      - delete per-object\
    \ data:shared-key-record marker when target can be resolved\n  revoke_object_shares:\n\
    \    method: internal\n    caller: backend object delete\n    behavior:\n    \
    \  - list target object directory .shared/ markers\n      - delete markers matching\
    \ target object\n      - delete corresponding global data:shared-key-record objects\n\
    \  resolve_shared_key:\n    method: internal\n    caller: api:download-api get_shared_content\n\
    \    config_gate: enable_shared_key and allow_frontend_file_access\n    behavior:\n\
    \      - load data:shared-key-record from S3 by shared_key path\n      - validate\
    \ expiry and revocation\n      - return target_object_key for proxy streaming\n\
    errors:\n  disabled: 404 or 403 when enable_shared_key is false\n  not_found:\
    \ shared key record missing\n  expired: shared key expired\n  revoked: shared\
    \ key revoked\n  file_access_disabled: allow_frontend_file_access is false\nreferences:\n\
    \  - data:shared-key-record\n  - policy:shared-key-policy\n  - api:download-api\n\
    \  - policy:backend-control-plane-policy\n```"
  endpoints:
    create_shared_key:
      method: POST
      path: /internal/file/shared-keys
      auth: backend control authorization
      config_gate: enable_shared_key
      body:
        object_key: required S3 object key
        file_name: optional download file name
        content_type: optional response content type
        created_by: optional user or backend actor id
        expires_at: optional timestamp
        ttl_seconds: optional bounded TTL
      response:
        shared_key: opaque key
        download_url: frontend API URL /api/file/shared/{shared_key}/content
        expires_at: optional timestamp
      behavior:
      - generate shared_key with policy:shared-key-policy entropy rules
      - if expires_at and ttl_seconds are omitted, apply configured shared key default
        TTL
      - if configured default TTL is empty, create non-expiring key and rely on startup
        warning plus backend caller policy
      - validate requested expiry against configured max TTL when present
      - write global data:shared-key-record to S3 control prefix
      - write per-object data:shared-key-record marker to target object directory
        .shared/{shared_key}
      - return key and URL to backend caller
    revoke_shared_key:
      method: DELETE
      path: /internal/file/shared-keys/{shared_key}
      auth: backend control authorization
      config_gate: enable_shared_key
      behavior:
      - delete global data:shared-key-record
      - delete per-object data:shared-key-record marker when target can be resolved
    revoke_object_shares:
      method: internal
      caller: backend object delete
      behavior:
      - list target object directory .shared/ markers
      - delete markers matching target object
      - delete corresponding global data:shared-key-record objects
    resolve_shared_key:
      method: internal
      caller: api:download-api get_shared_content
      config_gate: enable_shared_key and allow_frontend_file_access
      behavior:
      - load data:shared-key-record from S3 by shared_key path
      - validate expiry and revocation
      - return target_object_key for proxy streaming
  errors:
    disabled: 404 or 403 when enable_shared_key is false
    not_found: shared key record missing
    expired: shared key expired
    revoked: shared key revoked
    file_access_disabled: allow_frontend_file_access is false
  references:
  - data:shared-key-record
  - policy:shared-key-policy
  - api:download-api
  - policy:backend-control-plane-policy
relations:
- relation: mentions
  to: api:download-api
  resolution: resolved
- relation: mentions
  to: data:shared-key-record
  resolution: resolved
- relation: mentions
  to: policy:backend-control-plane-policy
  resolution: resolved
- relation: mentions
  to: policy:shared-key-policy
  resolution: resolved
