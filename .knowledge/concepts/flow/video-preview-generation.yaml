id: flow:video-preview-generation
type: flow
title: Video Preview Generation
summary: Video preview generation creates still and animated preview assets from accepted
  video uploads with ffmpeg.
facts:
  legacy_body: "Video preview generation creates still and animated preview assets\
    \ from accepted video uploads with ffmpeg.\n\n```yaml\nflow:\n  trigger: data:file-item\
    \ uploaded, allowed, and selected by policy:preview-generation-policy\n  eligibility:\n\
    \    - detected content type is allowed video type\n    - file item is clean or\
    \ scan is not required before derivative work\n    - duration, resolution, codec,\
    \ and container are within configured limits\n  steps:\n    - name: probe_video\n\
    \      actions:\n        - run ffprobe in isolated worker\n        - collect duration,\
    \ dimensions, frame rate, codec, and stream metadata\n        - reject unsupported\
    \ or suspicious media\n    - name: try_embedded_thumbnail\n      actions:\n  \
    \      - extract attached picture, cover art, or container thumbnail when present\n\
    \        - validate extracted image with thumbnail safety limits\n        - re-encode\
    \ through policy:preview-format-policy\n        - use it as video_still_thumbnail\
    \ when it is large enough and representative\n    - name: select_clip\n      actions:\n\
    \        - choose representative timestamp or short segment\n        - avoid very\
    \ first black frame when possible\n        - cap frame count and output duration\n\
    \    - name: select_still_keyframe\n      actions:\n        - extract up to data:thumbnail-generation-config\
    \ video_thumbnail candidate_keyframes after probe start\n        - scale each\
    \ candidate to normalized thumbnail bounds before scoring\n        - encode candidates\
    \ to the same still preview format\n        - choose largest encoded candidate\
    \ bytes as proxy for detail and high-frequency content\n        - reject black,\
    \ near-monochrome, tiny, corrupt, or repeated candidates\n        - draw centered\
    \ right-pointing play triangle overlay on final still thumbnail\n    - name: generate_preview\n\
    \      actions:\n        - run ffmpeg with strict resource limits\n        - scale\
    \ to configured max dimensions\n        - remove audio\n        - output configured\
    \ animated preview format\n    - name: store_assets\n      actions:\n        -\
    \ write generated preview to system:s3-storage\n        - record data:derived-asset\
    \ entry\n  outputs:\n    still:\n      - video_still_thumbnail with play overlay\n\
    \    preferred:\n      - animated_webp\n      - animated_avif when supported\n\
    \    compatible:\n      - animated_gif\n      - animated_png\n  failure:\n   \
    \ optional_preview:\n      - keep original file accepted\n      - mark preview\
    \ failed or skipped\n    required_preview:\n      - block ready or commit until\
    \ preview succeeds\n      - return actionable status\nreferences:\n  - policy:preview-generation-policy\n\
    \  - policy:preview-format-policy\n  - data:thumbnail-generation-config\n  - requirement:expanded-thumbnail-source-support\n\
    \  - data:derived-asset\n  - system:media-converter\n  - system:s3-storage\n```"
  flow:
    trigger: data:file-item uploaded, allowed, and selected by policy:preview-generation-policy
    eligibility:
    - detected content type is allowed video type
    - file item is clean or scan is not required before derivative work
    - duration, resolution, codec, and container are within configured limits
    steps:
    - name: probe_video
      actions:
      - run ffprobe in isolated worker
      - collect duration, dimensions, frame rate, codec, and stream metadata
      - reject unsupported or suspicious media
    - name: try_embedded_thumbnail
      actions:
      - extract attached picture, cover art, or container thumbnail when present
      - validate extracted image with thumbnail safety limits
      - re-encode through policy:preview-format-policy
      - use it as video_still_thumbnail when it is large enough and representative
    - name: select_clip
      actions:
      - choose representative timestamp or short segment
      - avoid very first black frame when possible
      - cap frame count and output duration
    - name: select_still_keyframe
      actions:
      - extract up to data:thumbnail-generation-config video_thumbnail candidate_keyframes
        after probe start
      - scale each candidate to normalized thumbnail bounds before scoring
      - encode candidates to the same still preview format
      - choose largest encoded candidate bytes as proxy for detail and high-frequency
        content
      - reject black, near-monochrome, tiny, corrupt, or repeated candidates
      - draw centered right-pointing play triangle overlay on final still thumbnail
    - name: generate_preview
      actions:
      - run ffmpeg with strict resource limits
      - scale to configured max dimensions
      - remove audio
      - output configured animated preview format
    - name: store_assets
      actions:
      - write generated preview to system:s3-storage
      - record data:derived-asset entry
    outputs:
      still:
      - video_still_thumbnail with play overlay
      preferred:
      - animated_webp
      - animated_avif when supported
      compatible:
      - animated_gif
      - animated_png
    failure:
      optional_preview:
      - keep original file accepted
      - mark preview failed or skipped
      required_preview:
      - block ready or commit until preview succeeds
      - return actionable status
  references:
  - policy:preview-generation-policy
  - policy:preview-format-policy
  - data:thumbnail-generation-config
  - requirement:expanded-thumbnail-source-support
  - data:derived-asset
  - system:media-converter
  - system:s3-storage
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
