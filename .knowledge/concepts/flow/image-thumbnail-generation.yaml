id: flow:image-thumbnail-generation
type: flow
title: Image Thumbnail Generation
summary: Image thumbnail generation creates service-owned derived assets for accepted
  image uploads.
facts:
  legacy_body: "Image thumbnail generation creates service-owned derived assets for\
    \ accepted image uploads.\n\n```yaml\nflow:\n  trigger: data:file-item uploaded,\
    \ allowed, data:thumbnail-generation-config enabled true, and selected by policy:preview-generation-policy\n\
    \  eligibility:\n    - detected content type is allowed image type\n    - file\
    \ item is clean or scan is not required before derivative work\n    - image dimensions\
    \ and pixel count are within configured limits\n    - data:thumbnail-generation-config\
    \ size and output policy are valid\n    - source format is thumbnail eligible\
    \ or delegated to a safe extractor\n  source_formats:\n    currently_eligible:\n\
    \      - image/jpeg\n      - image/pjpeg\n      - image/png\n      - image/gif\n\
    \      - image/webp\n      - image/avif\n    target_eligible:\n      - image/tiff\n\
    \      - image/bmp\n      - image/heif\n      - image/heic\n      - image/jp2\n\
    \      - image/jpx\n      - image/jxl\n  steps:\n    - name: create_pending_asset\n\
    \      actions:\n        - allocate image_thumbnail data:derived-asset with object_key\
    \ source object key plus /thumbnail\n        - expose pending status for async\
    \ mode\n    - name: try_embedded_thumbnail\n      actions:\n        - inspect\
    \ EXIF or container thumbnail without trusting metadata\n        - decode extracted\
    \ thumbnail bytes under same byte, pixel, and timeout limits\n        - reject\
    \ embedded thumbnail when too small, corrupt, wrong aspect, or unsupported\n \
    \       - re-encode accepted embedded thumbnail through policy:preview-format-policy\n\
    \        - skip full-image decode when embedded thumbnail satisfies configured\
    \ size and quality threshold\n    - name: decode_image\n      actions:\n     \
    \   - read from system:s3-storage object or streaming tee through io.MultiWriter\
    \ when practical\n        - decode with safe limits\n        - use system:thumbnail-converter\
    \ backend selected at startup\n        - strip untrusted metadata unless explicitly\
    \ preserved\n    - name: generate_variants\n      actions:\n        - create configured\
    \ thumbnail sizes, default 400x400\n        - choose output format using policy:preview-format-policy\n\
    \        - avoid upscaling beyond source dimensions\n    - name: store_assets\n\
    \      actions:\n        - write generated files to system:s3-storage\n      \
    \  - record data:derived-asset entries on data:file-item\n    - name: expose_in_payload\n\
    \      actions:\n        - include generated asset keys in data:metadata-payload\
    \ when required or available\n  failure:\n    optional_thumbnail:\n      - keep\
    \ file upload accepted\n      - mark thumbnail failed or skipped\n    required_thumbnail:\n\
    \      - block ready or commit until generated\n      - return actionable status\n\
    \  execution:\n    sequential:\n      - upload wait waits for generated, skipped,\
    \ or failed thumbnail terminal state\n    async:\n      - upload wait ignores\
    \ thumbnail completion after original upload is accepted\n      - api:derived-asset-serving-api\
    \ may return pending placeholder\nreferences:\n  - data:derived-asset\n  - data:file-item\n\
    \  - data:metadata-payload\n  - data:thumbnail-generation-config\n  - requirement:expanded-thumbnail-source-support\n\
    \  - policy:preview-generation-policy\n  - policy:preview-format-policy\n  - system:thumbnail-converter\n\
    \  - system:s3-storage\n```"
  flow:
    trigger: data:file-item uploaded, allowed, data:thumbnail-generation-config enabled
      true, and selected by policy:preview-generation-policy
    eligibility:
    - detected content type is allowed image type
    - file item is clean or scan is not required before derivative work
    - image dimensions and pixel count are within configured limits
    - data:thumbnail-generation-config size and output policy are valid
    - source format is thumbnail eligible or delegated to a safe extractor
    source_formats:
      currently_eligible:
      - image/jpeg
      - image/pjpeg
      - image/png
      - image/gif
      - image/webp
      - image/avif
      target_eligible:
      - image/tiff
      - image/bmp
      - image/heif
      - image/heic
      - image/jp2
      - image/jpx
      - image/jxl
    steps:
    - name: create_pending_asset
      actions:
      - allocate image_thumbnail data:derived-asset with object_key source object
        key plus /thumbnail
      - expose pending status for async mode
    - name: try_embedded_thumbnail
      actions:
      - inspect EXIF or container thumbnail without trusting metadata
      - decode extracted thumbnail bytes under same byte, pixel, and timeout limits
      - reject embedded thumbnail when too small, corrupt, wrong aspect, or unsupported
      - re-encode accepted embedded thumbnail through policy:preview-format-policy
      - skip full-image decode when embedded thumbnail satisfies configured size and
        quality threshold
    - name: decode_image
      actions:
      - read from system:s3-storage object or streaming tee through io.MultiWriter
        when practical
      - decode with safe limits
      - use system:thumbnail-converter backend selected at startup
      - strip untrusted metadata unless explicitly preserved
    - name: generate_variants
      actions:
      - create configured thumbnail sizes, default 400x400
      - choose output format using policy:preview-format-policy
      - avoid upscaling beyond source dimensions
    - name: store_assets
      actions:
      - write generated files to system:s3-storage
      - record data:derived-asset entries on data:file-item
    - name: expose_in_payload
      actions:
      - include generated asset keys in data:metadata-payload when required or available
    failure:
      optional_thumbnail:
      - keep file upload accepted
      - mark thumbnail failed or skipped
      required_thumbnail:
      - block ready or commit until generated
      - return actionable status
    execution:
      sequential:
      - upload wait waits for generated, skipped, or failed thumbnail terminal state
      async:
      - upload wait ignores thumbnail completion after original upload is accepted
      - api:derived-asset-serving-api may return pending placeholder
  references:
  - data:derived-asset
  - data:file-item
  - data:metadata-payload
  - data:thumbnail-generation-config
  - requirement:expanded-thumbnail-source-support
  - policy:preview-generation-policy
  - policy:preview-format-policy
  - system:thumbnail-converter
  - system:s3-storage
relations:
- relation: mentions
  to: api:derived-asset-serving-api
  resolution: resolved
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: data:metadata-payload
  resolution: resolved
- relation: mentions
  to: data:thumbnail-generation-config
  resolution: resolved
- relation: mentions
  to: policy:preview-format-policy
  resolution: resolved
- relation: mentions
  to: policy:preview-generation-policy
  resolution: resolved
- relation: mentions
  to: requirement:expanded-thumbnail-source-support
  resolution: resolved
- relation: mentions
  to: system:s3-storage
  resolution: resolved
- relation: mentions
  to: system:thumbnail-converter
  resolution: resolved
