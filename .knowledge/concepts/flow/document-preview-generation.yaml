id: flow:document-preview-generation
type: flow
title: Document Preview Generation
summary: Document preview generation creates preview assets for PDFs and Office documents
  through controlled conversion and rendering.
facts:
  legacy_body: "Document preview generation creates preview assets for PDFs and Office\
    \ documents through controlled conversion and rendering.\n\n```yaml\nflow:\n \
    \ trigger: data:file-item uploaded, allowed, and selected by policy:preview-generation-policy\n\
    \  inputs:\n    pdf:\n      - application/pdf\n    office_document:\n      - word\
    \ processor documents\n      - spreadsheets\n      - presentations\n      - OpenDocument\
    \ formats\n  steps:\n    - name: prepare_worker\n      actions:\n        - run\
    \ conversion in isolated worker\n        - enforce CPU, memory, file size, page\
    \ count, and timeout limits\n        - use temporary working directory\n    -\
    \ name: try_embedded_thumbnail\n      actions:\n        - extract package thumbnail\
    \ from Office Open XML documents when available\n        - extract legacy Office\
    \ summary thumbnail when supported by configured tools\n        - validate extracted\
    \ thumbnail under same image safety limits\n        - re-encode to AVIF or WebP\
    \ through policy:preview-format-policy\n        - skip LibreOffice conversion\
    \ when embedded thumbnail satisfies requested preview\n    - name: normalize_to_pdf\n\
    \      actions:\n        - pass PDFs through validation when input is PDF\n  \
    \      - convert Office documents to PDF using headless LibreOffice\n        -\
    \ reject macros or unsafe active content by policy\n    - name: render_preview\n\
    \      actions:\n        - render configured pages, usually first page, with MuPDF\
    \ through system:document-converter\n        - fall back to Poppler only when\
    \ MuPDF is unavailable and Poppler is explicitly installed\n        - on macOS\
    \ optionally use qlmanage or sips as simple thumbnail fallback after PDF validation\
    \ when configured\n        - generate thumbnail image variants\n        - strip\
    \ document metadata from generated images\n    - name: store_assets\n      actions:\n\
    \        - store preview images in system:s3-storage\n        - optionally store\
    \ normalized PDF if policy allows\n        - record data:derived-asset entries\n\
    \  failure:\n    optional_preview:\n      - keep original file accepted\n    \
    \  - mark preview failed or skipped\n    required_preview:\n      - block ready\
    \ or commit until preview succeeds\n      - return status with conversion or render\
    \ error\nreferences:\n  - policy:preview-generation-policy\n  - policy:preview-format-policy\n\
    \  - data:thumbnail-generation-config\n  - requirement:expanded-thumbnail-source-support\n\
    \  - data:derived-asset\n  - system:document-converter\n  - system:s3-storage\n\
    ```"
  flow:
    trigger: data:file-item uploaded, allowed, and selected by policy:preview-generation-policy
    inputs:
      pdf:
      - application/pdf
      office_document:
      - word processor documents
      - spreadsheets
      - presentations
      - OpenDocument formats
    steps:
    - name: prepare_worker
      actions:
      - run conversion in isolated worker
      - enforce CPU, memory, file size, page count, and timeout limits
      - use temporary working directory
    - name: try_embedded_thumbnail
      actions:
      - extract package thumbnail from Office Open XML documents when available
      - extract legacy Office summary thumbnail when supported by configured tools
      - validate extracted thumbnail under same image safety limits
      - re-encode to AVIF or WebP through policy:preview-format-policy
      - skip LibreOffice conversion when embedded thumbnail satisfies requested preview
    - name: normalize_to_pdf
      actions:
      - pass PDFs through validation when input is PDF
      - convert Office documents to PDF using headless LibreOffice
      - reject macros or unsafe active content by policy
    - name: render_preview
      actions:
      - render configured pages, usually first page, with MuPDF through system:document-converter
      - fall back to Poppler only when MuPDF is unavailable and Poppler is explicitly
        installed
      - on macOS optionally use qlmanage or sips as simple thumbnail fallback after
        PDF validation when configured
      - generate thumbnail image variants
      - strip document metadata from generated images
    - name: store_assets
      actions:
      - store preview images in system:s3-storage
      - optionally store normalized PDF if policy allows
      - record data:derived-asset entries
    failure:
      optional_preview:
      - keep original file accepted
      - mark preview failed or skipped
      required_preview:
      - block ready or commit until preview succeeds
      - return status with conversion or render error
  references:
  - policy:preview-generation-policy
  - policy:preview-format-policy
  - data:thumbnail-generation-config
  - requirement:expanded-thumbnail-source-support
  - data:derived-asset
  - system:document-converter
  - system:s3-storage
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: data:thumbnail-generation-config
  resolution: resolved
- relation: mentions
  to: policy:preview-format-policy
  resolution: resolved
- relation: mentions
  to: policy:preview-generation-policy
  resolution: resolved
- relation: mentions
  to: requirement:expanded-thumbnail-source-support
  resolution: resolved
- relation: mentions
  to: system:document-converter
  resolution: resolved
- relation: mentions
  to: system:s3-storage
  resolution: resolved
history:
  bdf-migration-2026-10-07:
    summary: PDF and OOXML thumbnails, search text and previews moved in-process to bdf (requirement:bdf-document-processing). LibreOffice, mutool, pdftotext and the embedded OOXML thumbnail path were removed; statements below about them are historical.
    supersedes: [requirement:bdf-document-processing]
