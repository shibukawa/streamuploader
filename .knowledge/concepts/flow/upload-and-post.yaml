id: flow:upload-and-post
type: flow
title: Upload And Post
summary: Upload flow streams file bytes to S3 and returns storage facts; application
  metadata submit is performed by the frontend against the application server.
facts:
  legacy_body: "Upload flow streams file bytes to S3 and returns storage facts; application\
    \ metadata submit is performed by the frontend against the application server.\n\
    \n```yaml\nflow:\n  trigger: client obtains upload_key and sends file bytes\n\
    \  steps:\n    - name: accept_upload\n      actions:\n        - validate upload_key\n\
    \        - open file stream with request size limits\n        - start request-scoped\
    \ context\n    - name: inspect_prefix\n      actions:\n        - read bounded\
    \ prefix\n        - run policy:file-intake-security\n        - replay prefix into\
    \ S3 stream\n    - name: run_parallel_work\n      parallel:\n        file_upload:\n\
    \          - multipart upload to system:s3-storage\n          - compute checksum\
    \ and byte count during streaming\n          - return object key after complete\
    \ multipart upload\n        progress:\n          - publish api:session-progress-api\
    \ events\n          - update data:file-item state\n    - name: finalize_upload_key\n\
    \      actions:\n        - persist durable object key, size, checksum, and content\
    \ type\n        - mark upload_key uploaded or failed\n    - name: respond\n  \
    \    actions:\n        - return data:file-item facts\n        - client may later\
    \ call api:upload-api wait_uploads\n  failure:\n    upload_fails:\n      - abort\
    \ multipart upload\n      - mark upload_key failed\n      - do not affect application\
    \ metadata because streamuploader does not post it\n```"
  flow:
    trigger: client obtains upload_key and sends file bytes
    steps:
    - name: accept_upload
      actions:
      - validate upload_key
      - open file stream with request size limits
      - start request-scoped context
    - name: inspect_prefix
      actions:
      - read bounded prefix
      - run policy:file-intake-security
      - replay prefix into S3 stream
    - name: run_parallel_work
      parallel:
        file_upload:
        - multipart upload to system:s3-storage
        - compute checksum and byte count during streaming
        - return object key after complete multipart upload
        progress:
        - publish api:session-progress-api events
        - update data:file-item state
    - name: finalize_upload_key
      actions:
      - persist durable object key, size, checksum, and content type
      - mark upload_key uploaded or failed
    - name: respond
      actions:
      - return data:file-item facts
      - client may later call api:upload-api wait_uploads
    failure:
      upload_fails:
      - abort multipart upload
      - mark upload_key failed
      - do not affect application metadata because streamuploader does not post it
relations:
- relation: mentions
  to: api:session-progress-api
  resolution: resolved
- relation: mentions
  to: api:upload-api
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:file-intake-security
  resolution: resolved
- relation: mentions
  to: system:s3-storage
  resolution: resolved
