id: flow:demo-download-modes
type: flow
title: Demo Download Modes
summary: Demo download modes let users experience direct, presigned, proxy, and shared-key
  delivery for the same uploaded file.
facts:
  legacy_body: "Demo download modes let users experience direct, presigned, proxy,\
    \ and shared-key delivery for the same uploaded file.\n\n```yaml\nmode_selector:\n\
    \  values:\n    - direct_public_bucket\n    - s3_presigned_download\n    - api_proxy_download\n\
    \    - shared_key_proxy_download\nsetup:\n  direct_public_bucket:\n    requirement:\n\
    \      - demo bucket or local S3 emulator is public-readable\n      - demo app\
    \ builds public object URL from bucket endpoint and object_key\n      - streamuploader\
    \ is bypassed after upload facts are stored\n  s3_presigned_download:\n    requirement:\n\
    \      - demo app or streamuploader backend asks S3 for presigned URL\n      -\
    \ browser redirects to returned URL\n  api_proxy_download:\n    requirement:\n\
    \      - streamuploader allow_frontend_file_access true\n      - demo app links\
    \ to /api/file/{key}/content\n  shared_key_proxy_download:\n    requirement:\n\
    \      - streamuploader enable_shared_key true\n      - streamuploader allow_frontend_file_access\
    \ true\n      - demo app calls /internal/file/shared-keys through backend control\
    \ path\n      - browser downloads through /api/file/shared/{shared_key}/content\n\
    steps:\n  - user uploads file through api:upload-api\n  - demo app stores data:file-item\
    \ facts\n  - user selects download mode in demo UI\n  - demo app creates direct\
    \ public URL itself or asks API for selected non-direct mode\n  - browser downloads\
    \ bytes from S3, presigned S3, proxy API, or shared-key proxy API\nfuture_file_access:\n\
    \  - thumbnails fit under /api/file/{key}/thumbnail/{preset}\n  - derived file\
    \ variants fit under /api/file/{key}/variants/{variant_key}/content\nreferences:\n\
    \  - api:download-api\n  - api:shared-key-api\n  - policy:object-access-policy\n\
    \  - policy:shared-key-policy\n  - data:file-item\n```"
  mode_selector:
    values:
    - direct_public_bucket
    - s3_presigned_download
    - api_proxy_download
    - shared_key_proxy_download
  setup:
    direct_public_bucket:
      requirement:
      - demo bucket or local S3 emulator is public-readable
      - demo app builds public object URL from bucket endpoint and object_key
      - streamuploader is bypassed after upload facts are stored
    s3_presigned_download:
      requirement:
      - demo app or streamuploader backend asks S3 for presigned URL
      - browser redirects to returned URL
    api_proxy_download:
      requirement:
      - streamuploader allow_frontend_file_access true
      - demo app links to /api/file/{key}/content
    shared_key_proxy_download:
      requirement:
      - streamuploader enable_shared_key true
      - streamuploader allow_frontend_file_access true
      - demo app calls /internal/file/shared-keys through backend control path
      - browser downloads through /api/file/shared/{shared_key}/content
  steps:
  - user uploads file through api:upload-api
  - demo app stores data:file-item facts
  - user selects download mode in demo UI
  - demo app creates direct public URL itself or asks API for selected non-direct
    mode
  - browser downloads bytes from S3, presigned S3, proxy API, or shared-key proxy
    API
  future_file_access:
  - thumbnails fit under /api/file/{key}/thumbnail/{preset}
  - derived file variants fit under /api/file/{key}/variants/{variant_key}/content
  references:
  - api:download-api
  - api:shared-key-api
  - policy:object-access-policy
  - policy:shared-key-policy
  - data:file-item
relations:
- relation: mentions
  to: api:download-api
  resolution: resolved
- relation: mentions
  to: api:shared-key-api
  resolution: resolved
- relation: mentions
  to: api:upload-api
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:object-access-policy
  resolution: resolved
- relation: mentions
  to: policy:shared-key-policy
  resolution: resolved
