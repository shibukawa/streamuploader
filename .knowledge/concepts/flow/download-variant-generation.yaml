id: flow:download-variant-generation
type: flow
title: Download Variant Generation
summary: Download variant generation precomputes compressed delivery objects for files
  that benefit from bandwidth reduction.
facts:
  legacy_body: "Download variant generation precomputes compressed delivery objects\
    \ for files that benefit from bandwidth reduction.\n\n```yaml\nflow:\n  trigger:\
    \ data:file-item uploaded, accepted, and selected by policy:download-variant-policy\n\
    \  steps:\n    - name: classify_compressibility\n      actions:\n        - use\
    \ detected content type and optional sampling\n        - skip already compressed\
    \ formats\n        - skip image, audio, video, archive, and zipped Office containers\
    \ by default\n        - estimate benefit versus CPU cost\n    - name: compress_variant\n\
    \      actions:\n        - run zstd worker with configured level and time limits\n\
    \        - enforce max output size and ratio sanity\n        - preserve original\
    \ content type\n    - name: store_or_promote\n      actions:\n        - keep original\
    \ and write separate variant when policy chooses keep_original_and_generate_variant\n\
    \        - rewrite same object key with compressed bytes when policy chooses replace_original_same_key\n\
    \        - write variant then delete original when policy chooses promote_variant_delete_original\n\
    \        - set Content-Encoding only on compressed objects\n        - record data:derived-asset\
    \ entry or update file canonical key\n    - name: expose_variant\n      actions:\n\
    \        - include variant metadata in status and metadata payload when useful\n\
    \        - serving layer selects variant by Accept-Encoding\n  failure:\n    optional_variant:\n\
    \      - keep original file accepted\n      - mark variant skipped or failed\n\
    references:\n  - policy:download-variant-policy\n  - data:derived-asset\n  - system:s3-storage\n\
    ```"
  flow:
    trigger: data:file-item uploaded, accepted, and selected by policy:download-variant-policy
    steps:
    - name: classify_compressibility
      actions:
      - use detected content type and optional sampling
      - skip already compressed formats
      - skip image, audio, video, archive, and zipped Office containers by default
      - estimate benefit versus CPU cost
    - name: compress_variant
      actions:
      - run zstd worker with configured level and time limits
      - enforce max output size and ratio sanity
      - preserve original content type
    - name: store_or_promote
      actions:
      - keep original and write separate variant when policy chooses keep_original_and_generate_variant
      - rewrite same object key with compressed bytes when policy chooses replace_original_same_key
      - write variant then delete original when policy chooses promote_variant_delete_original
      - set Content-Encoding only on compressed objects
      - record data:derived-asset entry or update file canonical key
    - name: expose_variant
      actions:
      - include variant metadata in status and metadata payload when useful
      - serving layer selects variant by Accept-Encoding
    failure:
      optional_variant:
      - keep original file accepted
      - mark variant skipped or failed
  references:
  - policy:download-variant-policy
  - data:derived-asset
  - system:s3-storage
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:download-variant-policy
  resolution: resolved
- relation: mentions
  to: system:s3-storage
  resolution: resolved
