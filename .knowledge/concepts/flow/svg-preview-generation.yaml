id: flow:svg-preview-generation
type: flow
title: SVG Preview Generation
summary: SVG preview generation rasterizes accepted SVG files into safe preview images
  with a sandboxed renderer.
facts:
  legacy_body: "SVG preview generation rasterizes accepted SVG files into safe preview\
    \ images with a sandboxed renderer.\n\n```yaml\nflow:\n  trigger: data:file-item\
    \ uploaded, allowed, and selected by policy:preview-generation-policy\n  eligibility:\n\
    \    - detected content type is SVG\n    - SVG passes policy:file-intake-security\
    \ checks\n    - dimensions and expanded render size are within configured limits\n\
    \  steps:\n    - name: sanitize_svg\n      actions:\n        - reject script,\
    \ event handler, foreignObject, and active content\n        - reject or strip\
    \ external references\n        - cap entity expansion and input size\n    - name:\
    \ rasterize\n      actions:\n        - run sandboxed renderer\n        - prefer\
    \ system:svg-renderer\n        - allow macOS sips fallback only after sanitize_svg\
    \ has produced safe input or rejected unsafe input\n        - render to fixed\
    \ preview sizes\n        - force transparent or configured background\n    - name:\
    \ encode_preview\n      actions:\n        - choose output format using policy:preview-format-policy\n\
    \        - generate static preview asset\n    - name: store_assets\n      actions:\n\
    \        - write generated preview to system:s3-storage\n        - record data:derived-asset\
    \ entry\n  failure:\n    optional_preview:\n      - keep original file accepted\
    \ when policy allows SVG original\n      - mark preview failed or skipped\n  \
    \  required_preview:\n      - block ready or commit until preview succeeds\nreferences:\n\
    \  - policy:preview-generation-policy\n  - policy:preview-format-policy\n  - data:derived-asset\n\
    \  - system:svg-renderer\n  - system:s3-storage\n```"
  flow:
    trigger: data:file-item uploaded, allowed, and selected by policy:preview-generation-policy
    eligibility:
    - detected content type is SVG
    - SVG passes policy:file-intake-security checks
    - dimensions and expanded render size are within configured limits
    steps:
    - name: sanitize_svg
      actions:
      - reject script, event handler, foreignObject, and active content
      - reject or strip external references
      - cap entity expansion and input size
    - name: rasterize
      actions:
      - run sandboxed renderer
      - prefer system:svg-renderer
      - allow macOS sips fallback only after sanitize_svg has produced safe input
        or rejected unsafe input
      - render to fixed preview sizes
      - force transparent or configured background
    - name: encode_preview
      actions:
      - choose output format using policy:preview-format-policy
      - generate static preview asset
    - name: store_assets
      actions:
      - write generated preview to system:s3-storage
      - record data:derived-asset entry
    failure:
      optional_preview:
      - keep original file accepted when policy allows SVG original
      - mark preview failed or skipped
      required_preview:
      - block ready or commit until preview succeeds
  references:
  - policy:preview-generation-policy
  - policy:preview-format-policy
  - data:derived-asset
  - system:svg-renderer
  - system:s3-storage
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:file-intake-security
  resolution: resolved
- relation: mentions
  to: policy:preview-format-policy
  resolution: resolved
- relation: mentions
  to: policy:preview-generation-policy
  resolution: resolved
- relation: mentions
  to: system:s3-storage
  resolution: resolved
- relation: mentions
  to: system:svg-renderer
  resolution: resolved
