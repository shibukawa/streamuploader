id: flow:hls-generation
type: flow
title: HLS Generation
summary: HLS generation creates adaptive streaming derivatives from accepted video
  files.
facts:
  legacy_body: "HLS generation creates adaptive streaming derivatives from accepted\
    \ video files.\n\n```yaml\nflow:\n  trigger: video data:file-item accepted and\
    \ selected by policy:preview-generation-policy or product policy\n  steps:\n \
    \   - name: probe_video\n      actions:\n        - ffprobe duration, resolution,\
    \ codec, bitrate\n    - name: transcode_ladder\n      actions:\n        - generate\
    \ configured renditions\n        - segment to HLS\n        - strip audio when\
    \ policy says preview only\n    - name: store_playlist\n      actions:\n     \
    \   - store master playlist and segments under derived prefix\n        - record\
    \ data:derived-asset entries\n    - name: expose_stream\n      actions:\n    \
    \    - status API exposes HLS playlist key\n        - access policy controls playlist\
    \ and segment delivery\nconstraints:\n  - worker queue required\n  - CPU and duration\
    \ limits\n  - optional DRM or signed segment access is future work\nreferences:\n\
    \  - system:media-converter\n  - policy:worker-queue-policy\n  - policy:object-access-policy\n\
    ```"
  flow:
    trigger: video data:file-item accepted and selected by policy:preview-generation-policy
      or product policy
    steps:
    - name: probe_video
      actions:
      - ffprobe duration, resolution, codec, bitrate
    - name: transcode_ladder
      actions:
      - generate configured renditions
      - segment to HLS
      - strip audio when policy says preview only
    - name: store_playlist
      actions:
      - store master playlist and segments under derived prefix
      - record data:derived-asset entries
    - name: expose_stream
      actions:
      - status API exposes HLS playlist key
      - access policy controls playlist and segment delivery
  constraints:
  - worker queue required
  - CPU and duration limits
  - optional DRM or signed segment access is future work
  references:
  - system:media-converter
  - policy:worker-queue-policy
  - policy:object-access-policy
relations:
- relation: mentions
  to: data:derived-asset
  resolution: resolved
- relation: mentions
  to: data:file-item
  resolution: resolved
- relation: mentions
  to: policy:object-access-policy
  resolution: resolved
- relation: mentions
  to: policy:preview-generation-policy
  resolution: resolved
- relation: mentions
  to: policy:worker-queue-policy
  resolution: resolved
- relation: mentions
  to: system:media-converter
  resolution: resolved
