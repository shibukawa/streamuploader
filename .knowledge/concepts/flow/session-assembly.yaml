id: flow:session-assembly
type: flow
title: Session Assembly
summary: Session assembly watches or waits for independently uploaded keys and returns
  file facts for client-owned metadata submission.
facts:
  legacy_body: "Session assembly watches or waits for independently uploaded keys\
    \ and returns file facts for client-owned metadata submission.\n\n```yaml\nflow:\n\
    \  trigger: client asks api:upload-api to watch or wait for upload keys\n  steps:\n\
    \    - name: issue_upload_keys\n      actions:\n        - create one data:file-item\
    \ per selected file\n        - allocate data:storage-key-allocation per file\n\
    \        - return opaque upload_key, upload_url, display_key, object_key\n   \
    \     - create policy:work-sentinel-cleanup .work sentinel in system:s3-storage\n\
    \    - name: receive_files\n      parallel:\n        uploads:\n          - receive\
    \ bytes through service endpoint, not direct S3\n          - inspect prefix before\
    \ forwarding bytes\n          - run lightweight content detection and archive\
    \ bomb checks\n          - stream each file to system:s3-storage\n          -\
    \ run policy:file-intake-security per file\n    - name: watch_progress\n     \
    \ actions:\n        - client opens api:session-progress-api watch_websocket when\
    \ incremental UI updates are needed\n        - client sends watch messages with\
    \ additional upload_keys as files are selected\n        - server sends snapshot,\
    \ progress, state, and error messages for watched keys\n    - name: evaluate_readiness\n\
    \      actions:\n        - verify all requested upload_keys reached terminal state\n\
    \        - mark batch ready when all requested files are uploaded and allowed\n\
    \    - name: return_file_facts\n      actions:\n        - return display_key,\
    \ object_key, content_type, size, checksum, and status per file\n        - frontend\
    \ submits application metadata plus returned file facts to system:application-server\n\
    \  failure:\n    missing_upload_key:\n      - return status naming unknown or\
    \ expired upload keys\n    expired_session:\n      - reject new bytes\n      -\
    \ cleanup abandoned objects by policy\n    partial_upload_failure:\n      - keep\
    \ successful keys and return failed key statuses\n    abandoned_session:\n   \
    \   - policy:work-sentinel-cleanup removes expired prefix\nreferences:\n  - api:upload-api\n\
    \  - api:session-progress-api\n  - data:upload-batch\n  - data:file-item\n  -\
    \ data:storage-key-allocation\n  - decision:upload-transport-boundary\n  - decision:metadata-submit-trigger\n\
    \  - requirement:application-metadata-submit\n  - decision:derived-asset-readiness-policy\n\
    \  - policy:preview-generation-policy\n  - flow:image-thumbnail-generation\n \
    \ - flow:document-preview-generation\n  - flow:security-gated-upload-acceptance\n\
    \  - policy:work-sentinel-cleanup\n  - policy:storage-key-allocation-policy\n\
    ```"
  flow:
    trigger: client asks api:upload-api to watch or wait for upload keys
    steps:
    - name: issue_upload_keys
      actions:
      - create one data:file-item per selected file
      - allocate data:storage-key-allocation per file
      - return opaque upload_key, upload_url, display_key, object_key
      - create policy:work-sentinel-cleanup .work sentinel in system:s3-storage
    - name: receive_files
      parallel:
        uploads:
        - receive bytes through service endpoint, not direct S3
        - inspect prefix before forwarding bytes
        - run lightweight content detection and archive bomb checks
        - stream each file to system:s3-storage
        - run policy:file-intake-security per file
    - name: watch_progress
      actions:
      - client opens api:session-progress-api watch_websocket when incremental UI
        updates are needed
      - client sends watch messages with additional upload_keys as files are selected
      - server sends snapshot, progress, state, and error messages for watched keys
    - name: evaluate_readiness
      actions:
      - verify all requested upload_keys reached terminal state
      - mark batch ready when all requested files are uploaded and allowed
    - name: return_file_facts
      actions:
      - return display_key, object_key, content_type, size, checksum, and status per
        file
      - frontend submits application metadata plus returned file facts to system:application-server
    failure:
      missing_upload_key:
      - return status naming unknown or expired upload keys
      expired_session:
      - reject new bytes
      - cleanup abandoned objects by policy
      partial_upload_failure:
      - keep successful keys and return failed key statuses
      abandoned_session:
      - policy:work-sentinel-cleanup removes expired prefix
  references:
  - api:upload-api
  - api:session-progress-api
  - data:upload-batch
  - data:file-item
  - data:storage-key-allocation
  - decision:upload-transport-boundary
  - decision:metadata-submit-trigger
  - requirement:application-metadata-submit
  - decision:derived-asset-readiness-policy
  - policy:preview-generation-policy
  - flow:image-thumbnail-generation
  - flow:document-preview-generation
  - flow:security-gated-upload-acceptance
  - policy:work-sentinel-cleanup
  - policy:storage-key-allocation-policy
